<div class="card">
  <div class="card-header header-title">
    <div class="row">
      <div class="col-md-8">
        <h4 class="form-section card-title" translate>Asset Category</h4>
      </div>
    </div>
  </div>
</div>
<div class="ucSearch-Button-Right">
  <span class="mr-1">
    <button type="button" class="backButton" [routerLink]="['../../Configuration/Paging']" skipLocationChange translate>
      <i class="fa fa-arrow-left"> </i> Back 
    </button>
    <button type="button" class="addButton" [routerLink]="['../Detail']"
      [queryParams]="{mode:'add',AssetTypeId:AssetTypeId}" skipLocationChange translate>
      <i class="ft-plus-circle"></i> Add
    </button>
  </span>
</div>
<lib-ucviewgeneric [viewGenericObj]="viewGenericObj"></lib-ucviewgeneric>
<lib-ucpaging [searchObj]="inputPagingObj"></lib-ucpaging>
