<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="RefAssetDocForm"
            (ngSubmit)="RefAssetDocForm.valid && SaveForm()" #enjiForm="ngForm">
            <div class="form-body">
              <h4 class="form-section card-title" translate> Asset Document Master Information</h4>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" translate>Asset Document Code </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AssetDocCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAssetDocForm.controls.AssetDocCode.invalid}">
                  <show-errors [control]="RefAssetDocForm.controls.AssetDocCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" translate>Asset Document Name </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AssetDocName"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAssetDocForm.controls.AssetDocName.invalid}">
                  <show-errors [control]="RefAssetDocForm.controls.AssetDocName" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Active Status</label>
                <div class="col-md-9">
                  <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['../Paging']"
                [queryParams]="{ AssetTypeId: this.AssetTypeId }" translate>
                <i class="fa fa-arrow-left"></i> Back
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far fa-check-square"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
