<div class="ucSearch-Button-Right">
  <span class="mr-1">
    <button type="button" class="backButton" [routerLink]="['/Asset/Scheme/Paging']" translate>
      <i class="ft-arrow-left"></i> Back
    </button>
    <button type="button" class="addButton" [routerLink]="['/Asset/Scheme/AddMember']"
      [queryParams]="{AssetSchmHId:AssetSchmHId}" translate>
      <i class="ft-plus-circle"></i> Add
    </button>
  </span>
</div>

<form class="form form-horizontal">
  <div class="form-body">
    <div class="card">
      <div class="px-3">
        <div class="card-body">
          <h4 class="form-section card-title" translate>Asset Scheme Member</h4>
        </div>
      </div>
    </div>
  </div>
</form>

<lib-ucviewgeneric [viewInput]="viewObj"></lib-ucviewgeneric>
<lib-ucpaging [searchObj]="inputPagingObj"></lib-ucpaging>
