<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="row" style="border-bottom: 1px solid black; margin-bottom: 15px;">
          <div class="col-md-8" style="padding-left: 0px;">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Ref Attribute Detail</h4>
          </div>
        </div>
        <form class="form form-horizontal" [formGroup]="RefAttrForm" #enjiForm="ngForm" novalidate
          (ngSubmit)="enjiForm.form.valid && Save(enjiForm)">
          <div class="form-body">
            <div id="RefAttrSection">
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrCode" translate>Attribute Code</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AttrCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrCode.invalid }"
                    [attr.disabled]="pageType == 'edit' ? true : null" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrCode" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrName" translate>Attribute Name</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AttrName"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrName.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrName" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrLength" translate>Attribute Length</label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput" formControlName="AttrLength"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrLength.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrLength" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrTypeCode" translate>Attribute Type Code</label>
                <div class="col-md-9">
                  <select formControlName="AttrTypeCode" class="form-control"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrTypeCode.invalid }">
                    <option *ngFor="let typeCode of attrTypeCodeList" [value]="typeCode.AttrTypeCode">
                      {{typeCode.AttrTypeName}}
                    </option>
                  </select>
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrTypeCode" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrGroup" translate>Attribute Group</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AttrGroup"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrGroup.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrGroup" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel" for="AttrInputType">Attribute Input Type</label>
                <div class="col-md-9">
                  <select formControlName="AttrInputType" class="form-control" (change)="AttrInputTypeHandler()"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrInputType.invalid }">
                    <option *ngFor="let inputType of attrInputTypeList" [value]="inputType.Key">
                      {{inputType.Value}}
                    </option>
                  </select>
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrInputType" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required" *ngIf="RefAttrForm.contains('AttrValue')">
                <label class="col-md-3 adInsLabel" *ngIf="RefAttrForm.controls.AttrInputType.value == 'L'"
                  for="AttrValue" translate>Attribute Value</label>
                <!-- <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'T'">
                  <input type="text" class="form-control adInsInput" formControlName="AttrValue" 
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrValue.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrValue" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div>
                <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'N'">
                  <input type="number" class="form-control adInsInput" formControlName="AttrValue" 
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrValue.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrValue" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div> -->
                <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'L'" formArrayName="AttrValue">
                  <div class="col-md-12" style="padding: 0;">
                    <button type="button" class="btn btn-raised btn-primary" (click)="AttrValueRowHandler()">
                      <i class="fas fa-plus"></i> Add Value
                    </button>
                  </div>
                  <div class="col-md-12 row" *ngFor="let valueRow of RefAttrForm.get('AttrValue').controls; index as i"
                    style="padding: 0; margin: 5px 0;">
                    <div class="col-md-11" style="padding: 0;">
                      <input type="text" class="form-control adInsInput" formControlName="{{i}}"
                        [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.get('AttrValue').at(i).invalid }" />
                      <lib-uc-show-errors [control]="RefAttrForm.get('AttrValue').at(i)" [submit]="enjiForm.submitted">
                      </lib-uc-show-errors>
                    </div>
                    <div class="col-md-1" style="padding-top: 8px;">
                      <a (click)="RemoveAttrValueRow(i)">
                        <i class="fas fa-times"></i>
                      </a>
                    </div>
                  </div>
                </div>
                <!-- <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'P'">
                  <textarea class="form-control adInsInput" formControlName="AttrValue" 
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrValue.invalid }"></textarea>
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrValue" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div>
                <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'D'">
                  <input type="date" class="form-control adInsInput" formControlName="AttrValue" 
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrValue.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrValue" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div> -->
                <!-- <div class="col-md-9" *ngIf="RefAttrForm.controls.AttrInputType.value == 'A'">
                  <input type="" currencyMask class="form-control adInsInput" formControlName="AttrValue" 
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.AttrValue.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.AttrValue" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div> -->
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="PatternCode" translate>Pattern Code</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="PatternCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.PatternCode.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.PatternCode" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="PatternValue" translate>Pattern Value</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="PatternValue"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.PatternValue.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.PatternValue" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="RsvField1" translate>Reserve Field 1</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RsvField1"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.RsvField1.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.RsvField1" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="RsvField2" translate>Reserve Field 2</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RsvField2"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.RsvField2.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.RsvField2" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="RsvField3" translate>Reserve Field 3</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RsvField3"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.RsvField3.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.RsvField3" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="RsvField4" translate>Reserve Field 4</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RsvField4"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.RsvField4.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.RsvField4" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="RsvField5" translate>Reserve Field 5</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RsvField5"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefAttrForm.controls.RsvField5.invalid }" />
                  <lib-uc-show-errors [control]="RefAttrForm.controls.RsvField5" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="IsSystem">System</label>
                <div class="col-md-9">
                  <input type="checkbox" formControlName="IsSystem">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="isActive">Active Status</label>
                <div class="col-md-9">
                  <input type="checkbox" formControlName="IsActive">
                </div>
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <span class="mr-1">
              <button type="button" class="btn btn-raised btn-warning mr-1" (click)="Back()">
                <i class="far fa-window-close"></i> Cancel
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far fa-check-square"></i> Save
              </button>
            </span>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
