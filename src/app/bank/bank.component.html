<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>
<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span translate class="thead-header" (click)="searchSort($event)" name='bankCode'>Bank Code</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='bankName'>Bank Name</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='regRptCode'>BI Code</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.bankCode}}</td>
        <td class="text-left">{{item.bankName}}</td>
        <td>{{item.regRptCode}}</td>
        <td>
          <span *ngIf="item.isActive == '1'">Yes</span>
          <span *ngIf="item.isActive == '0'">No</span>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/bank/edit']"
            [queryParams]="{key:'REF_BANK_ID',refBankId:item.refBankId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refBankId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
