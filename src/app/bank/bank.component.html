<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>
<div>
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span translate class="thead-header"  (click)="searchSort($event)" name='bankCode'>Bank Code</span></th>
        <th class="text-left pointer"><span translate class="thead-header"  (click)="searchSort($event)" name='bankName'>Bank Name</span></th>
        <th><span translate class="thead-header"  (click)="searchSort($event)"name='biCode'>BI Code</span></th>
        <th><span translate class="thead-header"  (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.bankCode}}</td>
        <td class="text-left">{{item.bankName}}</td>
        <td>{{item.biCode}}</td>
        <td *ngIf="item.isActive === '1'">Yes</td>
        <td *ngIf="item.isActive === '0'">No</td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/bank/add']"
            [queryParams]="{key:'REF_BANK_ID',refBankId:item.refBankId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refBankId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <!-- <i class="fa fa-plus-circle" [routerLink]="['/bank/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i> -->
</div>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
