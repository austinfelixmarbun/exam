<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
  <form>
    <div class="form-actions right">
      <button type="button" class="btn btn-raised btn-warning mr-1" (click)="reset()">
        <i class="ft-x"></i> Cancel
      </button>
      <button type="button" (click)="search()" class="btn btn-raised btn-primary">
        <i class="fa fa-search"></i> Search
      </button>
    </div>
  </form>
</div>
<div>
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th>Bank Code</th>
        <th>Bank Name</th>
        <th>BI Code</th>
        <th>Active</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.returnObject?.data">
        <td>{{item.bankCode}}</td>
        <td>{{item.bankName}}</td>
        <td>{{item.biCode}}</td>
        <td *ngIf="item.isActive === '1'">Yes</td>
        <td *ngIf="item.isActive === '0'">No</td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/bank/add']"
            [queryParams]="{refBankId:item.refBankId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refBankId)">
            <i class="ft-x font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <i class="fa fa-plus-circle" [routerLink]="['/bank/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
</div>
Current Page : {{pageNow}}
<div class="d-flex justify-content-center">
    <ngb-pagination (pageChange)="pageChange($event)" [pageSize]="pageSize" [collectionSize]="totalData"
        [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
</div>
