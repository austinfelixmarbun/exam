<form>
  <div class="form-body">
    <div class="form-group row">
      <label class="col-md-3" translate>Input A </label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="inputA" [(ngModel)]="inputA">
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3" translate>Input B </label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="inputB" [(ngModel)]="inputB" #InputB="ngModel">
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3" translate>Input C </label>
      <label class="col-md-9" translate> {{ inputA }} + {{ inputB }} = {{ inputA + inputB }} / {{ inputC }}</label>
    </div>
  </div>
</form>
