<div class="col-md-12">
  <div class="card">

    <div class="card-header">
      <h4 class="card-title" id="horz-layout-colored-controls" translate>COA</h4>
    </div>

    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="CoaForm" (ngSubmit)="CoaForm.valid && Submit()"
          #enjiForm="ngForm">
          <div class="form-body">

            <lib-ucSubsection [id]="'EntityTypeInfoId'" [title]="'Entity Type Information'" [panel]="'EntityTypeInfo'">
            </lib-ucSubsection>
            <div id='EntityTypeInfo'>

              <div class="form-group row">
                <label class="col-md-3" translate>Entity Type</label>
                <div class="col-md-3">
                  <div class="input-group mb-0">
                    <select class="form-control" #entityselect>
                      <option value="">-Select One-</option>
                      <option *ngFor="let item of entityTypeList" [value]="item.Key">
                        {{item.Value}}
                      </option>
                    </select>

                    <div class="input-group-append">
                      <span class="input-group-btn">
                        <button class="btn btn-raised btn-primary" type="button" (click)="Show(entityselect)">
                          <em class="fa fa-check-square-o"></em>Show
                        </button>
                      </span>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <div *ngIf="Shows">
              <lib-ucSubsection [id]="'CurrInfoId'" [title]="'Currency Information'" [panel]="'CurrInfo'">
              </lib-ucSubsection>
              <div id='CurrInfo'>

                <div class="form-group row">
                  <label class="col-md-3" translate>Currency Code</label>
                  <div class="col-md-3">
                    <div class="input-group mb-0">
                      <select class="form-control" #currselect>
                        <option disabled>-Select One-</option>
                        <option *ngFor="let item of ListCurrCode" [value]="item.Key">
                          {{item.Value}}
                        </option>
                      </select>

                      <div class="input-group-append">
                        <span class="input-group-btn">
                          <button class="btn btn-raised btn-primary" type="button" (click)="Add(currselect)">
                            <em class="fa fa-check-square-o"></em>Add
                          </button>
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

              <lib-ucSubsection [id]="'CoaDetailInfoId'" [title]="'COA Detail Information'" [panel]="'CoaDetailInfo'">
              </lib-ucSubsection>
              <div id='CoaDetailInfo'>

                <div class="table-responsive">
                  <table class="table table-responsive-md text-center table-hover">
                    <caption></caption>
                    <thead>
                      <tr class="table-header">
                        <th id="no">
                          <span class="thead-header" translate>No</span>
                        </th>
                        <th id="entitytype">
                          <span class="thead-header" translate>Entity Type</span>
                        </th>
                        <th id="payalloccode">
                          <span class="thead-header" translate>Payment Allocation Code</span>
                        </th>
                        <th id="entitycode">
                          <span class="thead-header" translate>Entity Code</span>
                        </th>
                        <th id="i" *ngFor="let item of colHeadTable; let i = index">
                          <span class="thead-header" translate>{{item.newHead}}</span>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of ListCOA; let i = index" formArrayName="ListCoa">
                        <ng-container [formGroupName]="i">
                          <td class="text-center">{{i+1}}</td>
                          <td class="text-left">{{item.coa[0].EntityType}}</td>
                          <td class="text-left">{{item.coa[0].PaymentAllocCode}}</td>
                          <td class="text-left">{{item.coa[0].EntityCode}}</td>
                          <ng-container formArrayName="DataCOA">
                            <td class="text-center" *ngFor="let currs of ListCurr; let x = index" [formGroupName]="x">
                              <input type="text" class="form-control" formControlName="COA">
                            </td>
                          </ng-container>
                        </ng-container>
                      </tr>
                    </tbody>
                  </table>
                </div>

              </div>
            </div>

          </div>

          <div class="form-actions right">
            <button type="button" [routerLink]="[CancelLink]" class="btn btn-raised btn-warning mr-1" translate>
              <em class="fa fa-arrow-circle-left"></em> Back
            </button>
            <button type="submit" class="btn btn-raised btn-primary" translate>Submit</button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
