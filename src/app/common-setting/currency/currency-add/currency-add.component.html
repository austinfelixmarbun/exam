<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="RefCurrForm" (ngSubmit)="RefCurrForm.valid && SaveForm()"
                #enjiForm="ngForm">
            <div class="form-body">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Currency {{this.pageType}}</h4>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Currency Code </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="CurrCode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefCurrForm.controls.CurrCode.invalid }">
                  <show-errors [control]="RefCurrForm.controls.CurrCode" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel adins-required" translate>Currency </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="CurrName"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefCurrForm.controls.CurrName.invalid }">
                  <show-errors [control]="RefCurrForm.controls.CurrName" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <!--<div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Rounded Amount </label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput" formControlName="RoundedAmt"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefCurrForm.controls.RoundedAmt.invalid }">
                  <show-errors [control]="RefCurrForm.controls.RoundedAmt" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Minimum Refund Amount </label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput" formControlName="MinRefundAmt"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefCurrForm.controls.MinRefundAmt.invalid }">
                  <show-errors [control]="RefCurrForm.controls.MinRefundAmt" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>!-->
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Bl Code </label>
                <div class="col-md-9">
                  <textarea class="form-control adInsInput" formControlName="RegRptCode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefCurrForm.controls.RegRptCode.invalid }"></textarea>
                  <show-errors [control]="RefCurrForm.controls.RegRptCode" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Active </label>
                <div class="col-md-9">
                  <input class="border-primary" type="checkbox" data-md-icheck
                         formControlName="IsActive" />
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/commonSetting/currency/paging']"
                translate>
                <i class="ft-x"></i> Cancel
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="fa fa-check-square-o"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
