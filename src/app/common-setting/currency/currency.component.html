<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' [enviromentUrl]='urlEnviPaging' [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th class="text-center pointer"><span translate class="thead-header" (click)="searchSort($event)" name='currCode'>Currency Code</span></th>
            <th class="text-center pointer"><span translate class="thead-header" (click)="searchSort($event)" name='currName'>Currency</span></th>
            <th class="text-center pointer"><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
            <th>Exchange Rate</th>
            <th>Edit</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td>{{item.currCode}}</td>
            <td class="text-left">{{item.currName}}</td>
            <td *ngIf="item.isActive === '1'">Yes</td>
            <td *ngIf="item.isActive === '0'">No</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/currency/add']"
                    [queryParams]="{refCurrId:item.refCurrId,exRate:'true'}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
            </td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/currency/add']"
                    [queryParams]="{refCurrId:item.refCurrId,param:'edit'}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
