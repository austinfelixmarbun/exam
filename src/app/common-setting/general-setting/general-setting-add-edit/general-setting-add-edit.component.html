<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="GeneralSettingForm" (ngSubmit)="GeneralSettingForm.valid && SaveForm()"
        #enjiForm="ngForm">
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i> General Setting Edit</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="gsCode">General Setting Code</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="GsCode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && GeneralSettingForm.controls.GsCode.invalid }">
                <show-errors [control]="GeneralSettingForm.controls.GsCode" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="gsName">General Setting Name</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="GsName"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && GeneralSettingForm.controls.GsName.invalid }">
                <show-errors [control]="GeneralSettingForm.controls.GsName" [submit]="enjiForm.submitted"></show-errors>              
              </div>
            </div>

            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="gsValue">General Setting Value</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="GsValue"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && GeneralSettingForm.controls.GsValue.invalid }">
                <show-errors [control]="GeneralSettingForm.controls.GsValue" [submit]="enjiForm.submitted"></show-errors>              
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="gsDescr">General Setting Description</label>
              <div class="col-md-9">
                <textarea class="form-control adInsInput" formControlName="GsDescr"></textarea>
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/CommonSetting/GeneralSetting']">
              <i class="ft-x"></i> Cancel
            </button>
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="far fa-check-square"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
