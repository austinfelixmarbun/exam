<div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header header-title">
          <div class="row">
            <div class="col-md-8">
              <h4 class="card-title" translate>Holiday Scheme </h4>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" [formGroup]="HolidaySchemeHForm" #HolidaySchemeHReqForm="ngForm"
              (ngSubmit)="HolidaySchemeHForm.valid && SaveForm()">
              <lib-ucSubsection [id]="'HolidaySchemeHFormId'" [title]="title" [panel]="'HolidaySchemeHForm'"></lib-ucSubsection>
              <div class="form-body" id="HolidaySchemeHForm">
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" for="HolidaySchemeCode" translate>Holiday Scheme Code </label>
                  <div class="col-md-9">
                    <input type="text" id="HolidaySchemeCode" class="form-control adInsInput code"
                      formControlName="HolidaySchmCode">
                    <show-errors [control]="HolidaySchemeHForm.controls.HolidaySchmCode" [submit]="HolidaySchemeHReqForm.submitted"></show-errors>
                  </div>
                </div>

                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" for="HolidaySchmName" translate>Holiday Scheme Name </label>
                  <div class="col-md-9">
                    <input type="text" id="HolidaySchmName" class="form-control adInsInput name"
                      formControlName="HolidaySchmName">
                    <show-errors [control]="HolidaySchemeHForm.controls.HolidaySchmName" [submit]="HolidaySchemeHReqForm.submitted"></show-errors>
                  </div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 adInsLabel" for="IsActive" translate>Active Status </label>
                  <div class="col-md-9">
                    <input type="checkbox" id="IsActive" class="border-primary"
                      formControlName="IsActive">
                  </div>
                </div>

              </div>
              <div class="form-actions right">
                <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/CommonSetting/Holiday']" translate>
                  <i class=""></i> Cancel
                </button>

                <button type="submit" class="btn btn-raised btn-primary" translate>
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
