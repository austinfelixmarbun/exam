<div class="card-header header-title">
  <div class="row">
    <div class="col-md-8">
      <h4 class="card-title" translate>Holiday Management</h4>
    </div>
    <div class="ucSearch-Button-Right">
      <span class="mr-1">
        <button type="button" class="addButton" [routerLink]="['/CommonSetting/Holiday/add']" translate>
          <i class="ft-plus-circle"></i> Add
        </button>
      </span>
    </div>
  </div>
</div>

<div class="card-body">
  <div class="px-3">
    <form class="form form-horizontal" [formGroup]="HolidayManagementForm" #HolidayManagement="ngForm">
      <lib-ucSubsection [id]="'HolidayManagementId'" [title]="title" [panel]="'HolidayManagement'"></lib-ucSubsection>

      <div class="form-body" id="HolidayManagementId">
        <div class="form-group row adins-required">
          <label class="col-md-3 adInsLabel">Existing Holiday Scheme </label>
          <div class="col-md-9">
            <lib-uclookupgeneric [enjiForm]="HolidayManagement" [lookupInput]="inputPagingObjHolidayScheme" [parentForm]="HolidayManagementForm" [identifier]="'lookupValueHolidayScheme'" (lookup)="getHolidaySchmHId($event)"></lib-uclookupgeneric>
          </div>
        </div> 

        <lib-ucviewgeneric [viewInput]="viewObj"> </lib-ucviewgeneric>
        
        </div>
    </form>
  </div>
</div>
