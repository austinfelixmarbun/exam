<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="card-header header-title">
          <div class="row">
              <div class="col-md-12" style="text-align-last: right">
                <button type="button" class="backButton"  [queryParams]="{param:'edit',holidaySchmHId:holidaySchmHId}" [routerLink]="['/commonSetting/holiday']" translate>
                  <i class="ft-x"></i> Back
                </button>
              </div>
            </div>
        <!-- <div class="row">
          <div class="col-md-12" style="text-align-last: right">
            <button type="button" class="backButton" [queryParams]="{param:'edit',holidaySchmHId:holidaySchmHId}" [routerLink]="['/commonSetting/holiday']" translate>
              <i class="ft-arrow-left"></i> Back
            </button>
          </div>
        </div> -->
      </div>

      

    <div class="px-3">
<h4 class="form-section card-title" translate><i class="ft-file-text"></i> Main Information</h4>
    <div class="form-body" id='MainInfo'>
      <div class="form-group row">
        <div class="col-md-3">
          <label class="label-control" name="HolidaySchmCode" translate>Scheme Code </label>
        </div>
        <div class="col-md-9">
          <label class="label-control" name="HolidaySchmCodeValue" translate>{{holidaySchmCode}}</label>
        </div>
        <div class="col-md-3">
          <label class="label-control" name="HolidaySchmName" translate>Scheme Name</label>
        </div>
        <div class="col-md-9">
          <label class="label-control" name="HolidaySchmNameValue" translate>{{holidaySchmName}}</label>
        </div>
      </div>
    </div>
</div>
  <div *ngIf="editDetail  == 'true'" class="holidayDetail">
    <div class="ucSearch-Button-Right">
        <span class="mr-1">
            <button type="button" class="addButton" [queryParams]="{holidaySchmHId:holidaySchmHId}" [routerLink]="['/commonSetting/holiday/detail']" translate>
                <i class="ft-plus-circle"></i> Add
            </button>
        </span>
    </div>
    <lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)">
    </lib-UCSearch>
  </div>
</div>

<div *ngIf="editDetail  == 'true'" class="holidayDetail">
  <div [hidden]="resultDataSearch?.data == null">
    <table class="table table-responsive-md text-center table-hover">
      <thead>
        <tr class="table-header">
          <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
              name='holidayDt'>Date</span></th>
          <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
              name='Descr'>Description</span></th>
          <th><span translate class="thead-header" (click)="searchSort($event)" name='isPublicHoliday'>Public
              Holiday</span></th>
          <th translate>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of resultDataSearch?.data">
          <td class="text-left">{{item.holidayDt | date: 'dd-MMM-yyyy'}}</td>
          <td class="text-left">{{item.descr}}</td>
          <td>
            <span *ngIf="item.isPublicHoliday == '1'">Yes</span>
            <span *ngIf="item.isPublicHoliday == '0'">No</span>
          </td>
          <td>
            <a class="danger p-0" data-original-title="" title="" (click)="delete(item.holidaySchmDId)">
              <i class="ft-trash-2 font-medium-3 mr-2"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
    <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
  </div>
  <!-- <i class="fa fa-plus-circle" [routerLink]="['/commonSetting/holiday/detail']"
    [queryParams]="{holidaySchmHId:holidaySchmHId}"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i> -->
</div>
</div>
</div>
