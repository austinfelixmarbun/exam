<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
    [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th><span translate class="thead-header" (click)="searchSort($event)" name='holidaySchmCode'>Scheme
                        Code</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='holidaySchmName'>Scheme
                        Name</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'
                    >Active</span></th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td>{{item.holidaySchmCode}}</td>
                <td>{{item.holidaySchmName}}</td>
                <td *ngIf="item.isActive === '1'">Yes</td>
                <td *ngIf="item.isActive === '0'">No</td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/holiday/add']"
                        [queryParams]="{param:'edit',holidaySchmHId:item.holidaySchmHId}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.holidaySchmHId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
