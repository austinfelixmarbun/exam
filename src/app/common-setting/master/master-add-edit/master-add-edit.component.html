<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
          <div class="row">
              <div class="col-md-8">
                  <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Master Information </h4>
              </div>
              <div class="col-md-4" style="text-align-last: right">
                <button type="button" class="backButton" (click)="Back()" translate>
                  <i class="ft-arrow-left"></i> Back
                </button>
              </div>
            </div>
        <form class="form form-horizontal" name="enjiForm" [formGroup]="RefMasterForm" #enjiForm="ngForm" novalidate
          (ngSubmit)="enjiForm.form.valid && Save(enjiForm)">
          <div class="form-body">
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="refMasterTypeCodeModule">Master Type</label>
              <div class="col-md-9">
                <select id="refMasterTypeCodeModule" formControlName="RefMasterTypeCode" class="form-control"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefMasterForm.controls.RefMasterTypeCode.invalid }">
                  <option *ngFor="let item of refMasterTypeObj?.ReturnObject" [value]="item.Key">
                    {{item.Value}}
                  </option>
                </select>
                <show-errors [control]="RefMasterForm.controls.RefMasterTypeCode" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="masterCodeModel">Master Code</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="MasterCode" 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefMasterForm.controls.MasterCode.invalid }"
                  [attr.disabled]="type == 'edit' ? true : null">
                <show-errors [control]="RefMasterForm.controls.MasterCode" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel adins-required" for="descrModel">Description</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="Descr" 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefMasterForm.controls.Descr.invalid }">
                <show-errors [control]="RefMasterForm.controls.Descr" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="seqNo" translate>Seq No </label>
              <div class="col-md-9">
                <input type="text" pattern="^[0-9]+$" class="form-control adInsInput" formControlName="SeqNo" 
                  [ngClass]="{ 'is-invalid':(enjiForm.submitted || RefMasterForm.controls.SeqNo.touched || RefMasterForm.controls.SeqNo.dirty) && RefMasterForm.controls.SeqNo.invalid }">
                <show-errors [control]="RefMasterForm.controls.SeqNo" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="isActive">Active Status</label>
              <div class="custom-control custom-checkbox m-0">
                <input type="checkbox" value="1" id="isActive" formControlName="IsActive">
              </div>
            </div>

          </div>
          <div class="form-actions right">
            <!-- <button *ngIf=" type == 'edit'" type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
              <i class="fa fa-arrow-circle-left"></i> Back
            </button> -->
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
