<div class="ucSearch-Button-Right">
  <span class="mr-1">
      <button type="button" class="addButton" [routerLink]="['/commonSetting/master/detail']" translate>
          <i class="ft-plus-circle"></i> Add
      </button>
  </span>
</div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='masterCode'>Master Code</span></th>
        <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='descr'>Description</span></th>
        <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='seqNo'>Sequence No</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='regRptCode'>Sandi BI</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td class="text-left">{{item.masterCode}}</td>
        <td class="text-left">{{item.descr}}</td>
        <td class="text-left">{{item.seqNo}}</td>
        <td>{{item.biCode}}</td>
        <td>{{item.isActive}}</td>
        <td>
          <div>
            <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/master/detail']"
              [queryParams]="{refMasterId:item.refMasterId,mode:'edit'}">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
            <a *ngIf="item.isDeletable=='1'" class="danger p-0" data-original-title="" title="" (click)="del(item.refMasterId)">
              <i class="ft-trash-2 font-medium-3 mr-2"></i>
            </a>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>

  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>-->
