<h4 class="form-section">Master Maintenance</h4>
<br />
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)" [addCritInput]='addCrit'></app-search>

<div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span class="thead-header" (click)="searchSort($event)" name='masterCode'>Master
            Code</span></th>
        <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
            name='descr'>Description</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='regRptCode'>BI Code</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.masterCode}}</td>
        <td class="text-left">{{item.descr}}</td>
        <td>{{item.regRptCode}}</td>
        <td>{{item.isActive}}</td>
        <td>
          <div *ngIf="item.isSystem === 'No'">
            <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/master/detail']"
              [queryParams]="{refMasterId:item.refMasterId,mode:'edit'}">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
            <a class="danger p-0" data-original-title="" title="" (click)="del(item.refMasterId)">
              <i class="ft-trash-2 font-medium-3 mr-2"></i>
            </a>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
<!--<i class="fa fa-plus-circle" [routerLink]="['/commonSetting/master/detail']"
  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>-->
