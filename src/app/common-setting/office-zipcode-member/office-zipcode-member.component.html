<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>
<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span translate class="thead-header" (click)="searchSort($event)" name='officeCode'>Office Code</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='officeName'>Office Name</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'># Of Zipcode Included</span></th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.officeCode}}</td>
        <td class="text-left">{{item.officeName}}</td>
        <td>{{item.isActive}}</td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/commonSetting/officeZipcodeMember/paging']"
            [queryParams]="{refOfficeId:item.refOfficeId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <!-- <i class="fa fa-plus-circle" [routerLink]="['/bank/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i> -->
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
