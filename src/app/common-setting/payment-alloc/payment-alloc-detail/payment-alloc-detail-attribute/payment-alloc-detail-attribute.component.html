<form class="form form-horizontal" [formGroup]="form" (ngSubmit)="form.valid && SaveForm()" #enjiForm="ngForm">
    <lib-ucSubsection [id]="'AssetAccesoryId'" [title]="'Asset Accesory'" [panel]="'AssetAccesory'"></lib-ucSubsection>
    <div id="AssetAccesory">
        <div class="table-responsive">
            <div class="text-right"><button class="btn-primary-2 btn btn-raised" type="button"
                    (click)="open(content)">Add Attribute
                </button></div>
            <div class="result-text">Total : 1 - 1 of Result</div>
            <table class="table table-striped text-center table-hover table-layout-fixed">
                <thead>
                    <tr class="table-header">
                        <th><span class="thead-header" name="InputDt">Attribute Code</span></th>
                        <th><span class="thead-header" name="Activity">Attribute Name</span></th>
                        <th><span class="thead-header" name="SubActivity">Input Type</span></th>
                        <th><span>Edit</span></th>
                        <th><span>Delete</span></th>
                    </tr>
                </thead>
                <tbody *ngIf="listAttributes.length == 0">
                    <tr>
                        <td colspan="100%">No Data</td>
                    </tr>
                </tbody>
                <tbody>
                    <tr *ngFor="let item of listAttributes; index as i;">
                        <td>22-Sep-2023</td>
                        <td>22-Sep-2023</td>
                        <td>22-Sep-2023</td>
                        <td>
                            <span>
                                <span class="m-1 ">
                                    <a class="success">
                                        <i class="font-medium-3 ft-edit-2" (click)="open(content, i)"></i>
                                    </a>
                                </span>
                            </span>
                        </td>
                        <td>
                            <span>
                                <span class="m-1 ">
                                    <a class="success">
                                        <i class="font-medium-3 ft-edit-2" click></i>
                                    </a>
                                </span>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <ng-template #content let-modal>

        <mat-dialog-container tabindex="-1" aria-modal="true" class="mat-dialog-container" id="role-dialog"
            role="dialog">
            <button aria-label="Close" mat-dialog-close="" type="button" class="close" ng-reflect-aria-label="Close"
                ng-reflect-dialog-result="" ng-reflect-type="button">
                <span aria-hidden="true">×</span>
            </button>
            <div class="container-fluid" style="padding-left: 0px; padding-right: 0px;">
                <div class="row text-left">
                    <div class="col-md-12" style="padding-left: 4px; padding-right: 4px;">
                        <div class="header-title-modal header-title">
                            <div class="row">
                                <div class="col-md-6">
                                    <h4 id="horz-layout-colored-controls" class="card-title">Payment Allocation
                                        Attribute Detail</h4>
                                </div>
                                <div class="col-md-6">
                                    <div class="text-right"><span class="mr-1"></span></div>
                                </div>
                            </div>
                        </div>
                        <div class="card bg-light-blue-card" style="box-shadow: none;">
                            <div class="card-body">
                                <div class="card-wrapper">
                                    <form novalidate="" class="form form-horizontal">
                                        <div class="ucform-class">
                                            <div>
                                                <lib-ucSubsection [id]="'Attribute'" [title]="'Attribute'"
                                                    [panel]="'AttributeId'"></lib-ucSubsection>
                                                <div class="form-body p-3 border-top border-bottom" id="AttributeId">
                                                    <div class="ng-star-inserted">
                                                        <div>
                                                            <div class="form-group row">
                                                                <label class="label-input col-md-12">Attribute
                                                                    Code
                                                                </label>
                                                                <div class="col-md-12">
                                                                    <input class="form-control">
                                                                    <lib-uc-show-errors></lib-uc-show-errors>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <div class="form-group row"><label
                                                                    class="label-input col-md-12">Attribute
                                                                    Name </label>
                                                                <div class="col-md-12"><input class="form-control"
                                                                        id="PaymentAllocAttrName" type=""
                                                                        ng-reflect-name="PaymentAllocAttrName">
                                                                    <div class="message-box">
                                                                        <lib-uc-show-errors
                                                                            class="ng-star-inserted"></lib-uc-show-errors>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <div class="form-group row"><label
                                                                    class="label-input col-md-12">Input
                                                                    Type </label>
                                                                <div class="col-md-12" ng-reflect-ng-switch="DDL">
                                                                    <select
                                                                        class="form-control ng-untouched ng-pristine ng-invalid"
                                                                        style="width: 100%;" id="AttrInputType"
                                                                        ng-reflect-name="AttrInputType">
                                                                        <option value="" ng-reflect-value=""
                                                                            class="ng-star-inserted">
                                                                            Select One</option>
                                                                        <option value="D" ng-reflect-value="D"
                                                                            class="ng-star-inserted">
                                                                            Date </option>
                                                                        <option value="P" ng-reflect-value="P"
                                                                            class="ng-star-inserted">
                                                                            Numeric (UC Input Number
                                                                            Percentage) </option>
                                                                        <option value="L" ng-reflect-value="L"
                                                                            class="ng-star-inserted">
                                                                            List </option>
                                                                        <option value="T" ng-reflect-value="T"
                                                                            class="ng-star-inserted">
                                                                            Text </option>
                                                                        <option value="N" ng-reflect-value="N"
                                                                            class="ng-star-inserted">
                                                                            Numeric (UC Input Number)
                                                                        </option>
                                                                        <option value="TA" ng-reflect-value="TA"
                                                                            class="ng-star-inserted">
                                                                            Paragraph / Text Area
                                                                        </option>
                                                                        <option value="RM" ng-reflect-value="RM"
                                                                            class="ng-star-inserted">
                                                                            Ref Master </option>
                                                                        <option value="SL" ng-reflect-value="SL"
                                                                            class="ng-star-inserted">
                                                                            Search List </option>
                                                                        <option value="NC" ng-reflect-value="NC"
                                                                            class="ng-star-inserted">
                                                                            Numeric (UC Input with
                                                                            Comma) </option>
                                                                    </select>
                                                                    <div class="message-box">
                                                                        <lib-uc-show-errors
                                                                            class="ng-star-inserted"></lib-uc-show-errors>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-actions right">
                                            <button type="button" (click)="modal.close('Cancel')"
                                                class="btn btn-raised btn-outline-2">
                                                <em class="far fa-window-close button-icon mr-2"></em>
                                                Cancel
                                            </button>
                                            <button type="button" (click)="modal.close('Save')"
                                                class="btn btn-raised btn-primary-2">
                                                <em class="far fa-check-square button-icon"></em>
                                                Submit
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </mat-dialog-container>
    </ng-template>
