<div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="px-3">
          <div class="addEdit">
            <form class="form form-horizontal" [formGroup]="RefProfessionForm" (ngSubmit)="RefProfessionForm.valid && SaveForm()"
                  #enjiForm="ngForm">
              <div class="form-body">
                <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Profession {{this.pageType}}</h4>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel adins-required adins-required-label" translate>Profession Code </label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput code" formControlName="ProfessionCode"
                           [ngClass]="{ 'is-invalid': enjiForm.submitted && RefProfessionForm.controls.ProfessionCode.invalid }">
                    <show-errors [control]="RefProfessionForm.controls.ProfessionCode" [submit]="enjiForm.submitted"></show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel adins-required-label" translate>Profession Name </label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput adins-required-label" formControlName="ProfessionName"
                           [ngClass]="{ 'is-invalid': enjiForm.submitted && RefProfessionForm.controls.ProfessionName.invalid }">
                    <show-errors [control]="RefProfessionForm.controls.ProfessionName" [submit]="enjiForm.submitted"></show-errors>
                  </div>
                </div>
                <div class="form-group row">
                    <label class="col-md-3  adInsLabel adins-required adins-required-label" translate>Customer Model Name </label>
                    <div class="col-md-9">
                      <select class="form-control adInsInput" formControlName="MrCustModelCode">
                        <option *ngFor="let ram of allRefProfessionMethod" [ngValue]="ram.Key">
                          {{ram.Value}}
                        </option>
                      </select>
                      <show-errors [control]="RefProfessionForm.controls.MrCustModelCode" [submit]="enjiForm.submitted"></show-errors>
                    </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel adins-required number" translate>BI Code </label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput" formControlName="RegRptCode">
                  </div>
                </div>
              </div>
              <div class="form-actions right">
                <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/CommonSetting/Profession/Paging']"
                  translate>
                  <i class="ft-x"></i> Cancel
                </button>
                <button type="submit" class="btn btn-raised btn-primary" translate>
                  <i class="far fa-check-square"></i> Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
