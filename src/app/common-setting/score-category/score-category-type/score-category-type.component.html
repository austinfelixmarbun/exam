<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="RefScoreCategoryTypeForm" #enjiForm="ngForm"
          (ngSubmit)="RefScoreCategoryTypeForm.valid && Save()">
          <lib-ucSubsection [id]="'ScoreCategoryTypeId'" [title]="this.title" [panel]="'scoreCategoryType'">
          </lib-ucSubsection>
          <div id="scoreCategoryType">
            <div class="form-group row">
              <label class="col-md-3 adins-required-label" for="RefScoreCategoryTypeCode">Score Category Code</label>
              <div class="col-md-4">
                <input type="text" class="form-control" formControlName="RefScoreCategoryTypeCode" 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefScoreCategoryTypeForm.controls.RefScoreCategoryTypeCode.invalid }"
                  [attr.disabled]="type == 'edit' ? true : null">
                  <lib-uc-show-errors [control]="RefScoreCategoryTypeForm.controls.RefScoreCategoryTypeCode" [submit]="enjiForm.submitted"></lib-uc-show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adins-required-label" for="Descr">Description</label>
              <div class="col-md-4">
                <input type="text" class="form-control" formControlName="Descr" 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefScoreCategoryTypeForm.controls.Descr.invalid }">
                  <lib-uc-show-errors [control]="RefScoreCategoryTypeForm.controls.Descr" [submit]="enjiForm.submitted"></lib-uc-show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3" for="Notes" translate>Notes </label>
              <div class="col-md-4">
                <textarea class="form-control" formControlName="Notes" 
                [ngClass]="{ 'is-invalid': enjiForm.submitted && RefScoreCategoryTypeForm.controls.Notes.invalid }"></textarea>
                <lib-uc-show-errors [control]="RefScoreCategoryTypeForm.controls.Notes" [submit]="enjiForm.submitted"></lib-uc-show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3" for="isActive">Active Status</label>
              <div class="custom-control custom-checkbox m-0">
                <input type="checkbox" value="1" id="isActive" formControlName="IsActive">
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/CommonSetting/ScoreCategory/Paging']"
                translate>
                <i class="ft-x"></i> Cancel
              </button>
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="far fa-check-square"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
