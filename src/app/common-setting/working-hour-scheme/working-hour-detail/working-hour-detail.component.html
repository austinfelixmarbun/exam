<div class="col-md-12">
  <div class="card">
    <div class="card-header">
      <h4 class="card-title" id="horz-layout-colored-controls" translate>Currency</h4>
    </div>
    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" name="WorkingHourReqForm" #WorkingHourReqForm="ngForm"
          (ngSubmit)="WorkingHourReqForm.form.valid && SaveWorkingHourForm(WorkingHourReqForm)">
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Working Hour - {{pageType}}</h4>
            <div class="form-group row">
              <label class="col-md-3 label-control" translate>Scheme Code </label>
              <div class="col-md-9">
                <input type="text" class="form-control" name="workingHourSchmCode" required
                  [(ngModel)]="workingHourSchmCode" #WorkingHourSchmCode="ngModel"
                  [ngClass]="{ 'is-invalid': (WorkingHourReqForm.submitted || WorkingHourSchmCode.touched || WorkingHourSchmCode.dirty) && WorkingHourSchmCode.invalid }">
                <div
                  *ngIf="(WorkingHourReqForm.submitted || WorkingHourSchmCode.touched || WorkingHourSchmCode.dirty) && WorkingHourSchmCode.invalid"
                  class="invalid-feedback">
                  <div *ngIf="WorkingHourSchmCode.errors.required" translate>This field is required</div>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 label-control" translate>Scheme Name </label>
              <div class="col-md-9">
                <input type="text" class="form-control" name="workingHourSchmName" required
                  [(ngModel)]="workingHourSchmName" #WorkingHourSchmName="ngModel"
                  [ngClass]="{ 'is-invalid': (WorkingHourReqForm.submitted || WorkingHourSchmName.touched || WorkingHourSchmName.dirty) && WorkingHourSchmName.invalid }">
                <div
                  *ngIf="(WorkingHourReqForm.submitted || WorkingHourSchmName.touched || WorkingHourSchmName.dirty) && WorkingHourSchmName.invalid"
                  class="invalid-feedback">
                  <div *ngIf="WorkingHourSchmName.errors.required" translate>This field is required</div>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 label-control" translate>Active </label>
              <div class="col-md-9">
                <input class="border-primary" type="checkbox" [ngModel]="isActive" data-md-icheck
                  (change)="toggleActive($event)" name="isActive">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-2 text-center" translate>Day </label>
              <label class="col-md-4 text-center" translate>Work Hour </label>
              <label class="col-md-4 text-center" translate>Work Hour After Break </label>
            </div>
            <div class="form-group row" *ngFor="let item of listOfDay;let i = index;">
              <label class="col-md-2 text-center" translate>{{item.label}} </label>
              <div class="col-md-2" style="border-right: 1px solid grey">
                <input type="time" class="form-control" [(ngModel)]="item.whTime" name="item.day" #item.day="ngModel">
              </div>
              <div class="col-md-2">
                <input type="time" class="form-control" [(ngModel)]="item.whTimeTo" name="item.day" #item.day="ngModel">
              </div>
              <div class="col-md-2" style="border-right: 1px solid grey">
                <input type="time" class="form-control" [(ngModel)]="item.whabTime" name="item.day" #item.day="ngModel">
              </div>
              <div class="col-md-2">
                <input type="time" class="form-control" [(ngModel)]="item.whabTimeTo" name="item.day"
                  #item.day="ngModel">
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/commonSetting/workingHour']"
              translate>
              <i class="ft-x"></i> Cancel
            </button>
            <button type="submit" class="btn btn-raised btn-primary" translate>
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
