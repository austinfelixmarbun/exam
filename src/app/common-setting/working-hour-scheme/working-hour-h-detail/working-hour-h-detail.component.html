<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="card-header header-title">
        <div class="row">
          <div class="col-md-8">
            <h4 class="card-title" id="horz-layout-colored-controls" translate> WORKING HOUR SCHEME {{pageType}} </h4>
          </div>
        </div>
      </div>
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="WorkingHourSchmHForm" (ngSubmit)="WorkingHourSchmHForm.valid && SaveForm()"
        #enjiForm="ngForm">
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Working Hour Scheme - {{pageType}} </h4>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" translate>Working Hour Scheme Code </label>
              <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-25-per" formControlName="WorkingHourSchmCode"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && WorkingHourSchmHForm.controls.WorkingHourSchmCode.invalid }">
                  <show-errors [control]="WorkingHourSchmHForm.controls.WorkingHourSchmCode" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" translate>Working Hour Scheme Name </label>
              <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="WorkingHourSchmName"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && WorkingHourSchmHForm.controls.WorkingHourSchmName.invalid }">
                  <show-errors [control]="WorkingHourSchmHForm.controls.WorkingHourSchmName" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" translate>Active </label>
              <div class="col-md-9">
                <input class="border-primary" type="checkbox" data-md-icheck
                formControlName="IsActive">
              </div>
            </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/commonSetting/workingHour']" translate>
            <i class="ft-x"></i> Cancel
          </button>
            <button type="submit" class="btn btn-raised btn-primary" translate>
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
