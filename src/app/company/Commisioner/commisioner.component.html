<div class="card">
    <div class="card-header">
        <h4 class="card-title" id="horz-layout-colored-controls" translate>Commisioner Information</h4>
    </div>
  </div>
  <div>
    <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' (result)="getResult($event)"></app-search>
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th translate (click)="searchSort($event)" name='name'>Name</th>
                <th translate (click)="searchSort($event)" name='jobTitle'>Job Title</th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td>{{item.name}}</td>
                <td>{{item.jobTitle}}</td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/company/bod/add']" [queryParams]="{coyBodId:item.coyBodId,mode:'edit',refCoyId:item.refCoyId}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.coyCommissionerId)">
                        <i class="ft-x font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <i class="fa fa-plus-circle" [routerLink]="['/company/bod/add']" [queryParams]="{refCoyId:refCoyId}" style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
  </div>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
