                        <div class="form-group row">
                            <label class="col-md-3 label-control">Name : </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" name="name" required [(ngModel)]="name"
                                    #Name="ngModel">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 label-control">Job Title: </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" name="jobTitle" required [(ngModel)]="jobTitle"
                                    #JobTitle="ngModel">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 label-control">NPWP: </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" name="npwp" required [(ngModel)]="npwp"
                                    #Npwp="ngModel">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 label-control">Id Type: </label>
                            <div class="col-md-9">
                                <select class="form-control" name="mrIdType" class="custom-select" style="width: auto" [(ngModel)]="idType">
                                    <option *ngFor="let it of itemIdType" value="{{it.masterCode}}">
                                        {{it.descr}}</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 label-control">Id No: </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" name="idNo" required [(ngModel)]="idNo"
                                    #IdNo="ngModel">
                            </div>
                        </div>
                    </div>
