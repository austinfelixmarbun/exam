<div class="card">
    <div class="card-header">
        <h4 class="card-title" id="horz-layout-colored-controls" translate>Board of Director Information</h4>
    </div>
</div>
<div>
    <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
        [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>
    <div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
        <table class="table table-responsive-md text-center table-hover">
            <thead>
                <tr class="table-header">
                    <th class="text-left pointer"><span translate class="thead-header" (click)="searchSort($event)"
                            name='name'>Name</span> </th>
                    <th class="text-left pointer"><span translate class="thead-header" (click)="searchSort($event)"
                            name='jobTitle'>Job Title</span></th>
                    <th translate>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of resultData?.data">
                    <td class="text-left">{{item.name}}</td>
                    <td class="text-left">{{item.jobTitle}}</td>
                    <td>
                        <a class="success p-0" data-original-title="" title="" [routerLink]="['/company/bod/add']"
                            [queryParams]="{coyBodId:item.coyBodId,mode:'edit',refCoyId:item.refCoyId}">
                            <i class="ft-edit-2 font-medium-3 mr-2"></i>
                        </a>
                        <a class="danger p-0" data-original-title="" title="" (click)="delete(item.coyBodId)">
                            <i class="ft-trash-2 font-medium-3 mr-2"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
    </div>
</div>
<div class="form-actions right">
    <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/company']">
        <i class="ft-x"></i> Back
    </button>
    <i class="fa fa-plus-circle" [routerLink]="['/company/bod/add']" [queryParams]="{refCoyId:refCoyId}"
        style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
</div>
