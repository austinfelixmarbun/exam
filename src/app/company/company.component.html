<div>
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th translate class="text-left pointer">Full Name</th>
        <th translate class="text-left pointer">Address</th>
        <th translate>Phone(Fix Line)</th>
        <th translate>BOD</th>
        <th translate>Commissioner</th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData">
        <td class="text-left">{{item.fullName}}</td>
        <td class="text-left">{{item.address}}</td>
        <td>{{item.phone}}</td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/company/bod']" [queryParams]="{refCoyId:item.refCoyId}" skipLocationChange>
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/company/commissioner']" skipLocationChange
          [queryParams]="{refCoyId:item.refCoyId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/company/edit']" skipLocationChange
            [queryParams]="{refCoyId:item.refCoyId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
