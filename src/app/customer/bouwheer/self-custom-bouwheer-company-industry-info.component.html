<div id="BouwheerIndustryInfo" *ngIf="dicts.formRaw.MrCustTypeCode=='COMPANY'">
<div class="pull-right">
    <button type="button" class="addButton" translate (click)="showModalIndustryInfo(ListBouwheerIndustryInfo.length)"><i class="ft-plus-circle"></i> Add</button>
</div>
  <lib-ucSubsection [id]="'BouwheerCompanyIndustryInfo'" [title]="'Industry List'" [panel]="'BouwheerIndustryInfo'"></lib-ucSubsection>
  <div id="BouwheerIndustryInfo">
      <div id="ListBouwheerIndustryInfo" class="mb-3" style="overflow-x: auto;"> 
        <table class="table table-stripped table-bordered">
          <thead>
            <tr class="table-header">
              <th class="text-center" translate>No</th>
              <th class="text-center" translate>KBLI</th>
              <th class="text-left" translate>Industry Type</th>
              <th class="text-center" translate>Main Industry</th>
              <th class="text-center" translate>Industry Start Date</th>
              <th class="text-center" translate>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of ListBouwheerIndustryInfo; let i = index">
              <td class="text-center">{{i+1}}</td>
              <td class="text-center">{{item.RefIndustryTypeCode}}</td>
              <td class="text-left">{{item.RefIndustryTypeName}}</td>
              <td class="text-center">{{item.IsMain}}</td>
              <td class="text-center">{{item.BusinessStartDate | date: 'dd-MMM-yyyy'}}</td>
              <td class="text-center">
                <a href="javascript:;" (click)="showModalIndustryInfo(i)"><i class="ft-edit-2 font-medium-3 mr-1"></i></a>
                <a href="javascript:;" (click)="deleteModalIndustryInfo(i)" class="danger p-0"><i class="ft-trash-2 font-medium-3 ml-1"></i></a>
              </td>
            </tr>
  
            <tr *ngIf="(ListBouwheerIndustryInfo.length <= 0)">
              <td class="text-center" colspan="6" translate>No Data Available</td>
            </tr>
          </tbody>
        </table>  
      </div>

    <ng-template #ModalIndustryList let-modal>
    <form class="form form-horizontal" [formGroup]="IndustryInfoForm" (ngSubmit)="IndustryInfoForm.valid && SaveIndustryInfo()" #enjiForm="ngForm">
        <div class="modal-header">
            <h4 class="modal-title" id="modal-basic-title">
                Industry Info
            </h4>
            <button type="button" class="close" aria-label="Close" (click)="modal.dismiss()"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
        <div class="form-group row">
          <label class="col-md-3 adins-required-label" translate>Industry Type </label>
          <div class="col-md-6">
            <lib-uclookupgeneric [lookupInput]="lookUpObj" [parentForm]="IndustryInfoForm" [enjiForm]="enjiForm"
              [identifier]="'lookupIndustryType'" (lookup)=getLookUp($event)>
            </lib-uclookupgeneric>
          </div>
        </div>
    
        <div class="form-group row">
          <label class="col-md-3 adins-required-label" translate>Industry Start Date</label>
          <div class="col-md-3">
            <input type="date" max="{{ MaxDate | date:'yyyy-MM-dd' }}" class="form-control adInsInput"
              formControlName="BusinessStartDate"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && IndustryInfoForm.controls.BusinessStartDate.invalid}">
            <lib-uc-show-errors [control]="IndustryInfoForm.controls.BusinessStartDate" [submit]="enjiForm.submitted">
            </lib-uc-show-errors>
          </div>
        </div>
        <div class="form-group row">
          <label class="col-md-3 adInsLabel" for="Notes" translate>Industry Notes</label>
          <div class="col-md-9">
            <textarea class="form-control adInsInput width-75-per" formControlName="Notes"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && IndustryInfoForm.controls.Notes.invalid }"></textarea>
          </div>
        </div>
    
        <div class="form-group row">
          <label class="col-md-3" for="myfile" translate>Industry File Upload</label>
          <div class="col-md-4">
            <input type="file" id="myfile" name="myfile" (change)="onFileChange($event)"><br><br>
          </div>
        </div>
    
        <div class="form-group row">
          <label class="col-md-3 adInsLabel" for="IsMain" translate>Is Main Industry</label>
          <div class="col-md-1">
            <input type="checkbox" class="border-primary" formControlName="IsMain"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && IndustryInfoForm.controls.IsMain.invalid }" />
            <lib-uc-show-errors [control]="IndustryInfoForm.controls.IsMain" [submit]="enjiForm.submitted">
            </lib-uc-show-errors>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-warning btn-raised" (click)="modal.dismiss()"> <i
            class="ft-x"></i>&nbsp;<span translate>Cancel</span></button>
        <button type="submit" class="btn btn-raised btn-primary">
          <i class=" fa fa-arrow-circle-right"></i>&nbsp;<span translate>Save</span>
        </button>
        </div>
    </form>
    </ng-template> 
</div>
</div>
