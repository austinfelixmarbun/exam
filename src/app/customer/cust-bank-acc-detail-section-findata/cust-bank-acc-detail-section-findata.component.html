<form class="form form-horizontal" [formGroup]="CustBankAccForm" #enjiForm="ngForm" novalidate
  (ngSubmit)="enjiForm.form.valid && Save(enjiForm)">
  <div class="modal-header">
    <h4 class="modal-title">{{modalTitle}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('0')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="col-md-12">
      <div class="">
        <div class="">
          <div class="px-3">
            <div class="form-body">
              <div id="CustBankAccSection">
                <div class="form-group row">
                  <label class="col-md-3 adInsLabel adins-required-label" for="BankName" translate>Bank Name</label>
                  <div class="col-md-9" *ngIf="pageType != 'editStmnt'">
                    <lib-uclookupgeneric [lookupInput]="inputLookupBank" [parentForm]='CustBankAccForm' [enjiForm]='enjiForm' [identifier]="'RefBankLookup'"
                      (lookup)="getLookupRefBankResponse($event)"></lib-uclookupgeneric>
                  </div>
                  <div class="col-md-9" *ngIf="pageType == 'editStmnt'">
                    {{bankName}}
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 adInsLabel adins-required-label" for="BankBranch" translate>Bank Branch</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput" formControlName="BankBranch" 
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.controls.BankBranch.invalid }"
                      [attr.disabled]="pageType == 'editStmnt' ? '' : null" />
                    <show-errors [control]="CustBankAccForm.controls.BankBranch" [submit]="enjiForm.submitted"></show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 adInsLabel adins-required-label" for="BankAccName" translate>Account Name</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput" formControlName="BankAccName" 
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.controls.BankAccName.invalid }"
                      [attr.disabled]="pageType == 'editStmnt' ? '' : null" />
                    <show-errors [control]="CustBankAccForm.controls.BankAccName" [submit]="enjiForm.submitted"></show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 adInsLabel adins-required-label" for="BankAccNo" translate>Account No</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput" formControlName="BankAccNo" 
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.controls.BankAccNo.invalid }"
                      [attr.disabled]="pageType == 'editStmnt' ? '' : null" />
                    <show-errors [control]="CustBankAccForm.controls.BankAccNo" [submit]="enjiForm.submitted"></show-errors>
                  </div>
                </div>
                <div class="form-group row" *ngIf="isAddBankStatement"> 
                  <div class="col-md-12" style="text-align: right; margin-top: 10px;">
                    <button type="button" class="btn btn-raised btn-primary" (click)="addRowCustBankStmnt()" [disabled]="rowCustBankStmnt >= '12'">
                      Add New Row
                    </button>
                  </div>
                  <div class="col-md-12">
                    <table class="table table-responsive-md text-center table-hover">
                      <thead>
                        <tr class="table-header">
                          <th style="text-align: left;">
                            <span class="thead-header" name='month' translate>Month</span>
                          </th>
                          <th style="text-align: left;">
                            <span class="thead-header" name='year' translate>Year</span>
                          </th>
                          <th style="text-align: left;">
                            <span class="thead-header" name='debit' translate>Debit (-)</span>
                          </th>
                          <th style="text-align: left;">
                            <span class="thead-header" name='credit' translate>Credit (+)</span>
                          </th>
                          <th style="text-align: left;">
                            <span class="thead-header" name='endingBalance' translate>Ending Balance</span>
                          </th>
                          <th style="text-align: center;">
                            <span class="thead-header" name='action' translate>Delete</span>
                          </th>
                        </tr>
                      </thead>
                      <tbody formArrayName="CustBankStmnts">
                        <tr *ngFor="let stmntControl of CustBankAccForm.get('CustBankStmnts').controls; index as i" [formGroupName]="i">
                          <td style="text-align: left;">
                            <select class="form-control adInsInput" formControlName="Month"
                              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.get('CustBankStmnts').at(i).controls.Month.invalid }">
                              <option *ngFor="let monthItem of monthOfYear; index as j" [value]="j">{{monthItem}}</option>
                            </select>
                            <show-errors [control]="CustBankAccForm.get('CustBankStmnts').at(i).controls.Month" [submit]="enjiForm.submitted"></show-errors>
                          </td>
                          <td style="text-align: left;">
                            <input type="text" class="form-control adInsInput" formControlName="Year" 
                              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.get('CustBankStmnts').at(i).controls.Year.invalid }" />
                            <show-errors [control]="CustBankAccForm.get('CustBankStmnts').at(i).controls.Year" [submit]="enjiForm.submitted"></show-errors>
                          </td>
                          <td style="text-align: left;">
                            <input type="text" class="form-control adInsInput" formControlName="DebitAmt" 
                              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.get('CustBankStmnts').at(i).controls.DebitAmt.invalid }" />
                            <show-errors [control]="CustBankAccForm.get('CustBankStmnts').at(i).controls.DebitAmt" [submit]="enjiForm.submitted"></show-errors>
                          </td>
                          <td style="text-align: left;">
                            <input type="text" class="form-control adInsInput" formControlName="CreditAmt" 
                              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.get('CustBankStmnts').at(i).controls.CreditAmt.invalid }" />
                            <show-errors [control]="CustBankAccForm.get('CustBankStmnts').at(i).controls.CreditAmt" [submit]="enjiForm.submitted"></show-errors>
                          </td>
                          <td style="text-align: left;">
                            <input type="text" class="form-control adInsInput" formControlName="BalanceAmt" 
                              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustBankAccForm.get('CustBankStmnts').at(i).controls.BalanceAmt.invalid }" />
                            <show-errors [control]="CustBankAccForm.get('CustBankStmnts').at(i).controls.BalanceAmt" [submit]="enjiForm.submitted"></show-errors>
                          </td>
                          <td style="text-align: center; vertical-align: middle;">
                            <a (click)="removeCustBankStmnt(i)">
                              <i class="fas fa-trash"></i>
                            </a>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-raised btn-primary">
      <i class="fa fa-check-square-o"></i> Save
    </button>
    <button type="button" class="btn btn-warning btn-raised" (click)="activeModal.dismiss('0')">Cancel</button>
  </div>
</form>
