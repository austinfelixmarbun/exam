<lib-ucSubsection [id]="'CustFinDataId'" [title]="'Financial Data'" [panel]="'CustFinData'"></lib-ucSubsection>

            <lib-ucinputnumber [parentForm]="CustPersonalFinDataForm" [identifier]="'MonthlyIncomeAmt'" [enjiForm]="enjiForm" [isRequired]="false" ucNumber="CustPersonalFinDataForm.controls.MonthlyIncomeAmt.value"></lib-ucinputnumber>

              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustPersonalFinDataForm.controls.MonthlyIncomeAmt.invalid }" />

        </div>

          <label class="col-md-3 adInsLabel" for="OtherIncomeAmt" translate>Other Income</label>

          <label class="col-md-3 adInsLabel" for="MrSourceOfIncomeCode" translate>Source Of Other Income</label>
          <div class="col-md-9">

              [ngClass]="{ 'is-invalid': enjiForm.submitted && CustPersonalFinDataForm.controls.MrSourceOfIncomeCode.invalid }">
              <option *ngFor="let item of sourceOfIncomeList?.ReturnObject" [value]="item.Key">{{item.Value}}</option>
            </select>
            <show-errors [control]="CustPersonalFinDataForm.controls.MrSourceOfIncomeCode" [submit]="enjiForm.submitted"></show-errors>
          </div>
        </div>
        <div class="form-group row" *ngIf="mrMaritalStatCode == 'MAR'">
          <label class="col-md-3 adInsLabel" for="SpouseMonthlyIncomeAmt" translate>Spouse Monthly Income Amount</label>
          <div class="col-md-9">
            <lib-ucinputnumber [parentForm]="CustPersonalFinDataForm" [identifier]="'SpouseMonthlyIncomeAmt'" [enjiForm]="enjiForm" [isRequired]="false" ucNumber="CustPersonalFinDataForm.controls.SpouseMonthlyIncomeAmt.value"></lib-ucinputnumber>

          </div>
        </div>
        <div class="form-group row">

          <div class="col-md-9">

          <div class="col-md-9">
            {{CustPersonalFinDataForm.controls.NettIncomeAmt.value}}

        </div>
        <div class="form-group row">
          <div class="col-md-12" style="text-align: right">
            <button class="btn btn-raised btn-primary" type="button" (click)="calculatePersonalFinData()">
              Calculate
            </button>
          </div>
        </div>
      </div>
