<span class="mr-1 pull-right">
  <button type="button" class="addButton" (click)="openModalAddCustGroup()" translate *ngIf = "CustGrpList.length == 0">
    <i class="ft-plus-circle"></i> Add
  </button>
</span>
<lib-ucSubsection [id]="'CustGrpSectionId'" [title]="'Customer Group'" [panel]="'CustGrpSection'"></lib-ucSubsection>
<div id="CustGrpSection">
  <div class="col-md-12" style="padding: 0; text-align: right;">
    <table class="table table-responsive-md text-center table-hover">
      <thead>
        <tr class="table-header">
          <th style="text-align: left;">
            <span class="thead-header" name='custNo' translate>CUSTOMER NO.</span>
          </th>
          <th style="text-align: left;">
            <span class="thead-header" name='custName' translate>CUSTOMER NAME</span>
          </th>
          <th style="text-align: left;">
            <span class="thead-header" name='relationship' translate>RELATIONSHIP</span>
          </th>
          <th style="text-align: center;">
            <span class="thead-header" name='action' translate>ACTION</span>
          </th>
        </tr>
      </thead>
      <tbody *ngIf="CustGrpList.length == 0">
        <tr>
          <td colspan="100%">No Data Available</td>
        </tr>
      </tbody>
      <tbody>
        <tr *ngFor="let item of CustGrpList; let i = index">
          <td style="color: blue; cursor: pointer; text-align: left;"><a
              (click)="openView(item.CustNo)">{{item.CustNo}}</a></td>
          <td style="text-align: left;">{{item.CustName}}</td>
          <td style="text-align: left;">{{item.Relationship}}</td>
          <td style="text-align: center;">
            <a (click)="deleteCustGrp(item.CustGrpId, i)">
              <i class="fas fa-trash"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<br>
<br>
<br>
<div class="form-actions right" style="text-align: right;">
  <button type="submit" class="btn btn-raised btn-primary" (click)="next()" translate>
    <i class="far fa-check-square"></i> Save and Continue
  </button>
</div>
