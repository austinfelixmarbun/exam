<div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="px-3">
          <div class="customerData">
            <form class="form form-horizontal" [formGroup]="CustDataCompanyForm" (ngSubmit)="CustDataCompanyForm.valid && SaveForm()"
                #enjiForm="ngForm">
              <div class="form-body">
                <lib-ucSubsection [id]="'custAddrId'" [title]="'Customer Address'" [panel]="'customerAddr'">
                </lib-ucSubsection>
                <div id="customerAddr">
                    <div class="form-group row">
                      <label class="col-md-2  adInsLabel adins-required" translate>Address Type Name </label>
                      <div class="col-md-4">
                        <select class="form-control adInsInput" formControlName="MrCustAddrTypeCode">
                          <option *ngFor="let ram of listAddressType" [value]="ram.Key">
                            {{ram.Value}}
                          </option>
                        </select>
                        <show-errors [control]="CustDataCompanyForm.controls.MrCustAddrTypeCode" [submit]="enjiForm.submitted"></show-errors>
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-md-2  adInsLabel" translate>Copy Address From </label>
                      <div class="col-md-3">
                        <select class="form-control adInsInput" formControlName="CopyAddrFrom">
                          <option *ngFor="let ram of listCustAddr" [value]="ram.CustAddrId">
                            {{ram.MrCustAddrTypeCode}}
                          </option>
                        </select>
                      </div>
                      <div class="col-md-2">
                        <button type="button" class="btn btn-raised btn-primary" (click)="copyAddress()">
                          <i class="fa fa-check-square-o"></i> Copy
                        </button>
                      </div>
                    </div>
                    <div id="CustMainDataCompany"> 
                        <lib-ucaddress #UcAddrGrp [showSubsection]="false" [title]="'Customer Address'" [UCAddrForm]="CustDataCompanyForm" [enjiForm]="enjiForm" [identifier]="'custAddress'" [default]="addressObj" [inputField]="inputFieldAddressObj" [showOwnership]="true"></lib-ucaddress>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Notes </label>
                        <div class="col-md-4">
                        <textarea type="text" class="form-control adInsInput" formControlName="Notes"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }"></textarea>
                        <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                </div>
                <lib-ucSubsection [id]="'addrAttrId'" [title]="'Customer Address Attribute'" [panel]="'addrAttribute'">
                </lib-ucSubsection>
                <div id="addrAttribute">
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Luas Bangunan </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="LuasBangunan"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Luas Tanah </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="LuasTanah"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Kapasitas Listrik </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="KapasitasListrik"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Building Location Class </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="LocationClass"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Building Price Estimates </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="PriceEstimates"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 adInsLabel adins-required" translate>Building Stay Length </label>
                        <div class="col-md-4">
                          <input type="text" class="form-control adInsInput" formControlName="StayLength"
                                [ngClass]="{ 'is-invalid': enjiForm.submitted && CustDataCompanyForm.controls.Notes.invalid }">
                          <show-errors [control]="CustDataCompanyForm.controls.Notes" [submit]="enjiForm.submitted"></show-errors>
                        </div>
                    </div>
                </div>
              </div>
              <div class="form-actions right">
                <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Customer/CustomerCompany/Address']"
                [queryParams]="{ IdCust: this.IdCust }" translate>
                  <i class="ft-x"></i> Cancel
                </button>
                <button type="submit" class="btn btn-raised btn-primary" translate>
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
