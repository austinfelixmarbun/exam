
<div class="ucSearch-Button-Right">
  <span class="mr-1">
    <button type="button" class="addButton" (click)="addPersonal()" translate>
      <i class="ft-plus-circle"></i> Add Personal
    </button>
    <button type="button" class="addButton" (click)="addCompany()" translate>
      <i class="ft-plus-circle"></i> Add Company
    </button>
  </span>
</div>
<form class="form form-horizontal">
  <div class="form-body">
    <h4 class="form-section card-title" translate>
      Management / Shareholder Listing
    </h4>
  </div>
</form>
<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th class="text-left"><span class="thead-header" name='Status' translate>Status</span></th>
      <th class="text-left"><span class="thead-header" name='CustNo' translate>Shareholder Name</span></th>
      <th class="text-left"><span class="thead-header" name='Name' translate>Type</span></th>
      <th class="text-left"><span class="thead-header" name='Gender' translate>Customer Model</span></th>
      <th class="text-left"><span class="thead-header" name='CustomerRelationship' translate>NPWP</span></th>
      <th class="text-left"><span class="thead-header" name='IdType' translate>Share(%)</span></th>
      <th class="text-left"><span class="thead-header" name='IdNo' translate>Default Signer</span></th>
      <th translate>Edit</th>
      <th translate>Delete</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of tempListCompanyManagementShareholder">
      <td class="text-left">{{item.MrNegCustTypeCode}}</td>
      <td class="text-left">{{item.MgmntShrholderName}}</td>
      <td class="text-left">{{item.MrCustTypeCode}}</td>
      <td class="text-left">{{item.MrCustModelCode}}</td>
      <td class="text-left">{{item.TaxIdNo}}</td>
      <td class="text-left">{{item.SharePrcnt}}</td>
      <td class="text-left">
        <div *ngIf="item.IsSigner==true"> Yes </div>
        <div *ngIf="item.IsSigner==false"> No</div>
      </td>
      <td>
        <a class="success p-0" data-original-title="" title="" (click)="editItem(item)">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td>
      <td>
        <a class="danger p-0" data-original-title="" title="" (click)="deleteItem(item.CustCompanyMgmntShrholderId)">
          <i class="ft-trash-2 font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
    
  </tbody>
  <div class="form-actions right">
    <button type="submit" class="btn btn-raised btn-primary" (click) = "next()" translate>
      <i class="fa fa-check-square-o"></i> Save & Continue
    </button>
  </div>
</table>
