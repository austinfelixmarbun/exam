<div class="col-md-14">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="ManagementShareholderForm"
            (ngSubmit)="ManagementShareholderForm.valid && SaveValue()" #enjiForm="ngForm">
            <div class="form-body">
              <lib-ucSubsection [id]="'ManagementShareholder'" [title]="'Management / Shareholder Data'"
                [panel]="'ManagementShareholderId'">
              </lib-ucSubsection>
              <div id="ManagementShareholderId">
                <div class="form-group row  ">
                  <label class="col-md-2 adInsLabel" translate>Select Existing Customer Company</label>
                  <div class="col-md-10">
                    <lib-uclookupgeneric [lookupInput]="inputLookupCustCompanyObj"
                      [parentForm]='ManagementShareholderForm' [enjiForm]='enjiForm' [identifier]="'CustCompanyLookup'"
                      (lookup)=" getLookUpCustomer($event)"></lib-uclookupgeneric>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adins-required-label" translate>Industry Type Name </label>
                  <div class="col-md-4">
                    <lib-uclookupgeneric [lookupInput]="lookUpIndustryTypeObj" [parentForm]="ManagementShareholderForm" [enjiForm]="enjiForm"
                      [identifier]="'RefIndustryTypeId'" (lookup)=getLookUpIndustry($event)>
                    </lib-uclookupgeneric>
                  </div>
                </div>
                <div class="form-group row  ">
                  <label class="col-md-2 adins-required-label" translate>Full Name</label>
                  <div class="col-md-10">
                    <input type="text" class="form-control adInsInput" formControlName="MgmntShrholderName"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MgmntShrholderName.invalid}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.MgmntShrholderName"
                      [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins">
                  <label class="col-md-2 adInsLabel" translate>Customer Model</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" style="width: auto"
                      formControlName="MrCustModelCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrCustModelCode.invalid }">
                      <option *ngFor="let it of tempMrCustModelCode " [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adins-required-label" translate>Company Type</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" style="width: auto"
                      formControlName="MrCompanyTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrCompanyTypeCode.invalid }">
                      <option *ngFor="let it of tempMrCompanyTypeCode " [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row  ">
                  <label class="col-md-2 adInsLabel adins-required-label" translate>Tax Id No</label>
                  <div class="col-md-10">
                    <input type="text" class="form-control adInsInput" formControlName="TaxIdNo"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.TaxIdNo.invalid}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.TaxIdNo" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row  ">
                  <label class="col-md-2 adInsLabel" translate>Share (%)</label>
                  <div class="col-md-3">
                    <input type="" currencyMask min="1" max="100" class="form-control"
                      formControlName="SharePrcnt"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.SharePrcnt.invalid}"
                      [options]="{ suffix: '%',thousands: ',', decimal: '.', align: 'right', allowNegative: true, allowZero:true, precision: 6, nullable: false}"> 
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.SharePrcnt"
                      [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>  
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Default Signer</label>
                  <div class="col-md-10">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsSigner" />
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Active Signer</label>
                  <div class="col-md-10">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Is Owner</label>
                  <div class="col-md-10">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsOwner" />
                  </div>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" (click)="back()" translate>
                 <i class="far fa-window-close"></i> Cancel 
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far fa-check-square"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
