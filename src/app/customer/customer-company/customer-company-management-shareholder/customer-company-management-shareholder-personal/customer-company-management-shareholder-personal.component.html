<div class="col-md-14">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="ManagementShareholderForm"
            (ngSubmit)="ManagementShareholderForm.valid && SaveValue()" #enjiForm="ngForm">
            <div class="form-body">
              <lib-ucSubsection [id]="'ManagementShareholder'" [title]="'Management / Shareholder Data'"
                [panel]="'ManagementShareholderId'">
              </lib-ucSubsection>
              <div id="ManagementShareholderId">
                <div class="form-group row  ">
                  <label class="col-md-2 adInsLabel" translate>Select Existing Cust Personal</label>
                  <div class="col-md-10">
                    <lib-uclookupgeneric [lookupInput]="inputLookupCustPersonalObj"
                      [parentForm]='ManagementShareholderForm' [enjiForm]='enjiForm' [identifier]="'CustPersonalLookup'"
                      (lookup)="getLookUpCustomer($event)"></lib-uclookupgeneric>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adins-required-label" translate>Full Name</label>
                  <div class="col-md-10">
                    <input type="text" class="form-control adInsInput" formControlName="MgmntShrholderName"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MgmntShrholderName.invalid}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.MgmntShrholderName"
                      [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins">
                  <label class="col-md-2 adInsLabel adins-required-label" translate>Customer Model</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" (change)="onOptionsSelected($event)" style="width: auto"
                      formControlName="MrCustModelCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrCustModelCode.invalid }">
                      <option *ngFor="let it of tempMrCustModelCode " [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adins-required-label" translate>ID Type</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" (change)="onOptionsSelected($event)" style="width: auto"
                      formControlName="MrIdTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrIdTypeCode.invalid }">
                      <option *ngFor="let it of tempIdType " [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel adins-required-label" translate>ID Number</label>
                  <div class="col-md-10">
                    <input type="text" class="form-control adInsInput" formControlName="IdNo"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.IdNo.invalid}">
                    <lib-uc-show-errors [customPattern]="customPattern" [control]="ManagementShareholderForm.controls.IdNo" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" [ngClass]="{'adins-required-label' : isIdExpiredDtRequired}"
                    translate>ID Expired Date</label>
                  <div class="col-md-10">
                    <input type="date" class="form-control adInsInput" formControlName="IdExpiredDt" min="{{MaxDate | date:'yyyy-MM-dd'}}"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.IdExpiredDt.invalid}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.IdExpiredDt"
                      [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel adins-required-label" translate>Gender</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrGenderCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrGenderCode.invalid }">
                      <option *ngFor="let it of tempMrGenderCode" [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel adins-required-label" translate>Birth Place / Date</label>
                  <div class="col-md-10">
                    <div class="row">
                      <div class="col-md-6" style="border-right: 1px solid grey">
                        <input type="text" class="form-control adInsInput" formControlName="BirthPlace"
                          [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.BirthPlace.invalid}">
                        <lib-uc-show-errors [control]="ManagementShareholderForm.controls.BirthPlace"
                          [submit]="enjiForm.submitted">
                        </lib-uc-show-errors>
                      </div>
                      <div class="col-md-6">
                        <input type="date" class="form-control adInsInput" formControlName="BirthDt"
                          [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.BirthDt.invalid}">
                        <lib-uc-show-errors [control]="ManagementShareholderForm.controls.BirthDt "
                          [submit]="enjiForm.submitted">
                        </lib-uc-show-errors>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Tax Id No</label>
                  <div class="col-md-10">
                    <input type="text" class="form-control adInsInput" formControlName="TaxIdNo"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.TaxIdNo.invalid}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.TaxIdNo" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adins-required-label" translate>Job Position</label>
                  <div class="col-md-10">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrJobPositionCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.MrJobPositionCode.invalid }">
                      <option *ngFor="let it of tempMrJobPositionCode" [value]="it.Key">
                        {{it.Value}}</option>
                    </select>
                  </div>
                </div>

                <div class="form-group row  ">
                  <label class="col-md-2 adInsLabel" translate>Share (%)</label>
                  <div class="col-md-3">
                    <input type="" currencyMask min="1" max="100" class="form-control"
                      formControlName="SharePrcnt"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.SharePrcnt.invalid}"
                      [options]="{  suffix: '%',thousands: ',', decimal: '.', align: 'right', allowNegative: true, allowZero:true, precision: 6, nullable: false}">
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.SharePrcnt"
                      [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <!-- <div class="form-group row">
                  <label class="col-md-4 adInsLabel" translate>Share (%)</label> 
                  <div class="col-md-3">
                    <input type="number" min="1" max="100" step="0.01"  class="form-control adInsInput" formControlName="SharePrcnt"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && ManagementShareholderForm.controls.SharePrcnt.invalid}">
             
                  </div>
                  <div class="col-md-3"><h4 class="d-flex   align-items-center">%</h4>
                    <lib-uc-show-errors [control]="ManagementShareholderForm.controls.SharePrcnt" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors></div>
                </div> -->
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Default Signer</label>
                  <div class="col-md-1">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsSigner" />
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Active Signer</label>
                  <div class="col-md-1">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-2 adInsLabel" translate>Is Owner</label>
                  <div class="col-md-10">
                    <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsOwner" />
                  </div>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" (click)="back()" translate>
                <i class="far fa-window-close"></i> Cancel
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far fa-check-square"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
