<div class="ucSearch-Button-Right">
  <span class="mr-1">
    <button type="button" class="addButton" (click)="keluarinValue()"  translate>
      <i class="ft-plus-circle"></i> Add
    </button>
    
  </span>
</div>
 

<form class="form form-horizontal">
  <div class="form-body">
    <h4 class="form-section card-title" translate>
      Match / Similar Data
    </h4>
  </div>
</form>
<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th class="text-left"><span class="thead-header" name='Status' translate>Status</span></th>
      <th class="text-left"><span class="thead-header" name='CustNo' translate>Customer No</span></th>
      <th class="text-left"><span class="thead-header" name='Name' translate>Name</span></th>
      <th class="text-left"><span class="thead-header" name='Gender' translate>Gender</span></th>
      <th class="text-left"><span class="thead-header" name='CustomerRelationship' translate>Customer Relationship</span></th>
      <th class="text-left"><span class="thead-header" name='IdType' translate>ID Type</span></th>
      <th class="text-left"><span class="thead-header" name='IdNo' translate>ID No</span></th>
      <th class="text-left"><span class="thead-header" name='BirthDate' translate>Birth Date</span></th>
      <th translate>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of tempCustomerPersonalContactPerson">
      <td class="text-left">{{item.MrNegCustTypeCode}}</td>
      <td class="text-left">{{item.ContactPersonCustNo}}</td>
      <td class="text-left">{{item.ContactPersonName}}</td>
      <td class="text-left">{{item.MrGenderCode}}</td>
      <td class="text-left">{{item.MrCustRelationshipCode}}</td>
      <td class="text-left">{{item.MrIdTypeCode}}</td>
      <td class="text-left">{{item.IdNo}}</td>
      <td class="text-left">{{item.BirthDt}}</td>
    
      <a class="success p-0" data-original-title="" title="" (click)="editItem(item.CustPersonalContactPersonId)">
        <i class="ft-edit-2 font-medium-3 mr-2"></i>
      </a>  
        <a class="danger p-0" data-original-title="" title=""(click)="deleteItem(item.CustPersonalContactPersonId)" >
          <i class="ft-trash-2 font-medium-3 mr-2"></i>
        </a>
  

    </tr>
  </tbody>
</table>
