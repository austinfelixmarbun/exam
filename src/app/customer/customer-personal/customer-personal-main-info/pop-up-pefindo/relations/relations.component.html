<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
         
        <div class="px-3" >

        
          <lib-ucSubsection [id]="'RelatedPartiesId'" [title]="'Related Parties'"  [panel]="'RelatedParties'">
          </lib-ucSubsection>
          <div id="RelatedParties">
            <table class="table table-responsive-md text-center table-hover">
              <thead>
                <tr class="table-header">
                  <th>
                    <span class="thead-header" translate>ID</span>
                  </th>
                  <th>
                    <span class="thead-header" translate>FULL NAME</span>
                  </th>
                  <th>
                    <span class="thead-header" translate>RELATION TYPE</span>
                  </th>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let item of ListRelated">
                  <td class="text-left">{{item.Id}}</td>
                  <td class="text-left">{{item.FullName}}</td>
                  <td class="text-left">{{item.RelationType}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        
          <lib-ucSubsection [id]="'InvolvementsId'" [title]="'Involvements'"  [panel]="'Involvements'">
          </lib-ucSubsection>
          <div id="Involvements">
            <div class="form-group row">
              <label class="col-md-3" translate>No data available</label>             
            </div>
          </div>

          <lib-ucSubsection [id]="'ContractRelationsId'" [title]="'Contract Relations'"  [panel]="'ContractRelations'">
          </lib-ucSubsection>
          <div id="ContractRelations">
            <table class="table table-responsive-md text-center table-hover">
              <thead>
                <tr class="table-header">
                  <th>
                    <span class="thead-header" translate>ID</span>
                  </th>
                  <th>
                    <span class="thead-header" translate>FULL NAME</span>
                  </th>
                  <th>
                    <span class="thead-header" translate>RELATION TYPE</span>
                  </th>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let item of ListContract">
                  <td class="text-left">{{item.Id}}</td>
                  <td class="text-left">{{item.FullName}}</td>
                  <td class="text-left">{{item.RelationType}}</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
