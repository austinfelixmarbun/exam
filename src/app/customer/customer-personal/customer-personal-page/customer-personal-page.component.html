<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal">
            <div class="form-body">
              <h4 class="form-section card-title" translate> Customer Personal
              </h4>
            </div>
          </form>
          <lib-ucSubsection [id]="'MainInfo'" [title]="'Main Info'" [panel]="'MainInfoId'">
          </lib-ucSubsection>
          <form class="form form-horizontal" id="MainInfoId">
            <div class="form-body">
              <div class="form-group row "> 
                <label class="col-md-2 adInsLabel" translate>Cust NO</label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.CustNo}}</label>
                </div>
                <label class="col-md-2 adInsLabel" translate>Customer Name </label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.CustName}}</label>
                </div>
              </div>
              <div class="form-group row"> 
                <label class="col-md-2  adInsLabel" translate>Gender </label>
                <div class="col-md-4">
                  <label>{{this.tempMrGenderCode?.Descr}} </label>
                </div>
                <label class="col-md-2 adInsLabel" translate>Customer Model</label>
                <div class="col-md-4">
                  <label>{{this.tempMrCustModelCode?.Descr}} </label>
                </div>
              </div>
              <div class="form-group row ">
                <label class="col-md-2 adInsLabel" translate>Birth Place </label>
                <div class="col-md-4">
                  <label>{{this.tempCustPersonalObj?.BirthPlace}} </label>
                </div>

                <label class="col-md-2 adInsLabel" translate>ID Type </label>
                <div class="col-md-4">
                  <label>{{this.tempMrIdTypeCode?.Descr}} </label>
                </div> 
              </div> 
              <div class="form-group row ">
                <label class="col-md-2 adInsLabel" translate>Birth Date </label>
                <div class="col-md-4">
                  <label>{{this.tempCustPersonalObj?.BirthDt| date: 'dd-MMM-yyyy' }} </label>
                </div>


                <label class="col-md-2 adInsLabel" translate>ID Number </label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.IdNo}}</label>
                </div>
               
              </div>
              <div class="form-group row ">
                <label class="col-md-2 adInsLabel" translate>NPWP</label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.TaxIdNo}}</label>
                </div> 
                <label class="col-md-2 adInsLabel" translate>ID Expired Date</label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.IdExpiredDt  | date: 'dd-MMM-yyyy' }}</label>
                </div> 
              </div>
              <div class="form-group row">
                <label class="col-md-2 adInsLabel" translate>Mother Maiden Name</label>
                <div class="col-md-4">
                  <label>{{this.tempCustPersonalObj?.MotherMaidenName}}</label>
                </div>
                <label class="col-md-2 adInsLabel" translate>Affiliation With Multifinance</label>
                <div class="col-md-4">
                  <label>{{this.StatusAffiliate}}</label>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-2 adInsLabel" translate>VIP</label>
                <div class="col-md-4">
                  <label>{{this.StatusIsVip}}</label>
                </div>
                <label class="col-md-2 adInsLabel" translate>VIP Notes</label>
                <div class="col-md-4">
                  <label>{{this.tempCustObj?.VipNotes}}</label>
                </div>
              </div>

            </div>
          </form>
        </div>
        <aw-wizard #wizard navBarLayout="large-empty-symbols" [disableNavigationBar]=true [awNavigationMode]
          navigateBackward="allow" navigateForward="allow">
          <aw-wizard-step [stepTitle]="'Customer Detail'"
            [navigationSymbol]="{ symbol: '&#xf007;', fontFamily: 'FontAwesome' }" (stepEnter)="EnterTab('Detail')">
            <app-customer-personal-detail *ngIf="isDetail == true" (outputValue)="terimaValue($event)">
            </app-customer-personal-detail>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Address'" [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome' }"
            (stepEnter)="EnterTab('Address')">
            <app-customer-personal-address   *ngIf="isAddress == true">
            </app-customer-personal-address>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Contact Person'"
            [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome' }">
            <app-customer-contact-person   *ngIf="isAddress == true">
            </app-customer-contact-person>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Customer Group'"
            [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome'}" (stepEnter)="EnterTab('Group')">
            <app-cust-group-tab *ngIf="isGroup == true" [MrCustTypeCode]="PERSONAL" [CustId]="this.IdCust">
            </app-cust-group-tab>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Job Data'"
            [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome' }" (stepEnter)="EnterTab('Job')">
            <app-customer-personal-job-data *ngIf="isJob == true"> </app-customer-personal-job-data>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Financial Data'"
            [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome' }" (stepEnter)="EnterTab('Financial')">
            <app-cust-fin-data-tab *ngIf="isFinancial == true"  [CustModeId]="this.CustPersonalId"
              [MrCustTypeCode]="'PERSONAL'"> </app-cust-fin-data-tab>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Other Attribute'"
            [navigationSymbol]="{ symbol: '&#xf0b1;', fontFamily: 'FontAwesome' }" (stepEnter)="EnterTab('Other')">
            other
            <!-- <app-customer-personal-detail *ngIf="isOther == true"> </app-customer-personal-detail> -->
          </aw-wizard-step>
        </aw-wizard>
      </div>
    </div>
  </div>
</div>
