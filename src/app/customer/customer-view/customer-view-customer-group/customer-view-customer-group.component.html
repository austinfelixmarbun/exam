<div class="card">
  <div class="card-body">
    <div class="px-3">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr class="table-header">
            <th class="text-left"><span class="thead-header" name='fullAssetCode' translate>STATUS tessttt</span> </th>
            <th class="text-center"><span class="thead-header" name='fullAssetName' translate>CUSTOMER NO.</span> </th>
            <th class="text-left"><span class="thead-header" name='assetCategoryName' translate>CUSTOMER NAME</span>
            </th>
            <th class="text-left"><span class="thead-header" name='assetCategoryName' translate>CUSTOMER RELATIONSHIP</span>
            </th>
            <th class="text-left"><span class="thead-header" name='assetCategoryName' translate>NOTES</span> </th>
            <th class="text-center"><span class="thead-header" name='assetCategoryName' translate>ACTIVE STATUS</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of responseObj">
            <tr>
              <td class="text-left"></td>
              <td class="text-center"><a href="{{custViewUrl + item.CustId}}" target="_blank">{{item.CustNo}}</a></td>
              <td class="text-left">{{item.CustName}}</td>
              <td class="text-left">{{item.CustRelationship}}</td>
              <td class="text-left">{{item.Notes}}</td>
              <td class="text-center" *ngIf="item.IsActive == true">Yes</td>
              <td class="text-center" *ngIf="item.IsActive == false">No</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
