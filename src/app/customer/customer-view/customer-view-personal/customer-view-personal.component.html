<div class="col-md-12">
    <div class="card">
        <div class="card-body">
            <div class="px-3">
                    <div class="form-body">
                        <h4 class="form-section card-title" translate>Customer Personal
                        </h4>
                        <div>
                            <lib-ucviewgeneric [viewInput]="viewCustMainInfoHeaderObj"></lib-ucviewgeneric>

                            <aw-wizard #wizard navBarLayout="large-empty-symbols" [awNavigationMode]
                                navigateBackward="allow" navigateForward="allow">

                                <aw-wizard-step [stepTitle]="'Main Data'"
                                    [navigationSymbol]="{ symbol: '&#xf007;', fontFamily: 'FontAwesome' }">
                                    <app-customer-view-personal-detail> </app-customer-view-personal-detail>
                                </aw-wizard-step>

                                <aw-wizard-step [stepTitle]="'Address'"
                                    [navigationSymbol]="{ symbol: '&#xf007;', fontFamily: 'FontAwesome' }">
                                    <app-customer-view-personal-address> </app-customer-view-personal-address>
                                </aw-wizard-step>

                            </aw-wizard>


                        </div>
                    </div>
            </div>
        </div>
    </div>
</div>
