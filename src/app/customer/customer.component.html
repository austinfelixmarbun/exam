<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" #formId="ngForm" [formGroup]="CustomerForm"
          (ngSubmit)="CustomerForm.valid && SavePros(CustomerForm)">
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Customer Information </h4>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="CustName">Type </label>
              <div class="col-md-9">
                <div class="custom-control custom-radio display-inline-block">
                  <input type="radio" id="Personal" value="P" checked formControlName="CustType"
                    class="custom-control-input">
                  <label class="custom-control-label" for="Personal">Personal</label>
                </div>
                <div class="custom-control custom-radio display-inline-block">
                  <input type="radio" id="Company" value="C" formControlName="CustType"
                    class="custom-control-input">
                  <label class="custom-control-label" for="Company">Company</label>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="CustName">Zip Code </label>
              <div class="col-md-9">
              </div>
              
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="CustName">Customer Name </label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput" formControlName="CustName" 
                   [ngClass]="{ 'is-invalid': formId.submitted && CustomerForm.controls.CustName.invalid }">
                   <show-errors [control]="CustomerForm.controls.CustName" [submit]="formId.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="Npwp">NPWP </label>
              <div class="col-md-9">
                <input type="text" id="Npwp" class="form-control adInsInput" formControlName="Npwp"
                  [ngClass]="{ 'is-invalid': formId.submitted && CustomerForm.controls.Npwp.invalid }">
                  <show-errors [control]="CustomerForm.controls.Npwp" [submit]="formId.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="KtpNo">KTP No </label>
              <div class="col-md-9">
                <input type="text" id="KtpNo" class="form-control adInsInput" formControlName="IdNo"
                  [ngClass]="{ 'is-invalid': formId.submitted && CustomerForm.controls.IdNo.invalid }">
                  <show-errors [control]="CustomerForm.controls.IdNo" [submit]="formId.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="MrCustRating">Customer Rating </label>
              <div class="col-md-9">
                <select class="form-control adInsInput" formControlName="MrCustRating">
                  <option value="INDETERMINED">Indetermined</option>
                  <option value="GOLD">Gold</option>
                </select>
              </div>
            </div>
            <div class="form-group row" *ngFor="let item of repeaters;let idx = index;trackBy:trackByIndex;">
              <label class="col-md-3  adInsLabel">Input repeater </label>
              <div class="col-md-9">
                <input type="text" class="form-control" formControlName="item_{{idx}}"
                  [ngClass]="formId.submitted && CustomerForm.controls['item_'+idx].invalid ? 'is-invalid' : ''" />
                <show-errors [control]="CustomerForm.controls['item_'+idx]" [submit]="formId.submitted"></show-errors>
              </div>           
            </div>
            <div *ngFor="let item of repeaters">
              <label>{{item}}</label>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-raised btn-warning mr-1" awPreviousStep>
              <i class="fa fa-arrow-circle-left"></i> Back
            </button>
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
