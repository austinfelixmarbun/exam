<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="card-header header-title">
        <div class="row">
          <div class="col-md-8">
            <h4 class="form-section card-title" translate>Customer Company</h4>
          </div>
        </div>
      </div>

      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="CustomerCompanyForm"
          (ngSubmit)="CustomerCompanyForm.valid && SaveValue() " #enjiForm="ngForm" id="MainInfoId">
          <lib-ucSubsection [id]="'MainInfo'" [title]="'Main Info'" [panel]="'MainInfoId'">
          </lib-ucSubsection>
          <div class="form-body" id="MainInfoId">
            <div class="form-group row adins-required">
              <label class="col-md-2  adInsLabel" translate>Customer Name </label>
              <div class="col-md-4">
                <input type="text" class="form-control adInsInput" formControlName="CustName"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && CustomerCompanyForm.controls.CustName.invalid}">
                <lib-uc-show-errors [control]="CustomerCompanyForm.controls.CustName" [submit]="enjiForm.submitted">
                </lib-uc-show-errors>
              </div>
              <label class="col-md-2 adInsLabel" translate>Customer Model </label>
              <div class="col-md-4">
                <select class="form-control adInsInput" style="width: auto" formControlName="CustModel"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && CustomerCompanyForm.controls.CustModel.invalid }">
                  <option *ngFor="let it of tempCustModel" [value]="it.Key">
                    {{it.Value}}</option>
                </select>
                <lib-uc-show-errors [control]="CustomerCompanyForm.controls.CustModel" [submit]="enjiForm.submitted">
                </lib-uc-show-errors>
              </div>
            </div>
            <div class="form-group row ">
              <label class="col-md-2 adins-required-label" translate>Company Type</label>
              <div class="col-md-4">
                <select class="form-control adInsInput" style="width: auto" formControlName="MrCompanyTypeCode"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && CustomerCompanyForm.controls.MrCompanyTypeCode.invalid }">
                  <option *ngFor="let it of tempCompanyTypeCode" [value]="it.Key">
                    {{it.Value}}</option>
                </select>
                <lib-uc-show-errors [control]="CustomerCompanyForm.controls.MrCompanyTypeCode"
                  [submit]="enjiForm.submitted">
                </lib-uc-show-errors>
              </div>
              <label class="col-md-2 adInsLabel" translate>Tax Id No</label>
              <div class="col-md-4">
                <input type="text" class="form-control adInsInput" formControlName="TaxIdNo"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && CustomerCompanyForm.controls.TaxIdNo.invalid}">
                <lib-uc-show-errors [control]="CustomerCompanyForm.controls.TaxIdNo" [submit]="enjiForm.submitted">
                </lib-uc-show-errors>
              </div>
            </div>
            <div class="form-group row ">
              <label class="col-md-2 adInsLabel" translate>Affiliation with Multifinance</label>
              <div class="col-md-4">
                <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsAffiliateWithMf" />
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-2 adInsLabel" translate>VIP</label>
              <div class="col-md-4">
                <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsVip"
                  (click)="checkState()" />
              </div>
              <label class="col-md-2 adInsLabel " [ngClass]="{'adins-required-label' : VipNotesRequired==true}"
                translate>VIP Notes</label>
              <div class="col-md-4">
                <textarea class="form-control adInsInput width-75-per" formControlName="VipNotes"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && CustomerCompanyForm.controls.VipNotes.invalid }"></textarea>

                <lib-uc-show-errors [control]="CustomerCompanyForm.controls.VipNotes" [submit]="enjiForm.submitted">
                </lib-uc-show-errors>
              </div>
            </div>
          </div>
          <lib-ucSubsection [id]="'LegalAddr'" [title]="'Legal Address'" [panel]="'LegalAddrSection'">
          </lib-ucSubsection>
          <div class="form-body" id="LegalAddrSection">
            <lib-ucaddress [addressObj]="inputAddressObj" [UCAddrForm]="CustomerCompanyForm" [enjiForm]="enjiForm" [identifier]="'UcAddress'">
            </lib-ucaddress> 
          </div>

          <div *ngIf="IsCustThirdPartyCheck">
            <lib-ucSubsection [id]="'FraudCheckInfo'" [title]="'Fraud Checking Customer'" [panel]="'dFraudCheckInfo'">
            </lib-ucSubsection>
            <div id="dFraudCheckInfo">
              <div class="row" style="display:flex; align-items: center;">
                <div class="col-3">
                  <label translate>Pefindo</label>
                </div>  
                  <div class="col-9">
                    <label translate>{{this.LastHit.PEFINDO}} /                        
                    </label>                                               
                    <button type="button" (click)="openPopUp(popUpPefindo, 'popUpPefindo')" class="btn btn-raised btn-primary" translate>
                      Hit Pefindo
                    </button>   
                    /
                    <button type="button" (click)="openPopUp(popUpViewPefindo, 'popUpViewPefindo')" class="btn btn-raised btn-primary" translate>View</button> 
                  </div>    
              </div>
              <div class="row" style="display:flex; align-items: center;">
                <div class="col-3">
                  <label  translate>SLIK</label>
                  </div>    
                  <div class="col-9">                        
                  <label translate>{{this.LastHit.SLIK}} / </label>  
                    <button type="button" (click)="openPopUp(popUpSlik, 'popUpSlik')" class="btn btn-raised btn-primary"
                    translate>
                    Hit SLIK
                  </button>                     
                      
                </div>
              </div>
            </div>
          </div>
          <!-- POP UP PEFINDO -->
          <ng-template #popUpPefindo let-c="close" let-d="dismiss">
            <div class="modal-header">
              <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <app-customer-company-data></app-customer-company-data>
          </ng-template>

          <ng-template #popUpViewPefindo let-c="close" let-d="dismiss">
            <div class="modal-header">
              <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <app-customer-company-data></app-customer-company-data>
          </ng-template>

          <!-- POP UP SLIK -->
          <ng-template #popUpSlik let-c="close" let-d="dismiss">
            <div class="modal-header">
              <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <app-pop-up-view-slik></app-pop-up-view-slik>
          </ng-template>
          
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" translate (click)="back()">
              <i class="far fa-window-close"></i> Cancel
            </button>
            <button type="submit" class="btn btn-raised btn-primary" translate>
              <i class="far fa-check-square"></i> Save and Continue
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
