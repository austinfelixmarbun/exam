<div class="form-group row">

  <div class="col-md-6">

    <div class="form-group row" *ngIf="CustType == CustTypePersonal">
      <label class="col-md-4 adInsLabel" translate>Job Position </label>
      <div class="col-md-8" *ngIf="jobPositionLookupObj?.isReady">
        <lib-uclookupgeneric [lookupInput]="jobPositionLookupObj" [parentForm]="parentForm"
          [enjiForm]="enjiForm" [identifier]="'JobPosition'" (lookup)=getLookUpJobPosition($event)>
        </lib-uclookupgeneric>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-md-4 adInsLabel" translate> Position SLIK </label>
      <div class="col-md-8">
        <lib-uclookupgeneric [lookupInput]="positionSlikLookUpObj" [parentForm]="parentForm"
          [enjiForm]="enjiForm" [identifier]="'PositionSlikCode'" (lookup)=getLookUpSlik($event)>
        </lib-uclookupgeneric>
      </div>
    </div>

    <div class="form-group row" *ngIf="CustType == CustTypePersonal">
      <label class="col-md-4 adInsLabel" translate>Establishment Date</label>
      <div class="col-md-8">
        <input type="date" class="form-control adInsInput" formControlName="EstablishmentDt"
          [max]="businessDtMin | date: 'yyyy-MM-dd'"
          [ngClass]="{ 'is-invalid': enjiForm.submitted && parentForm.controls.EstablishmentDt.invalid}">
        <lib-uc-show-errors [control]="parentForm.controls.EstablishmentDt" [submit]="enjiForm.submitted">
        </lib-uc-show-errors>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-md-4 adInsLabel" translate>Is Active</label>
      <div class="col-md-8">
        <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
      </div>
    </div>

    <div class="form-group row" *ngIf="CustType == CustTypePersonal">
      <label class="col-md-4 adInsLabel" translate>Is Signer</label>
      <div class="col-md-8">
        <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsSigner" />
      </div>
    </div>

  </div>

  <div class="col-md-6">

    <div class="form-group row" *ngIf="CustType == CustTypePersonal" [hidden]="parentForm.controls.MrCustModelCode.value == ''">
      <label class="col-md-4 adInsLabel" translate> Profession Name </label>
      <div class="col-md-8">
        <lib-uclookupgeneric [lookupInput]="professionLookUpObj" [parentForm]="parentForm"
          [enjiForm]="enjiForm" [identifier]="'JobProfession'" (lookup)=getLookUpProfession($event) #LookupProfession>
        </lib-uclookupgeneric>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-md-4 adInsLabel" translate> Share(%) </label>
      <div class="col-md-8">
        <input type="" currencyMask min="0" max="100" class="form-control" formControlName="SharePrcnt"
          [ngClass]="{ 'is-invalid': enjiForm.submitted && parentForm.controls.SharePrcnt.invalid}"
          [options]="{  suffix: '%',thousands: ',', decimal: '.', align: 'right', allowNegative: true, allowZero:true, precision: 6, nullable: false}">
        <lib-uc-show-errors [control]="parentForm.controls.SharePrcnt" [submit]="enjiForm.submitted">
        </lib-uc-show-errors>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-md-4 adInsLabel" translate>Is Owner</label>
      <div class="col-md-8">
        <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsOwner" />
      </div>
    </div>

  </div>

</div>
