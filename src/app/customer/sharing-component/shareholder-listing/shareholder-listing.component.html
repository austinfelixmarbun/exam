<div *ngIf="PageType == CustPageTypePaging">
  <form class="form form-horizontal">
    <span class="mr-1 pull-right">
      <button type="button" class="addButton" (click)="addCustShareHolder()" translate>
        <i class="ft-plus-circle"></i> Add
      </button>
    </span>
    <div class="form-body">
      <h4 class="form-section card-title" translate>
        Management / Shareholder Listing
      </h4>
    </div>
  </form>
  <lib-ucgridview [gridInput]="inputGridObj" (callback)="event($event)"></lib-ucgridview>
 
  <div class="form-actions right" style="text-align: right;">
      <button type="submit" class="btn btn-raised btn-primary" (click)="next()" translate>
        <i class="far fa-check-square"></i> Save and Continue
      </button>
    </div>
</div>
<app-new-cust-header *ngIf="PageType == CustPageTypeHeader" [CustId]="selectedCustId" [CustType]="CustType" [ParentCustId]="CustId" [CustCompanyMgmntShrholderId]="selectedCustCompanyMgmntShrholderId" [listCustNoToExclude]="listCustNoToExclude" [CustDataMode]="CustDataModeShareholder" [tempTotalSharePrct]="tempTotalSharePrct" (outputCancel)="ReloadPaging()"></app-new-cust-header>
