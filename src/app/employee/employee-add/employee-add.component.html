<div class="col-md-12">
  <div class="card">
    <div class="card-header header-title">
      <div class="row">
        <div class="col-md-8">
          <h4 class="card-title" id="horz-layout-colored-controls" translate> EMPLOYEE {{pageType}} </h4>
        </div>
        <div class="col-md-4" style="text-align-last: right">
          <button type="button" class="backButton" [routerLink]="['/employee/paging']" translate>
            <i class="ft-arrow-left"></i> Back
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="RefEmpForm" #enjiForm="ngForm"
          (ngSubmit)="enjiForm.form.valid && SaveForm(enjiForm)">
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i>User - {{pageType}}</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="Username">Username</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-25-per" formControlName="Username" required
                  [attr.disabled]="pageType == 'edit' ? true : null" [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Username.invalid }">
                <show-errors [control]="RefEmpForm.controls.Username" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="Password">Password</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-25-per" formControlName="Password" required
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Password.invalid }">
                <show-errors [control]="RefEmpForm.controls.Password" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="ConfirmPassword">Re-enter Password</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-25-per" formControlName="ConfirmPassword" required
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.ConfirmPassword.invalid }">
                <show-errors [control]="RefEmpForm.controls.ConfirmPassword" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="isLock">Locked</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-25-per" formControlName="IsLock" required
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.isLock.invalid }">
                <show-errors [control]="RefEmpForm.controls.isLock" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
          </div>
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Employee - {{pageType}}</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="EmpNo">Employee No </label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-25-per" formControlName="EmpNo" required
                  [attr.disabled]="pageType == 'edit' ? true : null" [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.EmpNo.invalid }">
                <show-errors [control]="RefEmpForm.controls.EmpNo" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="EmpName">Employee Name </label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="EmpName" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.EmpName.invalid }">
                <show-errors [control]="RefEmpForm.controls.EmpName" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="JoinDt">Join Date </label>
              <div class="col-md-9">
                <input type="date" id="joinDt" class="form-control adInsInput width-50-per" formControlName="JoinDt" required
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.JoinDt.invalid }">
                <show-errors [control]="RefEmpForm.controls.JoinDt" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="IdType">ID Type</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="IdType" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.IdType.invalid }">
                <show-errors [control]="RefEmpForm.controls.IdType" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="IdNo">ID No</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="IdNo" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.IdNo.invalid }">
                <show-errors [control]="RefEmpForm.controls.IdNo" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="NpwpNo">NPWP No</label>
              <div class="col-md-9">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="NpwpNo" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.NpwpNo.invalid }">
                <show-errors [control]="RefEmpForm.controls.NpwpNo" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="IsExt">External Employee</label>
              <div class="col-md-9">
                <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsExt">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="IsActive">Active Status</label>
              <div class="col-md-9">
                <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3  adInsLabel" for="IsLeave">Leave Status</label>
              <div class="col-md-9">
                <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsLeave">
              </div>
            </div>
          </div>
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Address</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Address">Address</label>
              <div class="col-md-9">
                <textarea class="form-control adInsInput width-75-per" formControlName="Address" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Address.invalid }"></textarea>
                <show-errors [control]="RefEmpForm.controls.Address" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="RT/RW">RT/RW</label>
              <div class="col-md-2">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="RT" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.RT.invalid }" />
                <show-errors [control]="RefEmpForm.controls.RT" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                /
              </div>
              <div class="col-md-2">
                <input type="text" class="form-control adInsInput width-75-per" formControlName="RW" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.RW.invalid }" />
                <show-errors [control]="RefEmpForm.controls.RW" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <lib-uclookupgeneric [lookupInput]="inputLookupZipCodeObj" [parentForm]='RefEmpForm' [enjiForm]='enjiForm' [identifier]="'ZipCode'"
                  (lookup)="getLookupZipCodeResponse($event)"></lib-uclookupgeneric>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Kelurahan">Kelurahan</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="Kelurahan" required 
                  [attr.disabled]=true [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Kelurahan.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Kelurahan" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Kecamatan">Kecamatan</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="Kecamatan" required 
                  [attr.disabled]=true [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Kecamatan.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Kecamatan" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="City">City</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="City" required 
                  [attr.disabled]=true [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.City.invalid }" />
                <show-errors [control]="RefEmpForm.controls.City" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
          </div>
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Contact Information</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Phone1Area">Phone 1</label>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone1Area" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone1Area.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone1Area" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                -
              </div>
              <div class="col-md-3">
                <input class="form-control adInsInput width-75-per" formControlName="Phone1" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone1.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone1" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                ext.
              </div>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone1Ext" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone1Ext.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone1Ext" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="Phone2">Phone 2</label>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone2Area" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone2Area.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone2Area" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                -
              </div>
              <div class="col-md-3">
                <input class="form-control adInsInput width-75-per" formControlName="Phone2" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone2.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone2" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                ext.
              </div>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone2Ext" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone2Ext.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone2Ext" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Phone3">Phone 3</label>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone3Area" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone3Area.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone3Area" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                -
              </div>
              <div class="col-md-3">
                <input class="form-control adInsInput width-75-per" formControlName="Phone3" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone3.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone3" [submit]="enjiForm.submitted"></show-errors>
              </div>
              <div class="col-md-1">
                ext.
              </div>
              <div class="col-md-2">
                <input class="form-control adInsInput width-75-per" formControlName="Phone3Ext" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Phone3Ext.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Phone3Ext" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="Fax">Fax</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="Fax" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Fax.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Fax" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="MobilePhone1">Mobile Phone 1</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="MobilePhone1" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.MobilePhone1.invalid }" />
                <show-errors [control]="RefEmpForm.controls.MobilePhone1" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="MobilePhone2">Mobile Phone 2</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="MobilePhone2" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.MobilePhone2.invalid }" />
                <show-errors [control]="RefEmpForm.controls.MobilePhone2" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3 adInsLabel" for="Email1">Email 1</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="Email1" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Email1.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Email1" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-3 adInsLabel" for="Email2">Email 2</label>
              <div class="col-md-9">
                <input class="form-control adInsInput width-75-per" formControlName="Email2" required 
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && RefEmpForm.controls.Email2.invalid }" />
                <show-errors [control]="RefEmpForm.controls.Email2" [submit]="enjiForm.submitted"></show-errors>
              </div>
            </div>
          </div>
          <div class="form-body">
            <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Bank Information</h4>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="bankName" translate>Bank Name </label>
              <div class="col-md-9">
                <app-lookupgeneric [lookupInput]="inputLookupObj" [parentForm]='enjiForm' [identifier]="'bank001'"></app-lookupgeneric>
                <!-- <lib-lookuprefbank #uclRefBank [lookupInput]="inputLookupObj" [parentForm]='enjiForm'>
                </lib-lookuprefbank> -->
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="bankBranch">Bank Branch </label>
              <div class="col-md-9">
                <input type="text" id="bankBranch" class="form-control adInsInput width-50-per" name="bankBranch" required
                  [(ngModel)]="bankBranch" #BankBranch="ngModel"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && BankBranch.invalid }">
                <div *ngIf="enjiForm.submitted && BankBranch.invalid" class="invalid-feedback">
                  <div *ngIf="BankBranch.errors.required" class="adInsReqMsg" translate>This field is required</div>
                </div>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="bankBranchRegRptCode">Bank Branch BI Code </label>
              <div class="col-md-9">
                <input type="text" id="bankBranchRegRptCode" class="form-control adInsInput width-25-per" name="bankBranchRegRptCode"
                  [(ngModel)]="bankBranchRegRptCode" #BankBranchRegRptCode="ngModel">
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="bankAccName">Account Name </label>
              <div class="col-md-9">
                <input type="text" id="bankAccName" class="form-control adInsInput width-75-per" name="bankAccName" required
                  [(ngModel)]="bankAccName" #BankAccName="ngModel"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && BankAccName.invalid }">
                <div *ngIf="enjiForm.submitted && BankAccName.invalid" class="invalid-feedback">
                  <div *ngIf="BankAccName.errors.required" class="adInsReqMsg" translate>This field is required</div>
                </div>
              </div>
            </div>
            <div class="form-group row adins-required">
              <label class="col-md-3  adInsLabel" for="bankAccNo">Account No </label>
              <div class="col-md-9">
                <input type="text" id="bankAccNo" class="form-control adInsInput width-50-per" name="bankAccNo" required
                  [(ngModel)]="bankAccNo" #BankAccNo="ngModel"
                  [ngClass]="{ 'is-invalid': enjiForm.submitted && BankAccNo.invalid }">
                <div *ngIf="enjiForm.submitted && BankAccNo.invalid" class="invalid-feedback">
                  <div *ngIf="BankAccNo.errors.required" class="adInsReqMsg" translate>This field is required</div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
