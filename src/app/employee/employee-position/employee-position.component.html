<div class="col-md-12">
  <div class="card">
    <div class="card-header">
      <h4 class="card-title" id="horz-layout-colored-controls">Employee Position</h4>
    </div>
    <div class="card-body">
      <div class="px-3">
        <div class="form-body">
          <div class="form-group row">
            <label class="col-md-3 label-control">Employee No. </label>
            <label class="col-md-3 label-control">{{empNo}} </label>
            <label class="col-md-3 label-control">Employee Name. </label>
            <label class="col-md-3 label-control">{{empName}} </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
</div>
<div class="col-md-12">
  <form>
    <div class="form-actions right">
      <button type="button" (click)="reset()" class="btn btn-raised btn-warning mr-1">
        <i class="ft-x"></i> Cancel
      </button>
      <button type="button" (click)="search()" class="btn btn-raised btn-primary">
        <i class="fa fa-search"></i> Search
      </button>
    </div>
  </form>
</div>

<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='officeName'>Office
          Name</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='jobTitleName'>Job Title
          Name</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='bizUnitName'>Business Unit
          Name</span></th>
      <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active Status</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='roleName'>Roles</span></th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.data">
      <td class="text-left">{{item.officeName}}</td>
      <td class="text-left">{{item.jobTitleName}}</td>
      <td class="text-left">{{item.bizUnitName}}</td>
      <td *ngIf="item.isActive === '1'">Yes</td>
      <td *ngIf="item.isActive === '0'">No</td>
      <td class="text-left">{{item.roleName}}</td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/employeePositionAddEdit']"
          [queryParams]="{param:'edit',refEmpId:refEmpId,empPositionId:item.empPositionId,refBizUnitId:item.refBizUnitId,empNo:empNo,empName:empName}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
        <a class="danger p-0" data-original-title="" title="" (click)="delete(item.empPositionId)">
          <i class="ft-x font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>

<div class="gridFooter row col-md-12">
  <div class="col-md-5 col-xs-12" style="float:left;font-weight: bold;">Total Data : {{totalData}}</div>
  <div class="d-flex justify-content-center col-md-3 col-xs-12">
    <ngb-pagination (pageChange)="searchPagination($event)" [pageSize]="pageSize" [collectionSize]="totalData"
      [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
  </div>
  <div class="col-md-4 col-xs-12" style="float:right;">
    <select class="custom-select" style="width: auto; float:right;" name="pageSize" [(ngModel)]="pageSize"
      (change)="onChange()">
      <option [ngValue]="10">10</option>
      <option [ngValue]="20">20</option>
      <option [ngValue]="50">50</option>
    </select>
  </div>
</div>
<i class="fa fa-plus-circle" [routerLink]="['/employee/employeePositionAddEdit']"
  [queryParams]="{refEmpId:refEmpId,empNo:empNo,empName:empName}"
  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
