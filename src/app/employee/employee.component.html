<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
    <form>
        <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1">
                <i class="ft-x"></i> Cancel
            </button>
            <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                <i class="fa fa-search"></i> Search
            </button>
        </div>
    </form>
</div>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th>Employee No</th>
            <th class="text-left">Employee Name</th>
            <th>External Employee</th>
            <th>Active Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td>{{item.empNo}}</td>
            <td class="text-left">{{item.empName}}</td>
            <td>{{item.refEmpId}}</td>
            <td>{{item.isActive}}</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/add']">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
Current Page : {{pageNow}} <br>
Total Data : {{totalData}}
<div *ngIf="exportData">
    <button type="button" (click)="exportAsXLSX()" class="btn btn-raised btn-success" style="position: absolute; right: 30px; bottom: 0; cursor: pointer;">
        <i class="fa fa-plus-circle"></i> Export Excel
    </button>
</div>
<div class="d-flex justify-content-center">
    <ngb-pagination (pageChange)="pageChange($event)" [pageSize]="pageSize" [collectionSize]="totalData" [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true"
        [boundaryLinks]="true"></ngb-pagination>
</div>
