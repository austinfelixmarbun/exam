<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
    [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th><span translate class="thead-header" (click)="searchSort($event)" name='empNo'>Employee No</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='empName'>Employee
                        Name</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isExt'>External Employee</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active Status</span></th>
                <th translate>Employee Position</th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td>{{item.empNo}}</td>
                <td class="text-left">{{item.empName}}</td>
                <td *ngIf="item.isExt === '1'">Yes</td>
                <td *ngIf="item.isExt === '0'">No</td>
                <td *ngIf="item.isActive === '1'">Yes</td>
                <td *ngIf="item.isActive === '0'">No</td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/employeePosition']"
                        [queryParams]="{refEmpId:item.refEmpId,empNo:item.empNo,empName:item.empName}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/add']"
                        [queryParams]="{refEmpId:item.refEmpId,param:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refEmpId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
