<div class="ucSearch-Button-Right">
        <span class="mr-1">
            <button type="button" class="addButton" [routerLink]="['/employee/add']" translate>
                <i class="ft-plus-circle"></i> Add
            </button>
        </span>
      </div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='empNo'>Employee No</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='empName'>Employee Name</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isExt'>External Employee</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active Status</span></th>
                <th translate>Employee Position</th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td class="text-left">{{item.empNo}}</td>
                <td class="text-left">{{item.empName}}</td>
                <td>
                  <span *ngIf="item.isExt == '1'">Yes</span>
                  <span *ngIf="item.isExt == '0'">No</span>
                </td>
                <td>
                  <span *ngIf="item.isActive == '1'">Yes</span>
                  <span *ngIf="item.isActive == '0'">No</span>
                </td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/employeePosition']"
                        [queryParams]="{refEmpId:item.refEmpId,empNo:item.empNo,empName:item.empName}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/edit']"
                        [queryParams]="{refEmpId:item.refEmpId,param:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refEmpId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
