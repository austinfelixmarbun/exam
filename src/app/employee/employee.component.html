<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
    <form>
        <div class="form-actions right">
            <button *ngIf="exportData" type="button" (click)="exportAsXLSX()" class="btn btn-raised btn-success mr-1">
                <i class="fa fa-plus-circle"></i> Export Excel
            </button>
            <button type="button" (click)="reset()" class="btn btn-raised btn-warning mr-1">
                <i class="ft-x"></i> Cancel
            </button>
            <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                <i class="fa fa-search"></i> Search
            </button>
        </div>
    </form>
</div>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th><span class="thead-header" (click)="searchSort($event)" name='empNo'>Employee No</span></th>
            <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='empName'>Employee
                    Name</span></th>
            <th><span class="thead-header" (click)="searchSort($event)" name='isExt'>External Employee</span></th>
            <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active Status</span></th>
            <th>Employee Position</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td>{{item.empNo}}</td>
            <td class="text-left">{{item.empName}}</td>
            <td>{{item.isExt}}</td>
            <td *ngIf="item.isActive === '1'">Yes</td>
            <td *ngIf="item.isActive === '0'">No</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/employeePosition']"
                    [queryParams]="{refEmpId:item.refEmpId,empNo:item.empNo,empName:item.empName}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
            </td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/employee/add']"
                    [queryParams]="{refEmpId:item.refEmpId,param:'edit'}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refEmpId)">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
<i class="fa fa-plus-circle" [routerLink]="['/employee/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
