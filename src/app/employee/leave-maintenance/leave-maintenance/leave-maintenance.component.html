<div class="ucSearch-Button-Right">
    <span class="mr-1">
        <button type="button" class="addButton" [routerLink]="['/employee/leaveMaintenanceAdd']" translate>
            <i class="ft-plus-circle"></i> Add
        </button>
    </span>
</div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='empNo'>Employee No</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='empName'>Employee Name</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='startDt'>Start Date</span>
                </th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='endDt'>End Date</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)" name='isPassed'>Is Passed</span>
                </th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td class="text-left">{{item.empNo}}</td>
                <td class="text-left">{{item.empName}}</td>
                <td>{{item.startDt | date : "dd MMM yyyy" }}</td>
                <td>{{item.endDt | date : "dd MMM yyyy"}}</td>
                <td>
                    <span *ngIf="item.isPassed == '1'">Yes</span>
                    <span *ngIf="item.isPassed == '0'">No</span>
                </td>
                <td>
                    <a *ngIf="item.isPassed == '0'" class="success p-0" data-original-title="" title=""
                        [routerLink]="['/employee/leaveMaintenanceEdit']"
                        [queryParams]="{refEmpLeaveMngmntId:item.refEmpLeaveMngmntId,param:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refEmpLeaveMngmntId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
