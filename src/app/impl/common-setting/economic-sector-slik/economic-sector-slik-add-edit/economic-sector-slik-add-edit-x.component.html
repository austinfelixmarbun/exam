<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="card-header header-title">
        <div class="row">
          <div class="col-md-8">
            <h4 class="form-section card-title" translate>Economic Sector SLIK Registration</h4>
          </div>
        </div>
      </div>
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="RefSectorEconomySlikForm"
          (ngSubmit)="RefSectorEconomySlikForm.valid && SaveForm()" #enjiForm="ngForm">
          <div class="form-body">
            <lib-ucSubsection [id]="'EconomicSectorId'" [title]="title" [panel]="'EconomicSector'">
            </lib-ucSubsection>
            <div id="EconomicSector">
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Sector Economy SLIK Code</label>
                <div class="col-md-4">
                  <input type="text" class="form-control" formControlName="SectorEconomySlikCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefSectorEconomySlikForm.controls.SectorEconomySlikCode.invalid }">
                  <lib-uc-show-errors [control]="RefSectorEconomySlikForm.controls.SectorEconomySlikCode"
                    [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Sector Economy SLIK Name</label>
                <div class="col-md-4">
                  <input type="text" class="form-control" formControlName="SectorEconomySlikName"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && RefSectorEconomySlikForm.controls.SectorEconomySlikName.invalid }">
                  <lib-uc-show-errors [control]="RefSectorEconomySlikForm.controls.SectorEconomySlikName"
                    [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adins-required-label" translate>Industry Type Name </label>
                <div class="col-md-4">
                  <lib-uclookupgeneric [lookupInput]="lookUpObj" [parentForm]="RefSectorEconomySlikForm" [enjiForm]="enjiForm" 
                    [identifier]="'RefIndustryTypeId'" (lookup)=getLookUp($event)>
                  </lib-uclookupgeneric>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" translate>Active Status</label>
                <div class="col-md-9">
                  <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
                </div>
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1"
              [routerLink]="[CancelLink]" skipLocationChange translate> 
              <i class="far fa-window-close"></i> Cancel
            </button>
            <button type="submit" class="btn btn-raised btn-primary" translate>
              <i class="far fa-check-square"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
