<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="ReqLeaveForm" #ReqLeaveForm="ngForm"
              (ngSubmit)="Save(ReqLeaveForm)" >
              <div class="form-body">
                <h4 class="form-section">Leave Management Request</h4>
                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel" for="empName">Employee Name</label>
                  <div class="col-md-9">
                    <input type="text" id="empName" class="form-control" required name="empName" [(ngModel)]="empName"
                    #required="ngModel" required >
                    <small class="form-text text-muted danger" *ngIf="required.errors?.required">*</small>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel" for="jobPosition">Job Position</label>
                  <div class="col-md-9">
                   <select id="jobPosition" name="jobPosition" class="form-control"  required [(ngModel)]="jobPosition">
                      <option id="1" value="">Select One</option>
                      <option id="2" value="Area Manager">Area Manager</option>
                      <option id="3" value="Branch Manager">Branch Manager</option>
                      <option id="4" value="Staff">Staff</option>
                  </select>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel" for="startDt">Start Date</label>
                  <div class="col-md-9">
                    <input type="date" id="startDt" class="form-control adInsInput" name="startDt"  #required [(ngModel)]="startDt">
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel" for="endDt">Finish Date</label>
                  <div class="col-md-9">
                  <input type="date" id="endDt" class="form-control adInsInput" name="endDt"  #required [(ngModel)]="endDt">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control adInsLabel" for="reason">Reason</label>
                <div class="col-md-9">
                    <textarea id="reason" rows="5" class="form-control adInsInput" name="reason" [(ngModel)]="reason" ></textarea>
                  </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="fa fa-check-square-o"></i> Save
            </button>
          </div>

          </form>
        </div>
      </div>
    </div>
  </div>
  </div>
