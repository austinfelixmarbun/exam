<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="LeaveVerifForm" #LeaveVerifForm="ngForm"
              (ngSubmit)="Save(LeaveVerifForm)">
              <div class="form-body">
                <h4 class="form-section"><i class="ft-user"></i>Request Info</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Employee Name</label>
                  <div class="col-md-9">
                    <label>{{leaveManagementObj.EmpName}}</label></div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Job Position</label>
                  <div class="col-md-9">
                    <label>{{leaveManagementObj.JobPosition}}</label></div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Start Date</label>
                  <div class="col-md-9">
                    <label>{{leaveManagementObj.StartDt}}</label>
                  </div>
                </div>


                <div class="form-group row">
                  <label class="col-md-3 label-control">End Date</label>
                  <div class="col-md-9">
                    <label>{{leaveManagementObj.EndDt}}</label></div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Reason</label>
                  <div class="col-md-9">
                    <label>{{leaveManagementObj.Reason}}</label>
                  </div>
                </div>

                <h4 class="form-section"><i class="ft-file-text"></i>Verification Action</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control" for="VerifBy">Verify By</label>
                  <div class="col-md-9">
                    <input type="text" id="VerifBy" class="form-control" name="VerifBy" [(ngModel)]="VerifBy"
                      #required="ngModel" required>
                    <small class="form-text text-muted danger" *ngIf="required.errors?.required">*</small>
                  </div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control" for="Status">Verification</label>
                  <div class="col-md-9">
                    <select id="Status" name="Status" class="form-control" required [(ngModel)]="Status">
                      <option id="1" value="">Select One</option>
                      <option id="2" value="EXE">Approve</option>
                      <option id="3" value="RJC">Reject</option>
                    </select>
                  </div>
                </div>

              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="ft-x"></i> Cancel
                </button>
                <button type="submit" class="btn btn-raised btn-primary">
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
