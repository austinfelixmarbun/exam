<h4 class="form-section">Leave Management Verification</h4>
<br/>
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
  <form>

    <div class="form-actions right">
      <button type="button" class="btn btn-raised btn-warning mr-1">
        <i class="ft-x"></i> Cancel
      </button>
      <button type="button" (click)="search()" class="btn btn-raised btn-primary">
        <i class="fa fa-search"></i> Search
      </button>
    </div>
  </form>
</div>

<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th>Transaction No</th>
      <th class="text-left">Employee Name</th>
      <th class="text-left">Job Position</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th class="text-left">Reason</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.data">
      <td>{{item.transactionNo}}</td>
      <td class="text-left">{{item.empName}}</td>
      <td class="text-left">{{item.jobPosition}}</td>
      <td>{{item.startDt}}</td>
      <td>{{item.endDt}}</td>
      <td class="text-left">{{item.reason}}</td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['detail']"  [queryParams]="{leaveMngmtId:item.leaveMngmtId, taskId:item.wfTaskListId}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>
Current Page : {{pageNow}}
<div class="d-flex justify-content-center">
  <ngb-pagination (pageChange)="pageChange($event)" [pageSize]="pageSize" [collectionSize]="totalData"
    [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
</div>
