<div class="ucSearch-Button-Right">
    <span class="mr-1">
        <button type="button" class="addButton" [routerLink]="['/menuSetting/add']" translate>
            <i class="ft-plus-circle"></i> Add
        </button>
    </span>
  </div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>
<div [hidden]="resultData?.data == null">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='title'>Title</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='formCode'>Form Code</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='path'>Path</span></th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td class="text-left">{{item.title}}</td>
                <td class="text-left">{{item.formCode}}</td>
                <td class="text-left">{{item.path}}</td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/menuSetting/add']"
                        [queryParams]="{refFormId:item.refFormId,mode:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refFormId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
