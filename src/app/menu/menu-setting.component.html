<div class="card">
    <div class="card-header">
        <h4 class="card-title" id="horz-layout-colored-controls" translate>Menu Management</h4>
    </div>
  </div>
  <div>
    <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' (result)="getResult($event)"></app-search>
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th translate (click)="searchSort($event)" name='title'>Title</th>
                <th translate (click)="searchSort($event)" name='formCode'>Form Code</th>
                <th translate (click)="searchSort($event)" name='path'>Path</th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td>{{item.title}}</td>
                <td>{{item.formCode}}</td>
                <td>{{item.path}}</td>
                <td>
                        <a class="success p-0" data-original-title="" title="" [routerLink]="['/menuSetting/add']" [queryParams]="{refFormId:item.refFormId,mode:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refFormId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
  </div>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
