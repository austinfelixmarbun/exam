<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="card-header header-title">
        <div class="row">
          <div class="col-md-8">
            <h4 class="form-section card-title" translate>Notification Source {{pageType}}</h4>
          </div>
        </div>
      </div>
      <div class="px-3">
        <form class="form form-horizontal" [formGroup]="NotifSourceForm" (ngSubmit)="NotifSourceForm.valid && SaveForm()"
          #enjiForm="ngForm">
          <div class="form-body">
            <lib-ucSubsection [id]="'NotifSource'" [title]="'Notification Source '+ pageType" [panel]="'NotifSourceId'">
            </lib-ucSubsection>
            <div id="NotifSourceId">
              <div  class="form-group row adins-required">
                <label class="col-md-4 adInsLabel" translate>Notification Source Code </label>
                <div class="col-md-7">
                  <input type="text" class="form-control adInsInput" formControlName="NotificationSourceCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && NotifSourceForm.controls.NotificationSourceCode.invalid }">
                  <lib-uc-show-errors [control]="NotifSourceForm.controls.NotificationSourceCode" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-4  adInsLabel" translate>Notification Source Description </label>
                <div class="col-md-7">
                  <input type="text" class="form-control adInsInput" formControlName="NotificationSourceDescr"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && NotifSourceForm.controls.NotificationSourceDescr.invalid }">
                  <lib-uc-show-errors [control]="NotifSourceForm.controls.NotificationSourceDescr" [submit]="enjiForm.submitted">
                  </lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row ">
                <label class="col-md-4  adInsLabel" translate>Active Status</label>
                <div class="col-md-7">
                  <input class="border-primary" type="checkbox" data-md-icheck formControlName="IsActive" />
                </div>
              </div>
            </div>
          </div>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="[CancelLink]">
              <i class="far fa-window-close"></i>&nbsp;<span translate>Cancel</span>
            </button>
            <button type="submit" class="btn btn-raised btn-primary">
              <i class="far fa-check-square"></i>&nbsp;<span translate>Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
