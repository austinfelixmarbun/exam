<div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="card-header header-title">
            <div class="row">
              <div class="col-md-8">
                <h4 class="card-title" id="horz-layout-colored-controls" translate> NOTIF_TEMPLATE_FORM</h4>
                <br>
              </div>
            </div>
          </div>
          <div class="px-3">
            <form class="form form-horizontal" [formGroup]="NotifTemplateForm" #enjiForm="ngForm"
              (ngSubmit)="NotifTemplateForm.valid && SaveForm()">
              <lib-ucSubsection [id]="'NotifTemplateIdId'" [title]="title" [panel]="'NotifTemplate'"></lib-ucSubsection>
              <div class="form-body" id="NotifTemplate">
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>NOTIF_TEMPLATE_CODE</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per"
                      formControlName="NotificationTemplateCode" [readonly]="NotificationTemplateId != 0">
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.NotificationTemplateCode" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>NOTIF_TEMPLATE_DESCR</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per"
                      formControlName="NotificationTemplateDescr">
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.NotificationTemplateDescr" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>NOTIF_LVL</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrNotificationLevelCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && NotifTemplateForm.controls.MrNotificationLevelCode.invalid }">
                      <option value="">Select One</option>
                      <option *ngFor="let it of DictListRefMaster[MrNotificationLevelCode]" value="{{it.Key}}">
                        {{it.Value}}</option>
                    </select>
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.MrNotificationLevelCode" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>NOTIF_SOURCE</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrNotificationSourceCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && NotifTemplateForm.controls.MrNotificationSourceCode.invalid }">
                      <option value="">Select One</option>
                      <option *ngFor="let it of DictListRefMaster[MrNotificationSourceCode]" value="{{it.Key}}">
                        {{it.Value}}</option>
                    </select>
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.MrNotificationSourceCode" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>NOTIF_TYPE</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrNotificationTypeCode" (change)="ChangeNotifType()"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && NotifTemplateForm.controls.MrNotificationTypeCode.invalid }">
                      <option value="">Select One</option>
                      <option *ngFor="let it of DictListRefMaster[MrNotificationTypeCode]" value="{{it.Key}}">
                        {{it.Value}}</option>
                    </select>
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.MrNotificationTypeCode" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>START_DT</label>
                  <div class="col-md-9">
                    <input type="datetime-local" class="form-control adInsInput width-50-per"
                      formControlName="StartDt" [min]="DateNow | date: 'yyyy-MM-ddTHH:mm'">
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.StartDt" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 adInsLabel" translate>END_DT</label>
                  <div class="col-md-9">
                    <input type="datetime-local" class="form-control adInsInput width-50-per"
                      formControlName="EndDt" [min]="GetStartDt | date: 'yyyy-MM-ddTHH:mm'">
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.EndDt" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row" *ngIf="!isHideSubject" [ngClass]="{ 'adins-required': subjectIsRequired }">
                  <label class="col-md-3 adInsLabel" translate>{{NotifTemplateForm.get("MrNotificationTypeCode").value == notifTypePushNotif ? "TITLE" : "SUBJECT"}}</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per"
                      formControlName="Subject" [required]="subjectIsRequired">
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.Subject" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel" translate>BODY</label>
                  <div class="col-md-9">
                    <div class="input-group">
                      <textarea *ngIf="!subjectIsRequired" class="form-control adInsInput width-50-per" formControlName="Body" cols="50" rows="5" (change)="InputParamValue()"></textarea>
                      
                      <div id="full-wrapper" *ngIf="subjectIsRequired">
                        <div id="full-container">
                          <quill-editor [modules]="QuilConfig" formControlName="Body" (onContentChanged)="InputParamValue()"></quill-editor>
                        </div>
                      </div>
                      <button class="input-group-append btn btn-raised btn-primary" style="height: fit-content;" type="button" (click)="AddParameter()">
                        <i class="ft-plus-circle"></i>&nbsp;<span translate>Add Parameter</span>
                      </button>
                    </div>
                    <lib-uc-show-errors [control]="NotifTemplateForm.controls.Body" [submit]="enjiForm.submitted">
                    </lib-uc-show-errors>
                    <!-- <button type="button" (click)="ClearParameter()">Clear Parameter</button> -->
                  </div>
                </div>
              </div>
              <app-body-message-tosend [parentForm]="NotifTemplateForm" [enjiForm]="enjiForm" [NotifType]="NotifTemplateForm.get('MrNotificationTypeCode').value" [IdentifierBodyMessageParam]="IdentifierBodyMessageParam" #TempMessage></app-body-message-tosend>
              <div class="form-actions right">
                <button type="button" class="btn btn-raised btn-warning mr-1" (click)="CancelButton()">
                  <i class="far fa-window-close"></i>&nbsp;<span translate>Cancel</span>
                </button>
                <!-- <button type="button" class="btn btn-raised btn-warning mr-1" (click)="getFormValidationErrors()">
                  <i class="far fa-window-close"></i>&nbsp;<span translate>Test</span>
                </button> -->
                <button type="submit" class="btn btn-raised btn-primary">
                  <i class="far fa-check-square"></i>&nbsp;<span translate>Save</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
