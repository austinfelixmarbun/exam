<lib-ucSubsection [id]="'NotifBroadcastEmailId'" [title]="title" [panel]="'NotifBroadcastEmail'"></lib-ucSubsection>
<div class="form-body" id="NotifBroadcastEmail">

  <div class="form-group row adins-required">
    <label class="col-md-3 adInsLabel" translate>SEND_TO</label>
    <div class="col-md-9">
      <input type="text" [IsUpperCase]="false" class="form-control adInsInput width-50-per" formControlName="SendTo">
      <lib-uc-show-errors [control]="parentForm.controls.SendTo" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
  <div class="form-group row">
    <label class="col-md-3 adInsLabel" translate>CC</label>
    <div class="col-md-9">
      <input type="text" [IsUpperCase]="false" class="form-control adInsInput width-50-per" formControlName="CcEmail">
      <lib-uc-show-errors [control]="parentForm.controls.CcEmail" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
  <div class="form-group row">
    <label class="col-md-3 adInsLabel" translate>BCC</label>
    <div class="col-md-9">
      <input type="text" [IsUpperCase]="false" class="form-control adInsInput width-50-per" formControlName="BccEmail">
      <lib-uc-show-errors [control]="parentForm.controls.BccEmail" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
  <div class="form-group row adins-required">
    <label class="col-md-3 adInsLabel" translate>BODY</label>
    <div class="col-md-9">
      <quill-editor formControlName="Body" [readOnly]="IsUsedTemplate"></quill-editor>
      <lib-uc-show-errors [control]="parentForm.controls.Body" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
</div>
