<lib-ucSubsection [id]="'NotifBroadcastNotifId'" [title]="title" [panel]="'NotifBroadcastNotif'"></lib-ucSubsection>
<div class="form-body" id="NotifBroadcastNotif">
  <div class="form-group row">
    <label class="col-md-3 adInsLabel" translate>SEND_TO</label>
    <div class="col-md-9">
      <lib-uclookupgeneric [lookupInput]="SendtoLookupObj" [parentForm]="parentForm" [enjiForm]="enjiForm"
        [identifier]="IdentifierLookupSendTo" (lookup)="getLookUp($event)">
      </lib-uclookupgeneric>
    </div>
  </div>
  <div class="form-group row">
    <label class="col-md-3 adInsLabel" translate>SUBJECT</label>
    <div class="col-md-9">
      <input type="text" class="form-control adInsInput width-50-per"
        formControlName="Subject" [readonly]="IsUsedTemplate">
      <lib-uc-show-errors [control]="parentForm.controls.Subject" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
  <div class="form-group row adins-required">
    <label class="col-md-3 adInsLabel" translate>BODY</label>
    <div class="col-md-9">
      <textarea class="form-control adInsInput width-50-per" [readonly]="IsUsedTemplate" formControlName="Body" cols="50" rows="5"></textarea>
      <lib-uc-show-errors [control]="parentForm.controls.Body" [submit]="enjiForm.submitted">
      </lib-uc-show-errors>
    </div>
  </div>
</div>
