<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title" id="horz-layout-colored-controls">Office Add</h4>
      </div>
      <div class="card-body">
        <div class="px-3">
          <form class="form form-horizontal">
            <app-lookup></app-lookup>
            <div class="form-body">
              <h4 class="form-section"><i class="ft-file-text"></i> Add/ Edit</h4>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">Office Code: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="officeCode">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">Office Name: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="officeName">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">Contact Person Name: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="personName">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">Address: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="addr">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">City: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="city">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput5">Model Name: </label>
                <div class="col-md-9">
                  <input type="text" id="projectinput5" class="form-control" name="modelName">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput6">Active Status: </label>
                <div class="col-md-9">
                  <select id="projectinput6" name="actStat" class="form-control">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 label-control" for="projectinput6">Virtual Office: </label>
                <div class="col-md-9">
                  <select id="projectinput6" name="virtualOffice" class="form-control">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/office']">
                <i class="ft-x"></i> Cancel
              </button>
              <button type="button" class="btn btn-raised btn-primary">
                <i class="fa fa-check-square-o"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
