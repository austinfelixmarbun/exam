<h4 class="form-section">Office Area Maintenance</h4>
<br />
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span class="thead-header" (click)="searchSort($event)" name='areaCode'>Area Code</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='areaName'>Area Name</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.areaCode}}</td>
        <td class="text-left">{{item.areaName}}</td>
        <td>
          <div *ngIf="item.isActive === '1'">Yes</div>
          <div *ngIf="item.isActive === '0'">No</div>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/officeArea/detail']"
            [queryParams]="{refOfficeAreaId:item.refOfficeAreaId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="del(item.refOfficeAreaId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>

  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>-->
