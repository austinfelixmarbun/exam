<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span translate class="thead-header" (click)="searchSort($event)" name='areaCode'>Area Code</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='areaName'>Area Name</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.areaCode}}</td>
        <td class="text-left">{{item.areaName}}</td>
        <td>
          <div *ngIf="item.isActive === '1'">Yes</div>
          <div *ngIf="item.isActive === '0'">No</div>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/officeArea/detail']"
            [queryParams]="{refOfficeAreaId:item.refOfficeAreaId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="del(item.refOfficeAreaId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
