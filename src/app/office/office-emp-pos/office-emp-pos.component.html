<div class="col-md-12">
  <div class="card">
    <div class="card-header">
      <h4 class="card-title" id="horz-layout-colored-controls" translate>Employee Position</h4>
    </div>
    <div class="card-body">
      <div class="px-3">
        <div class="form-body">
          <div class="form-group row" *ngIf="refEmpId != null">
            <label class="col-md-3 label-control">Employee No. </label>
            <label class="col-md-3 label-control">{{empNo}} </label>
            <label class="col-md-3 label-control">Employee Name. </label>
            <label class="col-md-3 label-control">{{empName}} </label>
          </div>
          <div class="form-group row" *ngIf="refOfficeId != null">
            <label class="col-md-3 label-control">Office Code </label>
            <label class="col-md-3 label-control">{{officeCode}} </label>
            <label class="col-md-3 label-control">Office Name </label>
            <label class="col-md-3 label-control">{{officeName}} </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'  [enviromentUrl]='urlEnviPaging' [arrCritObj]='arrCrit' (result)="getResult($event)"></app-search>
</div>

<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='officeName' translate>Employee
          Name</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='jobTitleName' translate>Job Title
          Name</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='bizUnitName' translate>Business Unit
          Name</span></th>
      <th><span class="thead-header" (click)="searchSort($event)" name='isActive' translate>Active Status</span></th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='roleName' translate>Roles</span></th>
      <th translate>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.data">
      <td class="text-left">{{item.empName}}</td>
      <td class="text-left">{{item.jobTitleName}}</td>
      <td class="text-left">{{item.bizUnitName}}</td>
      <td *ngIf="item.isActive === '1'">Yes</td>
      <td *ngIf="item.isActive === '0'">No</td>
      <td class="text-left">{{item.roleName}}</td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/officeEmpPosAdd']"
          [queryParams]="{param:'edit',refOfficeId:item.refOfficeId,empPositionId:item.empPositionId,refBizUnitId:item.refBizUnitId,officeCode:item.officeCode,officeName:item.officeName,refEmpId:item.refEmpId,empNo:item.empNo,empName:item.empName}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
        <a class="danger p-0" data-original-title="" title="" (click)="delete(item.empPositionId)">
          <i class="ft-trash-2 font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>

<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
<i class="fa fa-plus-circle" [routerLink]="['/employee/employeePositionAddEdit']"
  [queryParams]="{refEmpId:refEmpId,empNo:empNo,empName:empName}"
  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
