<div class="card">
  <div class="card-header">
    <h4 class="card-title" translate>Office List Search</h4>
  </div>
  <div class="card-body">
    <lib-ucviewgeneric [viewGenericObj]="viewGenericObj"></lib-ucviewgeneric>
    <lib-ucaddtotemp *ngIf="tempPagingObj.isReady" [tempPagingObj]="tempPagingObj" (callback)="getListTemp($event)">
    </lib-ucaddtotemp>
    <div class="card-header">
      <div class="text-right">
        <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Office/Group/Member']"
        [queryParams]="{RefOfficeId:RefOfficeId, CenterGrpId:CenterGrpId}" translate>
          <i class="fa fa-arrow-left"></i> Back
        </button>
        <button type="submit" (click)="SaveOfficeGroupMember()" class="btn btn-raised btn-primary" translate>
          <i class="far fa-check-square"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>
