<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
    (result)="getResult($event)"></app-search>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th class="text-left" (click)="searchSort($event)" name='officeName' translate>Office Name</th>
            <th (click)="searchSort($event)" name='officeCode' translate>Office Code</th>
            <th class="text-left" (click)="searchSort($event)" name='cntctPersonName' translate>Contact Person</th>
            <th class="text-left" (click)="searchSort($event)" name='officeAddr' translate>Address</th>
            <th class="text-left" (click)="searchSort($event)" name='city' translate>City</th>
            <th class="text-left" translate>Model Name</th>
            <th (click)="searchSort($event)" name='isActive' translate>Active Status</th>
            <th (click)="searchSort($event)" name='mrKonvenSyariah' translate>Konvensional / Syariah</th>
            <th (click)="searchSort($event)" name='isVirtualOffice' translate>Virtual Office</th>
            <th translate>Employee List</th>
            <th translate>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td class="text-left">{{item.officeName}}</td>
            <td>{{item.officeCode}}</td>
            <td class="text-left">{{item.cntctPersonName}}</td>
            <td class="text-left">{{item.officeAddr}}</td>
            <td class="text-left">{{item.city}}</td>
            <td class="text-left">{{item.orgMdlName}}</td>
            <td *ngIf="item.isActive === '1'">Yes</td>
            <td *ngIf="item.isActive === '0'">No</td>
            <td *ngIf="item.mrKonvenSyariah === 'KON'">Konvensional</td>
            <td *ngIf="item.mrKonvenSyariah === 'SYA'">Syariah</td>
            <td *ngIf="item.mrKonvenSyariah === ''"></td>
            <td *ngIf="item.isVirtualOffice === '1'">Yes</td>
            <td *ngIf="item.isVirtualOffice === '0'">No</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/officeEmpPos']"
                [queryParams]="{refOfficeId:item.refOfficeId,officeCode:item.officeCode,officeName:item.officeName}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
            </td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/add']"
                    [queryParams]="{param:'edit',refOfficeId:item.refOfficeId}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refOfficeId)">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
