<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
    <form>
        <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1">
                <i class="ft-x"></i> Cancel
            </button>
            <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                <i class="fa fa-search"></i> Search
            </button>
        </div>
    </form>
</div>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th class="text-left" (click)="searchSort($event)" name='officeName'>Office Name</th>
            <th (click)="searchSort($event)" name='officeCode'>Office Code</th>
            <th class="text-left" (click)="searchSort($event)" name='cntctPersonName'>Contact Person</th>
            <th class="text-left" (click)="searchSort($event)" name='officeAddr'>Address</th>
            <th class="text-left" (click)="searchSort($event)" name='city'>City</th>
            <th class="text-left">Model Name</th>
            <th>Active Status</th>
            <th>Virtual Office</th>
            <th>Employee List</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td class="text-left">{{item.officeName}}</td>
            <td>{{item.officeCode}}</td>
            <td class="text-left">{{item.cntctPersonName}}</td>
            <td class="text-left">{{item.officeAddr}}</td>
            <td class="text-left">{{item.city}}</td>
            <td class="text-left">{{item.orgMdlId}}</td>
            <td>{{item.isActive}}</td>
            <td>{{item.isVirtualOffice}}</td>
            <td>
                <a class="success p-0" data-original-title="" title="">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
            </td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/office/add']"
                    [queryParams]="{param:'edit',refOfficeId:item.refOfficeId}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<div class="gridFooter row col-md-12">

    <div class="col-md-5 col-xs-12" style="float:left;font-weight: bold;">Total Data : {{totalData}}</div>
    <div class="justify-content-center col-md-3 col-xs-12">
        <ngb-pagination (pageChange)="searchPagination($event)" [pageSize]="pageSize" [collectionSize]="totalData"
            [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>

    </div>
    <div class="col-md-4 col-xs-12" style="float:right;">
        <select class="custom-select" style="width: auto;float:right;" name="pageSize" [(ngModel)]="pageSize" (change)="onChange()">
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
        </select>
    </div>
</div>
