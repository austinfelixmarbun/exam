<div class="row text-left">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title" id="horz-layout-colored-controls">Add Business Unit</h4>
            </div>
            <div class="card-body">
                <div class="px-3">
                    <form class="form form-horizontal">
                        <div class="form-body">
                            <h4 class="form-section"><i class="ft-file-text"></i> Add/ Edit</h4>
                            <div class="form-group row">
                                <label class="col-md-3 label-control" for="projectinput5">Business Unit Code: </label>
                                <div class="col-md-9">
                                    <input type="text" id="projectinput5" class="form-control" name="bizCode" value="{{result?.bizUnitCode}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 label-control" for="projectinput5">Business Unit Name: </label>
                                <div class="col-md-9">
                                    <input type="text" id="projectinput5" class="form-control" name="bizName" [value]="result?.bizUnitName">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 label-control" for="projectinput6">Description: </label>
                                <div class="col-md-9">
                                    <textarea id="projectinput5" class="form-control" name="desc" [value]="result?.descr"></textarea>
                              </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 label-control" for="userinput5">Active Status: </label>
                                <div class="col-md-9">
                                    <input class="border-primary" [checked]="isActive" type="checkbox" id="projectinput5">
                                </div>
                            </div>
                        </div>
                        <div class="form-actions right">
                            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/organization/businessunit']">
                              <i class="ft-x"></i> Cancel
                            </button>
                            <button type="button" class="btn btn-raised btn-primary">
                                <i class="fa fa-check-square-o"></i> Save
                            </button>
                        </div>
                      </form>
                  </div>
              </div>
        </div>
    </div>
</div>
