<div>
    <app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
    <div class="col-md-12">
        <form>
            <div class="form-actions right" translate>
                <button type="button" (click)="reset()" class="btn btn-raised btn-warning mr-1">
                    <i class="ft-x"></i> Cancel
                </button>
                <button type="button" (click)="search()" class="btn btn-raised btn-primary" translate>
                    <i class="fa fa-search"></i> Search
                </button>
            </div>
        </form>
    </div>

    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th translate (click)="searchSort($event)" name='bizUnitCode'>Business Unit Code</th>
                <th translate (click)="searchSort($event)" name='bizUnitName'>Busines Unit Name</th>
                <th translate (click)="searchSort($event)" name='isActive'>Active Status</th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td>{{item.bizUnitCode}}</td>
                <td>{{item.bizUnitName}}</td>
                <td *ngIf="item.isActive === '1'">Yes</td>
                <td *ngIf="item.isActive === '0'">No</td>
                <td>
                    <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/businessunit/add']" [queryParams]="{refBizUnitId:item.refBizUnitId,mode:'edit'}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <i class="fa fa-plus-circle" [routerLink]="['/organization/businessunit/add']" style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
</div>
<div class="gridFooter row col-md-12">
    <div class="col-md-5 col-xs-12" style="float:left;font-weight: bold;" translate>Total Data : {{totalData}}</div>
    <div class="justify-content-center col-md-3 col-xs-12">
        <ngb-pagination (pageChange)="searchPagination($event)" [pageSize]="pageSize" [collectionSize]="totalData"
            [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
  
    </div>
    <div class="col-md-4 col-xs-12" style="float:right;">
        <select class="custom-select" style="width: auto;float:right;" name="pageSize" [(ngModel)]="pageSize" (change)="onChange()">
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
        </select>
    </div>
  </div>
