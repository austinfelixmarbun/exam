<section id="horizontal-form-layouts">
    <div class="row text-left">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <div class="px-3">
                <div class="row">
                    <div class="col-md-8">
                      <h4 class="card-title" id="horz-layout-colored-controls" translate>{{pageType}} Organization Job Title Information</h4>
                    </div>
                    <div class="col-md-4" style="text-align-last: right">
                      <button type="button" class="backButton" (click)="Back()" translate>
                        <i class="fa fa-arrow-left"></i> Back
                      </button>
                    </div>
                  </div>

                <form class="form form-horizontal" name="OrgJobTitleForm" #OrgJobTitleForm="ngForm" novalidate
                (ngSubmit)="OrgJobTitleForm.form.valid && Save(OrgJobTitleForm, lookupRefJobTitle, lookupOrgJobTitle)" >
                <div class="form-body">
                  
                  <div class="form-group row">
                      <label class="col-md-3  adInsLabel">Business Unit Name</label>
                      <div class="col-md-9">
                        <label>{{bizUnitName}}</label></div>
                    </div>

                  <div class="form-group row">
                      <label class="col-md-3  adInsLabel" for="lookupRefJobTitle">Job Title</label>
                      <div class="col-md-9">
                          <lib-lookuprefjobtitle #lookupRefJobTitle [lookupInput]="inputLookupObj"> </lib-lookuprefjobtitle>
                      </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-md-3  adInsLabel" for="lookupOrgJobTitle">Parent</label>
                        <div class="col-md-9">
                            <lib-lookuporgjobtitle #lookupOrgJobTitle [lookupInput]="inputLookupObj2"> </lib-lookuporgjobtitle>
                        </div>
                      </div>

                    <div class="form-group row">
                      <label class="col-md-3  adInsLabel" for="isActive">Active Status</label>
                      <div class="custom-control custom-checkbox m-0">
                        <input type="checkbox" value="1" id="isActive" name="isActive" [(ngModel)]="isActive"
                          [checked]="isActive">
                      </div>
                    </div>
                    <div class="form-actions">

                        <!-- <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                          <i class="fa fa-arrow-left"></i> Back
                        </button> -->
                        <button type="submit" class="btn btn-raised btn-primary">
                          <i class="far fa-check-square"></i> Save
                        </button>
                      </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
