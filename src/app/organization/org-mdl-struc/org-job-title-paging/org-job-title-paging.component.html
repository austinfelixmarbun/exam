<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal">
              <div class="form-body">
                <h4 class="form-section">Organization Job Title</h4>
                <br />

                <div class="form-group row">
                  <label class="col-md-3 label-control">Business Unit Name</label>
                  <div class="col-md-9">
                    <label>{{bizUnitName}}</label></div>
                </div>

                <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
                  (result)="getResult($event)" [addCritInput]='addCrit'></app-search>


                <table class="table table-responsive-md text-center table-hover">
                  <thead>
                    <tr class="table-header">
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='jobTitleName'>Job Title Name</span></th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='parentJobTitleName'>Job Parent Name</span></th>
                      <th><span class="thead-header" (click)="searchSort($event)"
                          name='isActive'>Active</span></th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of resultData?.returnObject.data">
                      <td class="text-left">{{item.jobTitleName}}</td>
                      <td class="text-left">{{item.parentJobTitleName}}</td>
                      <td>
                        <div *ngIf="item.isActive === '1'">Yes</div>
                        <div *ngIf="item.isActive === '0'">No</div>
                      </td>
                      <td>
                        <a class="success p-0" data-original-title="" title=""
                          [routerLink]="['/organization/orgJob/detail']"
                          [queryParams]="{orgJobTitleId:item.orgJobTitleId,mode:'edit',orgMdlStrucId:orgMdlStrucId,refOrgId:refOrgId,bizUnitName:bizUnitName}">
                          <i class="ft-edit-2 font-medium-3 mr-2"></i>
                        </a>
                        <a class="danger p-0" data-original-title="" title="" (click)="del(item.orgJobTitleId)">
                          <i class="ft-trash-2 font-medium-3 mr-2"></i>
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
                <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
                <div class="form-actions">
                  <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                    <i class="ft-x"></i> Back
                  </button>
                  <i class="fa fa-plus-circle" [routerLink]="['/organization/orgJob/detail']"
                    [queryParams]="{orgMdlStrucId:orgMdlStrucId,refOrgId:refOrgId,bizUnitName:bizUnitName, mode:'add'}"
                    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
