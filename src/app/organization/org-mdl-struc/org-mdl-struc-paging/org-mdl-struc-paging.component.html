<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal">
              <div class="form-body">
                <h4 class="form-section">Organization Strcture</h4>
                <br />

                <div class="form-group row">
                  <label class="col-md-3 label-control">Organization Model</label>
                  <div class="col-md-9">
                    <label>{{orgMdlObj.orgMdlName}}</label></div>
                </div>

                <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
                  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)" [addCritInput]='addCrit'></app-search>

                <div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
                  <table class="table table-responsive-md text-center table-hover">
                    <thead>
                      <tr class="table-header">
                        <th><span class="thead-header" (click)="searchSort($event)" name='orgMdlLvl'>Level</span></th>
                        <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                            name='bizUnitName'>Business Unit Name</span></th>
                        <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                            name='parentName'>Business Unit Parent Name</span></th>
                        <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
                        <th>Org Job Title</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of resultData?.data">
                        <td>{{item.orgMdlLvl}}</td>
                        <td class="text-left">{{item.bizUnitName}}</td>
                        <td class="text-left">{{item.parentName}}</td>
                        <td>
                          <div *ngIf="item.isActive === '1'">Yes</div>
                          <div *ngIf="item.isActive === '0'">No</div>
                        </td>
                        <td>
                          <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/orgJob']"
                            [queryParams]="{orgMdlStrucId:item.orgMdlStrucId,bizUnitName:item.bizUnitName, refOrgId: refOrgId}">
                            <i class="ft-edit-2 font-medium-3 mr-2"></i>
                          </a>
                        </td>
                        <td>
                          <a class="success p-0" data-original-title="" title=""
                            [routerLink]="['/organization/struc/detail']"
                            [queryParams]="{orgMdlStrucId:item.orgMdlStrucId,mode:'edit',orgMdlId:orgMdlId,refBizUnitId:item.refBizUnitId}">
                            <i class="ft-edit-2 font-medium-3 mr-2"></i>
                          </a>
                          <a class="danger p-0" data-original-title="" title="" (click)="del(item.orgMdlStrucId)">
                            <i class="ft-trash-2 font-medium-3 mr-2"></i>
                          </a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
                </div>
                <div class="form-actions">
                  <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                    <i class="ft-x"></i> Back
                  </button>
                  <i class="fa fa-plus-circle" [routerLink]="['/organization/struc/detail']"
                    [queryParams]="{orgMdlId:orgMdlId, mode:'add'}"
                    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
