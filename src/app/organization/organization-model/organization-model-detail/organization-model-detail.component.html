<section id="horizontal-form-layouts">
    <div class="row text-left">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <div class="px-3">
                <form class="form form-horizontal" name="OrgModelForm" #OrgModelForm="ngForm" novalidate
                (ngSubmit)="OrgModelForm.form.valid && Save(OrgModelForm)" >
                <div class="form-body">
                  <h4 class="form-section">Organization Model - {{type}}</h4>
                  <br />

                  <div class="form-group row">
                    <label class="col-md-3 label-control">Organization Level</label>
                    <div class="col-md-9">
                      <label>{{orgObj.orgName}}</label></div>
                  </div>

                  <div class="form-group row">
                      <label class="col-md-3 label-control" for="modelCode">Model Code</label>
                      <div class="col-md-9">
                        <input type="text" class="form-control" name="modelCode" required [(ngModel)]="modelCode"
                          #ModelCode="ngModel" [ngClass]="{ 'is-invalid': OrgModelForm.submitted && ModelCode.invalid }"
                          [attr.disabled]="type === 'edit' ? true : null">
                        <div *ngIf="OrgModelForm.submitted && ModelCode.invalid" class="invalid-feedback">
                          <div *ngIf="ModelCode.errors.required">This is required</div>
                        </div>
                      </div>
                    </div>

                    <div class="form-group row">
                      <label class="col-md-3 label-control" for="modelName">Model Name</label>
                      <div class="col-md-9">
                        <input type="text" class="form-control" name="modelName" required [(ngModel)]="modelName"
                          #ModelName="ngModel" [ngClass]="{ 'is-invalid': OrgModelForm.submitted && ModelName.invalid }">
                        <div *ngIf="OrgModelForm.submitted && ModelName.invalid" class="invalid-feedback">
                          <div *ngIf="ModelName.errors.required">This is required</div>
                        </div>
                      </div>
                    </div>

                    <div class="form-group row">
                      <label class="col-md-3 label-control" for="isActive">Active Status</label>
                      <div class="custom-control custom-checkbox m-0">
                        <input type="checkbox" value="1" id="isActive" name="isActive" [(ngModel)]="isActive"
                          [checked]="isActive">
                      </div>
                    </div>
                    <div class="form-actions">

                        <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                          <i class="ft-x"></i> Back
                        </button>
                        <button type="submit" class="btn btn-raised btn-primary">
                          <i class="fa fa-check-square-o"></i> Save
                        </button>
                      </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
