<div class="card">
  <div class="card-body">
    <div class="px-3">
        <div class="ucSearch-Button-Right" >
            <span class="mr-1" >
                    <button type="button" class="backButton"  (click)="Back()" translate>
                    <i class="fa fa-arrow-circle-left"> </i> Back </button></span>
            <span class="mr-1" >
                <button type="button" class="btn btn-raised btn-primary mr-1 btn-sm" [queryParams]="{refOrgId:refOrgId, mode:'add'}" [routerLink]="['/organization/model/detail']"
                translate>
                <i class="ft-plus-circle"></i> Add
              </button>
            </span>
          </div>
      <form>
          
        <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Organization</h4>
        <div class="form-group row">
          <label class="col-md-3">Organization Level</label>
          <div class="col-md-9">
            <label>{{orgObj.orgName}}</label>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='orgMdlCode'>Model Code</span>
        </th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='orgMdlName'>Model
            Name</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th translate>Structure</th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td class="text-left">{{item.orgMdlCode}}</td>
        <td class="text-left">{{item.orgMdlName}}</td>
        <td>
          <span *ngIf="item.isActive == '1'">Yes</span>
          <span *ngIf="item.isActive == '0'">No</span>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/struc']"
            [queryParams]="{orgMdlId:item.orgMdlId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/model/detail']"
            [queryParams]="{orgMdlId:item.orgMdlId,mode:'edit',refOrgId:refOrgId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="del(item.orgMdlId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
