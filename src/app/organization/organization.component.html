<app-search id="ucSearch" style="width:100%;"  [_url]='urlJson' [apiQryPaging]='urlQryPaging'
(result)="getResult($event)"></app-search>


<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th>Hierarchy No</th>
      <th>Organization Name</th>
      <th>Parent Organization</th>
      <th>Active Status</th>
      <th>Models</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.returnObject.data">
      <td>{{item.hierarchyNo}}</td>
      <td>{{item.orgName}}</td>
      <td>{{item.parentRefOrgName}}</td>
      <td>
        <div *ngIf="item.isActive === '1'">Yes</div>
        <div *ngIf="item.isActive === '0'">No</div>
      </td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/model']"
        [queryParams]="{refOrgId:item.refOrgId}">
        <i class="ft-edit-2 font-medium-3 mr-2"></i>
      </a>
      </td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/organization/add']"
          [queryParams]="{refOrgId:item.refOrgId,mode:'edit'}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
        <a class="danger p-0" data-original-title="" title="" (click)="del(item.refOrgId)">
          <i class="ft-x font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
