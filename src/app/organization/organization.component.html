<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span class="thead-header" (click)="searchSort($event)" name='hierarchyNo'>Hierarchy No</span></th>
        <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
            name='orgName'>Organization Name</span></th>
        <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
            name='parentRefOrgName'>Parent Organization</span></th>
        <th><span class="thead-header" (click)="searchSort($event)" name='isActive'>Active Status</span></th>
        <th>Models</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.hierarchyNo}}</td>
        <td class="text-left">{{item.orgName}}</td>
        <td class="text-left">{{item.parentRefOrgName}}</td>
        <td>
          <div *ngIf="item.isActive === '1'">Yes</div>
          <div *ngIf="item.isActive === '0'">No</div>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/model']"
            [queryParams]="{refOrgId:item.refOrgId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/organization/add']"
            [queryParams]="{refOrgId:item.refOrgId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="del(item.refOrgId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
