
<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="RefJobTitleForm" (ngSubmit)="RefJobTitleForm.valid && SaveForm()"
                #enjiForm="ngForm">
            <div class="form-body">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Job Title Information</h4>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Job Title Code </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput code" formControlName="JobTitleCode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefJobTitleForm.controls.JobTitleCode.invalid }"
                         [attr.disabled]="pageType == 'edit' ? true : null">
                  <lib-uc-show-errors [control]="RefJobTitleForm.controls.JobTitleCode" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Job Title Name </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput name" formControlName="JobTitleName"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefJobTitleForm.controls.JobTitleName.invalid }">
                  <lib-uc-show-errors [control]="RefJobTitleForm.controls.JobTitleName" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Description </label>
                <div class="col-md-9">
                  <textarea type="text" class="form-control adInsInput" formControlName="Descr"
                            [ngClass]="{ 'is-invalid': enjiForm.submitted && RefJobTitleForm.controls.Descr.invalid }"></textarea>
                  <lib-uc-show-errors [control]="RefJobTitleForm.controls.Descr" [submit]="enjiForm.submitted"></lib-uc-show-errors>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Organization/JobTitle']"
                      translate>
                <i class="ft-x"></i> Cancel
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far fa-check-square"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
