<h4>JOB TITLE</h4>
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
<div class="col-md-12">
    <form>
        <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1">
                <i class="ft-x"></i> Cancel
            </button>
            <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                <i class="fa fa-search"></i> Search
            </button>
        </div>
    </form>
</div>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th class="text-left pointer" (click)="search($event)" name='jobTitleCode'>Job Title Code</th>
            <th class="text-left pointer" (click)="search($event)" name='jobTitleName'>Job Title Name</th>
            <th class="text-left pointer" (click)="search($event)" name='descr'>Description</th>
            <th (click)="search($event)" name='mrJobPositionLvl'>Position Level</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td class="text-left">{{item.jobTitleCode}}</td>
            <td class="text-left">{{item.jobTitleName}}</td>
            <td class="text-left">{{item.descr}}</td>
            <td>{{item.mrJobPositionLvl}}</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/refjobtitle/add']"
                    [queryParams]="{param:'edit',jobTitleId:item.refJobTitleId}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<i class="fa fa-plus-circle" [routerLink]="['/organization/refjobtitle/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
Current Page : {{pageNow}}
<div class="d-flex justify-content-center">
    <ngb-pagination (pageChange)="pageChange($event)" [pageSize]="pageSize" [collectionSize]="totalData"
        [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
    
    <select class="custom-select" style="width: auto" name="pageSize" [(ngModel)]="pageSize">
        <option [ngValue]="10">10</option>
        <option [ngValue]="20">20</option>
        <option [ngValue]="50">50</option>
    </select>
</div>
