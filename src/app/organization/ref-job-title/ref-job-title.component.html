<div class="ucSearch-Button-Right">
    <span class="mr-1">
        <button type="button" class="addButton" [routerLink]="['/organization/refjobtitle/add']" translate>
            <i class="ft-plus-circle"></i> Add
        </button>
    </span>
</div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
    <table class="table table-responsive-md text-center table-hover">
        <thead>
            <tr class="table-header">
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='jobTitleCode'>Job Title Code</span> </th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='jobTitleName'>Job Title Name</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='descr'>Description</span></th>
                <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                        name='mrJobPositionLvl'>Position Level</span></th>
                <th translate>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of resultData?.data">
                <td class="text-left">{{item.jobTitleCode}}</td>
                <td class="text-left">{{item.jobTitleName}}</td>
                <td class="text-left">{{item.descr}}</td>
                <td>{{item.mrJobPositionLvl}}</td>
                <td>
                    <a class="success p-0" data-original-title="" title=""
                        [routerLink]="['/organization/refjobtitle/add']"
                        [queryParams]="{param:'edit',jobTitleId:item.refJobTitleId}">
                        <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                    <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refJobTitleId)">
                        <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- Region UC Grid Footer -->
    <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
<!-- End Region UC Grid Footer -->
