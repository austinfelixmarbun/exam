<div class = "row">
    <div class="col-md-6" style="float:left;">
        <h4>Job Title</h4>
    </div>
    <div class="col-md-6" style="float:right;text-align: right;">
        <h5>Add</h5>
    </div>
    
</div>
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' (result)="getResult($event)"></app-search>

<table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr class="table-header">
            <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                    name='jobTitleCode'>Job Title Code</span></th>
            <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                    name='jobTitleName'>Job Title Name</span></th>
            <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                    name='descr'>Description</span></th>
            <th><span class="thead-header" (click)="searchSort($event)" name='mrJobPositionLvl'>Position Level</span>
            </th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of resultData?.data">
            <td class="text-left">{{item.jobTitleCode}}</td>
            <td class="text-left">{{item.jobTitleName}}</td>
            <td class="text-left">{{item.descr}}</td>
            <td>{{item.mrJobPositionLvl}}</td>
            <td>
                <a class="success p-0" data-original-title="" title="" [routerLink]="['/organization/refjobtitle/add']"
                    [queryParams]="{param:'edit',jobTitleId:item.refJobTitleId}">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refJobTitleId)">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>
<!-- Region UC Grid Footer -->
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
<!-- End Region UC Grid Footer -->
<i class="fa fa-plus-circle" [routerLink]="['/organization/refjobtitle/add']"
    style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>
