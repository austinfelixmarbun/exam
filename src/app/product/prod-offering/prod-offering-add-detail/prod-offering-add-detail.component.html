<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header header-title">
        <div class="row">
          <div class="col-md-8">
            <h4 class="card-title" translate>Product Offering </h4>
          </div>
          <div class="col-md-4" style="text-align-last: right">
            <button type="button" class="backButton" [routerLink]="['/product/prod-offering/add']" translate>
              <i class="ft-arrow-left"></i> Back
            </button>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="px-3">
            <div class="form-body">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Main Information</h4>
              <div class="form-group row">
                <label class="col-md-2 adInsLabel">Product Offering Code </label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.ProdOfferingCode.value}}</label>

                <label class="col-md-2 adInsLabel">Start Active Date</label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.StartDt.value}} </label>
              </div>
              <div class="form-group row">
                <label class="col-md-2 adInsLabel">Product Offering Name </label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.ProdOfferingName.value}}</label>

                <label class="col-md-2 adInsLabel">End Date </label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.EndDt.value}} </label>
              </div>

              <div class="form-group row">
                <label class="col-md-2 adInsLabel">Offering Description </label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.ProdOfferingDescr.value}} </label>

                <label class="col-md-2 adInsLabel">Status</label>
                <label class="col-md-4 adInsLabel">{{ProdOfferingForm.controls.ProdOfferingStat.value}} </label>
              </div>
              </div>
            </div>
            <div class="card-body">
              <div class="px-3">
                <div class="form-actions right">
                  <button type="button" class="btn btn-raised btn-primary" [routerLink]="['./GeneralData']">
                    <i class="fa fa-check-square-o"></i> General Data
                  </button>
      
                  <button type="button" class="btn btn-raised btn-primary" [routerLink]="['./ProductComponent']"[queryParams]="{ProdOfferingHId:ProdOfferingHId}">
                    <i class="fa fa-check-square-o"></i> Product Component
                  </button>
      
                  <button type="button" class="btn btn-raised btn-primary" [routerLink]="['./OfficeMember']">
                    <i class="fa fa-check-square-o"></i> Office Member
                  </button>
                </div>
                <router-outlet></router-outlet>
              </div>
            </div>
            <!-- <div class="form-actions right">
              <button type="submit" class="btn btn-raised btn-primary">
                <i class="fa fa-check-square-o"></i> Back
              </button>
              <button type="submit" class="btn btn-raised btn-primary">
                <i class="fa fa-check-square-o"></i> Save
              </button>
            </div> -->
        </div>
      </div>
    </div>
  </div>
