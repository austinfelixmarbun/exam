<div class="col-md-12">
  <div class="card">
    <div class="card-header row">
      <h4 class="card-title col-md-6">Office Search</h4>
    </div>
    <lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)">
    </lib-UCSearch>

    <div [hidden]="resultData?.Data == null">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr class="table-header">
            <th><input type="checkbox" [checked]="checkboxAll" (change)="SelectAll($event.target.checked)" id="checkAll"
                name="CheckAll"></th>
            <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                name='OfficeCode'>Office Code</span></th>
            <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                name='OfficeName'>Office Name</span></th>
            <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)"
                name='OfficeArea'>Office Area</span></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of resultData?.Data">
            <td>
              <div *ngIf="listSelectedId.indexOf(item.RefOfficeId) >- 1">
                <input type="checkbox" id="checkSame" name="itemSame"
                  (change)="Checked(item.RefOfficeId,  $event.target.checked)" [checked]="true">
              </div>
              <div *ngIf="listSelectedId.indexOf(item.RefOfficeId) < 0">
                <input type="checkbox" id="checkDiff" name="itemDiff"
                  (change)="Checked(item.RefOfficeId,  $event.target.checked)" [checked]=false>
              </div>
            </td>
            <td class="text-left">{{item.OfficeCode}}</td>
            <td class="text-left">{{item.OfficeName}}</td>
            <td class="text-left">{{item.AreaName}}</td>
          </tr>
        </tbody>
      </table>
      <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>

      <div class="card-header">
        <div class="text-right">
          <button type="button" (click)="addToTemp()" class="btn btn-raised btn-warning mr-1">
            <i class="fa ft-plus"></i> Add To Temp
          </button>
        </div>
      </div>      
      <div [hidden]="tempData?.length == 0">
        <table class="table table-responsive-md text-center table-hover">
          <thead>
            <tr class="table-header">
              <th><span translate class="thead-header" (click)="searchSort($event)" name='OfficeCode'>Office</span>
              </th>
              <th><span translate class="thead-header" (click)="searchSort($event)" name='OfficeName'>Office Name</span>
              </th>
              <th><span translate class="thead-header" (click)="searchSort($event)" name='OfficeArea'>Office Area</span>
              </th>
              <th><span translate class="thead-header" (click)="searchSort($event)" name='AllowedCreateOffering'>Allowed
                  To Create Offering</span>
              </th>
              <th translate>ACTION</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of tempData">
              <td>{{item.OfficeCode}}</td>
              <td>{{item.OfficeName}}</td>
              <td>{{item.AreaName}}</td>
              <td><input type="checkbox" name="item.IsAllowedCrt" (change)="IsAllowedCrtClicked($event, item)"></td>
              <td>
                <div>
                  <a class="danger p-0" data-original-title="" title="" (click)="deleteFromTemp(item.RefOfficeId)">
                    <i class="ft-trash-2 font-medium-3 mr-2"></i>
                  </a></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>


    </div>
    <div class="card-header">
      <div class="text-right">
        <button type="button" (click)="GoBack()" class="btn btn-raised btn-warning mr-1" translate>
          <i class="ft-x"></i> Cancel
        </button>
          <button [hidden]="tempData?.length == 0" type="submit" (click)="SaveForm()" class="btn btn-raised btn-primary" translate>
            <i class="far fa-check-square"></i> Save
          </button>
      </div>
    </div>
  </div>
</div>
