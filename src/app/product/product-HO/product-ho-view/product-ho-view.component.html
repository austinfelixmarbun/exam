<lib-ucviewgeneric [viewInput]="viewProdMainInfoObj"> </lib-ucviewgeneric>
<mat-tab-group mat-align-tabs="center">
  <mat-tab label="GENERAL DATA">
    <ng-template matTabContent>
      <div class="card">
        <div class="card-body">
          <br />
          <div *ngFor="let item of GenData">
            <label class="col-md-3">{{item.ProdCompntName}}</label>
            <label class="col-md-9">{{item.CompntValue}}</label>
          </div>
        </div>
      </div>
    </ng-template>
  </mat-tab>
  <mat-tab label="PRODUCT COMPONENT">
    <ng-template matTabContent>
      <div class="card">
        <div class="card-body">
          <div>
            <br />
            <h5>Scheme</h5>
            <mat-divider></mat-divider>
            <br />
            <div *ngFor="let item of ProdCompSchm">
              <label class="col-md-3">{{item.ProdCompntName}}</label>
              <label class="col-md-9">{{item.CompntValue}}</label>
            </div>
          </div>
          <div>
            <br />
            <h5>Score</h5>
            <mat-divider></mat-divider>
            <br />
            <div *ngFor="let item of ProdCompScore">
              <label class="col-md-3">{{item.ProdCompntName}}</label>
              <label class="col-md-9">{{item.CompntValue}}</label>
            </div>
          </div>
          <div>
            <br />
            <h5>Rule</h5>
            <mat-divider></mat-divider>
            <br />
            <div *ngFor="let item of ProdCompRule">
              <label class="col-md-3">{{item.ProdCompntName}}</label>
              <label class="col-md-9">{{item.CompntValue}}</label>
            </div>
          </div>
          <div>
            <br />
            <h5>Other</h5>
            <mat-divider></mat-divider>
            <br />
            <div *ngFor="let item of ProdCompOther">
              <label class="col-md-3">{{item.ProdCompntName}}</label>
              <label class="col-md-9">{{item.CompntValue}}</label>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </mat-tab>
  <mat-tab label="OFFICE MEMBER">
    <ng-template matTabContent>
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr class="table-header">
            <th class="text-left">Office Code</th>
            <th class="text-left">Office name</th>
            <th class="text-left">Area Name</th>
            <th class="text-left">Allowed to Create Offering</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of ProdBranchMbr">
            <td class="text-left">{{item.OfficeCode}}</td>
            <td class="text-left">{{item.OfficeName}}</td>
            <td class="text-left">{{item.AreaName}}</td>
            <td class="text-left" *ngIf="item.IsAllowedCrt == 1">Yes</td>
            <td class="text-left" *ngIf="item.IsAllowedCrt == 0">No</td>
          </tr>
        </tbody>
      </table>
    </ng-template>
  </mat-tab>
  <mat-tab label="PRODUCT VERSION">
    <ng-template matTabContent>

    </ng-template>
  </mat-tab>
</mat-tab-group>
