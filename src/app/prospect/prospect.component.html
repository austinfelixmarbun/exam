<section id="horizontal-form-layouts">
    <div class="row text-left">
          <div class="col-sm-12">
              <div class="content-header">PROSPECT REQUEST</div>
          </div>
      </div>
    <div class="row text-left">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="px-3">
                        <form class="form form-horizontal" name="ProspectReqForm" #ProspectReqForm="ngForm" (ngSubmit)="Save(ProspectReqForm)">
                          <div class="form-body">
                            <h4 class="form-section"><i class="ft-user"></i> Customer Info </h4>
                            <div class="form-group row">
                                <label class="col-md-3 label-control">Customer Type: </label>
                                <div class="col-md-9">
                                    <label class="label-control"> Personal</label>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 label-control" for="CustModel">Customer Model: </label>
                                <div class="input-group col-md-9">
                                    <div class="custom-control custom-radio display-inline-block">
                                      <input type="radio" id="Professional" value="Professional" checked name="CustModel" class="custom-control-input" [(ngModel)]="CustModel">
                                      <label class="custom-control-label" for="Professional">Professional</label>
                                    </div>
                                    <div class="custom-control custom-radio display-inline-block">
                                      <input type="radio" id="Employee" value="Employee" name="CustModel" class="custom-control-input" [(ngModel)]="CustModel">
                                      <label class="custom-control-label" for="Employee">Employee</label>
                                    </div>
                                    <div class="custom-control custom-radio display-inline-block">
                                        <input type="radio" id="SME" value="SME"  name="CustModel" class="custom-control-input" [(ngModel)]="CustModel">
                                        <label class="custom-control-label" for="SME">Small Medium Enterprise</label>
                                      </div>
                                      <div class="custom-control custom-radio display-inline-block">
                                          <input type="radio" id="NonProf" value="NonProf" name="CustModel" class="custom-control-input" [(ngModel)]="CustModel">
                                          <label class="custom-control-label" for="NonProf">Non Professional</label>
                                        </div>
                                  </div>
                            </div>
                            <div class="form-group row">
                                  <label class="col-md-3 label-control" for="CustName">Customer Name: </label>
                                  <div class="col-md-9">
                                    <input type="text" class="form-control"  name="CustName" [(ngModel)]="CustName">
                                  </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="KtpNo">KTP No: </label>
                              <div class="col-md-9">
                                    <input type="text" id="KtpNo" class="form-control"  name="KtpNo"  required [(ngModel)]="KtpNo">
                                  </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="Gender">Gender: </label>
                                  <div class="input-group col-md-9">
                                      <div class="custom-control custom-radio display-inline-block">
                                        <input type="radio" id="Male" name="Gender" class="custom-control-input" value="M" [(ngModel)]="Gender" >
                                        <label class="custom-control-label" for="Male">Male</label>
                                      </div>
                                      <div class="custom-control custom-radio display-inline-block">
                                        <input type="radio" id="Female"  name="Gender" class="custom-control-input" value="F" [(ngModel)]="Gender" >
                                        <label class="custom-control-label" for="Female">Female</label>
                                      </div>
                                    </div>
                              </div>

                                  <div class="form-group row">
                                    <label class="col-md-3 label-control" for="BirthPlace">Birth Place: </label>
                                    <div class="col-md-9">
                                        <input type="text" id="BirthPlace" class="form-control"  name="BirthPlace"  required [(ngModel)]="BirthPlace">
                                      </div>
                                  </div>
                                  <div class="form-group row">
                                    <label class="col-md-3 label-control" for="BirthDt">Birth Date: </label>
                                    <div class="col-md-9">
                                        <div class="position-relative">
                                        <input type="date" id="BirthDt" class="form-control" name="BirthDt"  required [(ngModel)]="BirthDt">
                                        <!--<div class="form-control-position">
                                            <i class="ft-message-square"></i>
                                        </div>-->
                                      </div>
                                    </div>
                              </div>
                              <div class="form-group row">
                                    <label class="col-md-3 label-control" for="NpwpNo">NPWP No: </label>
                                <div class="col-md-9">
                                      <input type="text" id="NpwpNo" class="form-control"  name="NpwpNo"  required [(ngModel)]="NpwpNo">
                                    </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="MotherMaidenName">Mother Maiden Name: </label>
                              <div class="col-md-9">
                                    <input type="text" id="MotherMaidenName" class="form-control"  name="MotherMaidenName"  required [(ngModel)]="MotherMaidenName">
                              </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="PhoneNo">Phone No: </label>
                              <div class="col-md-9">
                                    <input type="text" id="PhoneNo" class="form-control"  name="PhoneNo"  required [(ngModel)]="PhoneNo">
                              </div>
                            </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="Email">E-mail: </label>
                                  <div class="col-md-9">
                                    <input type="text" id="Email" class="form-control"  name="Email"  required [(ngModel)]="Email">
                                  </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="Job">Job: </label>
                                  <div class="col-md-9">
                                    <input type="text" id="Job" class="form-control"  name="Job"  required [(ngModel)]="Job">
                                  </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="Job">Income: </label>
                                  <div class="col-md-9">
                                      <select id="Income" name="Income" class="form-control"  required [(ngModel)]="Income">
                                          <option id="1" value="income1">Less than 5,000,000.00</option>
                                          <option id="2" value="income2">5,000,000.00 - 10,000,000.00</option>
                                          <option id="3" value="income3">10,000,000.00 - 15,000,000.00</option>
                                          <option id="4" value="income4">15,000,000.00 - 20,000,000.00</option>
                                          <option id="5" value="income5">More than 20,000,000.00</option>
                                      </select>
                                  </div>
                              </div>
                              <div class="form-group row">
                                  <label class="col-md-3 label-control" for="Address">Address: </label>
                                  <div class="col-md-9">
                                      <textarea id="Address" rows="5" class="form-control" name="Address" [(ngModel)]="Address" ></textarea>
                                    </div>
                              </div>
                            </div>

                            <div class="form-actions">
                                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                                  <i class="ft-x"></i> Cancel
                                </button>
                                <button type="submit"  class="btn btn-raised btn-primary">
                                    <i class="fa fa-check-square-o"></i> Save
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
