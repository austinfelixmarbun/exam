<div class="card-body">
  <div class="px-3">
    <form class="col-md-12 form-horizontal" [formGroup]="FormProdOfferingComp">
      <ng-container *ngIf="ShowComparison == false">
        <div class="col-md-12" formArrayName="groups" *ngFor="let type of FormProdOfferingComp.controls['groups'].controls; let j = index">
          <div class="form-group row" [formGroupName]="j">
            <div class="col-md-12">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i>{{FormProdOfferingComp.controls['groups'].value[j].groupName}}</h4>
            </div>
            <div class="col-md-12" formArrayName="components" *ngFor="let node of type.controls['components'].controls; let l = index">
              <div class="form-group row" [formGroupName]="l">
                <label class="col-md-4 ">{{type.controls['components'].value[l].ProdCompntName}}</label>
                <label class="col-md-4" *ngIf="type.controls['components'].value[l].IsProdOffering == false">{{type.controls['components'].value[l].HOCompntValueDesc}}</label>
                <div class="col-md-4" *ngIf="type.controls['components'].value[l].ProdCompntType == 'DDL' && type.controls['components'].value[l].IsProdOffering == true">
                  <select formControlName="OfferingCompntValue" class="form-control width-95-per" id="OfferingCompntValue" name="OfferingCompntValue" (change)="onChangeCompntEvent(type.controls['components'].value[l].RefProdCompntCode,$event,l,j);">
                    <option *ngFor="let m of dictOptions[type.controls['components'].value[l].RefProdCompntCode]" value={{m.Key}} >{{m.Value}}</option>
                  </select>
                </div>
                <div class="col-md-4" *ngIf="type.controls['components'].value[l].ProdCompntType == 'AMT' && type.controls['components'].value[l].IsProdOffering == true">
                  <input type="number" class="form-control adInsInput width-95-per" formControlName="OfferingCompntValue">
                </div>
                <div class="col-md-4" *ngIf="ShowBehaviour == true && type.controls['components'].value[l].IsProdOffering == true">
                  <select formControlName="OfferingMrProdBehaviour" class="form-control" id="OfferingMrProdBehaviour" name="OfferingMrProdBehaviour">
                    <option *ngFor="let m of dictBehaviour[type.controls['components'].value[l].RefProdCompntCode]" value={{m.Key}} >{{m.Value}}</option>
                  </select>
                </div>
                <label class="col-md-4" *ngIf="ShowBehaviour == true && type.controls['components'].value[l].IsProdOffering == false">{{GetBehaviourValue(type.controls['components'].value[l].RefProdCompntCode, type.controls['components'].value[l].HOMrProdBehaviour )}}</label>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="ShowComparison == true">
        <div class="form-group-row" *ngIf="ShowBehaviour == true">
          <label class="col-md-2"></label>
          <label class="col-md-5 text-center">Product Head Office</label>
          <label class="col-md-5 text-center">Product Offering</label>
        </div>
        <div class="form-group-row" *ngIf="ShowBehaviour == false">
          <label class="col-md-2"></label>
          <label class="col-md-3 text-center">Product Head Office</label>
          <label class="col-md-3 text-center">Product Offering</label>
        </div>
        <div class="col-md-12" formArrayName="groups" *ngFor="let type of FormProdOfferingComp.controls['groups'].controls; let j = index">
          <div class="form-group row" [formGroupName]="j">
            <div class="col-md-12">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i>{{FormProdOfferingComp.controls['groups'].value[j].groupName}}</h4>
            </div>
            <div class="col-md-12" formArrayName="components" *ngFor="let node of type.controls['components'].controls; let l = index">
              <div class="form-group row" [formGroupName]="l">
                <label class="col-md-2">{{type.controls['components'].value[l].ProdCompntName}}</label>
                <label class="col-md-3">{{type.controls['components'].value[l].HOCompntValueDesc}}</label>
                <label class="col-md-2" *ngIf="ShowBehaviour == true">{{GetBehaviourValue(type.controls['components'].value[l].RefProdCompntCode, type.controls['components'].value[l].HOMrProdBehaviour )}}</label>
                <div class="col-md-3" *ngIf="type.controls['components'].value[l].ProdCompntType == 'DDL' && type.controls['components'].value[l].IsProdOffering == true">
                  <select formControlName="OfferingCompntValue" class="form-control width-95-per" id="OfferingCompntValue" name="OfferingCompntValue" (change)="onChangeCompntEvent(type.controls['components'].value[l].RefProdCompntCode,$event,l,j);">
                    <option *ngFor="let m of dictOptions[type.controls['components'].value[l].RefProdCompntCode]" value={{m.Key}} >{{m.Value}}</option>
                  </select>
                </div>
                <div class="col-md-3" *ngIf="type.controls['components'].value[l].ProdCompntType == 'AMT' && type.controls['components'].value[l].IsProdOffering == true">
                  <input type="number" class="form-control width-95-per" formControlName="OfferingCompntValue">
                </div>
                <div class="col-md-2" *ngIf="ShowBehaviour == true && type.controls['components'].value[l].IsProdOffering == true">
                  <select formControlName="OfferingMrProdBehaviour" class="form-control" id="OfferingMrProdBehaviour" name="OfferingMrProdBehaviour">
                    <option *ngFor="let m of dictBehaviour[type.controls['components'].value[l].RefProdCompntCode]" value={{m.Key}} >{{m.Value}}</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <div class="form-actions right">
        <button type="submit" (click)="SaveForm()" class="btn btn-raised btn-primary mr-1">
          <i class="fa fa-check-square-o"></i> Save
        </button>
        <button type="submit" (click)="NextDetail()" class="btn btn-raised btn-primary">
          <i class="fa fa-check-square-o"></i> Next
        </button>
      </div>
    </form>
  </div>
</div>
