<fieldset ngModelGroup="contactInfo">
    <div class="form-body">
        <h4 class="form-section card-title"><i class="ft-file-text"></i> Contact Information</h4>
        <div class="form-group row" *ngIf="useName">
            <label class="col-md-3 label-control" for="cntctPersonName">Contact Person Name :</label>
            <div class="col-md-9">
                <input type="text"id="cntctPersonName" class="form-control" name="cntctPersonName" required
                    [(ngModel)]="cntctPersonName" #CntctPersonName="ngModel"
                    [ngClass]="{ 'is-invalid':(parentForm.submitted || CntctPersonName.touched || CntctPersonName.dirty) && CntctPersonName.invalid }">
                <div *ngIf=" (parentForm.submitted || CntctPersonName.touched || CntctPersonName.dirty) && CntctPersonName.invalid"
                    class="invalid-feedback">
                    <div *ngIf="CntctPersonName.errors.required">Contact Person Name is required</div>
                </div>
            </div>
        </div>
        <div class="form-group row" *ngIf="useTitle">
            <label class="col-md-3 label-control" for="cntctPersonJobTitle">Contact Person Job Title :</label>
            <div class="col-md-9">
                <input type="text" id="cntctPersonJobTitle" class="form-control" name="cntctPersonJobTitle" required
                    [(ngModel)]="cntctPersonJobTitle" #CntctPersonJobTitle="ngModel"
                    [ngClass]="{ 'is-invalid':(parentForm.submitted || CntctPersonJobTitle.touched || CntctPersonJobTitle.dirty) && CntctPersonJobTitle.invalid }">
                <div *ngIf=" (parentForm.submitted || CntctPersonJobTitle.touched || CntctPersonJobTitle.dirty) && CntctPersonJobTitle.invalid"
                    class="invalid-feedback">
                    <div *ngIf="CntctPersonJobTitle.errors.required">Contact Person Job Title is required</div>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-3 label-control" for="mobilePhn1">Mobile Phone 1: </label>
            <div class="col-md-9">
                <input type="text" pattern="^[0-9]+$" id="mobilePhn1" class="form-control" name="mobilePhn1" required
                    [(ngModel)]="mobilePhn1" #MobilePhn1="ngModel"
                    [ngClass]="{ 'is-invalid':(parentForm.submitted || MobilePhn1.touched || MobilePhn1.dirty) && MobilePhn1.invalid }">
                <div *ngIf=" (parentForm.submitted || MobilePhn1.touched || MobilePhn1.dirty) && MobilePhn1.invalid"
                    class="invalid-feedback">
                    <div *ngIf="MobilePhn1.errors.required">Mobile Phone 1 is required</div>
                    <div *ngIf="MobilePhn1.errors?.pattern">Number Only</div>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-3 label-control" for="mobilePhn2">Mobile Phone 2: </label>
            <div class="col-md-9">
                <input type="text" pattern="^[0-9]+$" id="mobilePhn2" class="form-control" name="mobilePhn2"
                    [(ngModel)]="mobilePhn2" #MobilePhn2="ngModel">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 label-control" for="email1">Email 1: </label>
            <div class="col-md-9">
                <input type="text" pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$" id="email1"
                    class="form-control" name="email1" required [(ngModel)]="email1" #Email1="ngModel"
                    [ngClass]="{ 'is-invalid':(parentForm.submitted || Email1.touched || Email1.dirty) && Email1.invalid }">
                <div *ngIf=" (parentForm.submitted || Email1.touched || Email1.dirty) && Email1.invalid"
                    class="invalid-feedback">
                    <div *ngIf="Email1.errors.required">Email 1 is required</div>
                    <div *ngIf="Email1.errors?.pattern">Email 1 Invalid</div>
                </div>
            </div>
        </div>
        <div class="form-group row" *ngIf="useEmail2">
            <label class="col-md-3 label-control" for="email2">Email 2: </label>
            <div class="col-md-9">
                <input type="text" pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$" id="email2"
                    class="form-control" name="email2" [(ngModel)]="email2" #Email2="ngModel">
            </div>
        </div>
