<fieldset ngModelGroup="district">
  <div class="input-group">
    <input type="text" class="form-control" attr.data-json='{{lookupInput.jsonSelect}}'
      attr.data-inputId='{{lookupInput.idSelect}}' name="msNewCatalogId" attr.data-datatype="Text"
      value="{{lookupInput.nameSelect}}" #MsNewCatalogId="ngModel" required [(ngModel)]="msNewCatalogId" readonly
      [ngClass]="{ 'is-invalid':(parentForm.submitted || MsNewCatalogId.touched || MsNewCatalogId.dirty) && MsNewCatalogId.invalid }">
    <div class="input-group-append">
      <span class="input-group-btn">
        <button class="btn btn-raised btn-primary" type="button" (click)="open(content)"><i
            class="ft-search"></i></button>
      </span>
    </div>
    <div *ngIf="(parentForm.submitted || MsNewCatalogId.touched || MsNewCatalogId.dirty) && MsNewCatalogId.invalid"
      class="invalid-feedback">
      <div *ngIf="MsNewCatalogId.errors.required" class="adInsReqMsg" translate>This field is required</div>
    </div>
  </div>
  <ng-template #content let-c="close" let-d="dismiss">
    <div class="modal-header">
      <h4 class="modal-title">{{title}}</h4>
      <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <lib-UCSearch #lookupSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj'
        (result)="getResult(ucgridFooter,$event)">
      </lib-UCSearch>
      <div [hidden]="resultData?.data == null">
        <table class="table table-responsive-md text-center table-hover">
          <thead>
            <tr>
              <th (click)="searchSort(lookupSearch,'name')"><span class="thead-header">District Name</span>
              </th>
              <th (click)="searchSort(lookupSearch,'districtRegRptCode')"><span class="thead-header">District
                  Sandi
                  BI</span></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of resultData?.data">
              <td>{{item.name}}</td>
              <td>{{item.districtRegRptCode}}</td>
              <td>
                <a class="success p-0" data-original-title="" title=""
                  (click)="choose(item.refProvDistrictId,item.name,item,lookupSearch)">
                  <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
        <lib-ucgridfooter #ucgridFooter (select)="onSelect(lookupSearch,$event)"></lib-ucgridfooter>
      </div>
    </div>
  </ng-template>
</fieldset>
