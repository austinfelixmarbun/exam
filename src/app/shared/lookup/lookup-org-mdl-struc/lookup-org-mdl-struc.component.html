<div class="input-group">
  <input type="text" class="form-control" attr.data-json='{{jsonSelect}}'
    attr.data-inputId='{{idSelect}}' attr.data-datatype="Text" value="{{nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary" type="button" (click)="open(content)"><i
          class="ft-search"></i></button>
    </span>
  </div>
</div>
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <lib-UCSearch #lookupSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult(ucgridFooter, $event)"></lib-UCSearch>
    <div [hidden]="resultData?.data == null">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'bizUnitName')">Business Unit Name </span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'parentName')">Parent Name </span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'orgMdlLvl')">Level </span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'isActive')">Active Status </span></th>
            <th translate>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of resultData?.data">
            <td class="text-left">{{item.bizUnitName}}</td>
            <td class="text-left">
              <div *ngIf="item.parentName === null">-</div>
              <div *ngIf="item.parentName !== null">{{item.parentName}}</div>
            </td>
            <td>{{item.orgMdlLvl}}</td>
            <td>
              <span *ngIf="item.isActive == '1'">Yes</span>
              <span *ngIf="item.isActive == '0'">No</span>
            </td>
            <td>
              <a class="success p-0" data-original-title="" title=""
                (click)="choose(item.orgMdlStrucId,item.bizUnitName,item)">
                <i class="ft-edit-2 font-medium-3 mr-2"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
      <lib-ucgridfooter #ucgridFooter (select)="onSelect(lookupSearch,$event)"></lib-ucgridfooter>
    </div>
  </div>
</ng-template>
