<div class="input-group">
  <input type="text" class="form-control search-form-control" attr.data-json='{{jsonSelect}}'
    attr.data-inputId='{{idSelect}}' attr.data-datatype="Text" value="{{nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary lookup-form-control btn-lookup" type="button" (click)="open(content)"><i
          class="ft-search"></i></button>
    </span>
  </div>
</div>
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <app-search #lookupSearch id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
    <div class="form-actions right" style="float:right;text-align: right;margin-right: 10px;">
      <button type="button" class="btn btn-raised btn-warning mr-1">
        <i class="ft-x"></i> Cancel
      </button>
      <button type="button" (click)="search(lookupSearch)" class="btn btn-raised btn-primary">
        <i class="fa fa-search"></i> Search
      </button>
    </div>
    <table class="table table-responsive-md text-center table-hover">
      <thead>
        <tr>
          <th (click)="searchSort(lookupSearch,'roleCode')">Role Code</th>
          <th (click)="searchSort(lookupSearch,'roleName')">Role Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of resultData?.data">
          <td>{{item.roleCode}}</td>
          <td>{{item.roleName}}</td>
          <td>
            <a class="success p-0" data-original-title="" title="" (click)="choose(item.refRoleId,item.roleName,item)">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
    Current Page : {{pageNow}}
    <div class="d-flex justify-content-center">
      <ngb-pagination (pageChange)="searchPagination(lookupSearch,$event)" [pageSize]="pageSize" [collectionSize]="totalData"
        [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true"></ngb-pagination>
      <fieldset class="form-group">
        <select id="showData" (change)="changeShowData(lookupSearch,showData.value)" #showData class="form-control">
          <option *ngFor="let item of show" [value]="item">{{item}}</option>
        </select>
      </fieldset>
    </div>
  </div>
</ng-template>
