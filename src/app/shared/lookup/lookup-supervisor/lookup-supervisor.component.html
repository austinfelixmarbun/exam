<div class="input-group">
  <input type="text" class="form-control" attr.data-json='{{lookupInput.jsonSelect}}'
    attr.data-inputId='{{lookupInput.idSelect}}' attr.data-datatype="Text" value="{{lookupInput.nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary" type="button" (click)="open(content)"><i
          class="ft-search"></i></button>
    </span>
  </div>
</div>
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <lib-UCSearch #lookupSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult(ucgridFooter, $event)"></lib-UCSearch>

    <div [hidden]="resultData?.data == null">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'empNo')"><span class="thead-header"></span>Employee No</span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'empName')"><span class="thead-header"></span>Employee
                Name</span></th>
            <th translate>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of resultData?.data">
            <td>{{item.empNo}}</td>
            <td class="text-left">{{item.empName}}</td>
            <td>
              <a class="success p-0" data-original-title="" title="" (click)="choose(item.refEmpId,item.empName,item)">
                <i class="ft-edit-2 font-medium-3 mr-2"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
      <lib-ucgridfooter #ucgridFooter (select)="onSelect(lookupSearch,$event)"></lib-ucgridfooter>
    </div>
  </div>
</ng-template>
