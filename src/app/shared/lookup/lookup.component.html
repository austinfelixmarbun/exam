<div class="input-group">
  <input type="text" class="form-control search-form-control" attr.data-json='{{jsonSelect}}' attr.data-id='{{idSelect}}' 
  name="ProductName" value="{{nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary lookup-form-control btn-lookup" type="button" (click)="open(content)"><i class="ft-search"></i></button>
    </span>
  </div>
</div>
<div class="col-sm-12 col-md-12 col-lg-12 max-width">
  <div class="card">
    <div class="card-body">
      <div class="card-block">
        <ng-template #content let-c="close" let-d="dismiss">
          <div class="modal-header">
            <h4 class="modal-title">{{title}}</h4>
            <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <app-search #lookupSearch id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
            <div class="form-actions right" style="float:right;text-align: right;margin-right: 10px;">
              <button type="button" class="btn btn-raised btn-warning mr-1">
                <i class="ft-x"></i> Cancel
              </button>
              <button type="button" (click)="search(lookupSearch)" class="btn btn-raised btn-primary">
                <i class="fa fa-search"></i> Search
              </button>
            </div>
            <table class="table table-responsive-md text-center table-hover">
              <thead>
                <tr>
                  <th>Product Type</th>
                  <th>Product Name</th>
                  <th>Min Price</th>
                  <th>Max Price</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of resultData?.listItem">
                  <td>{{item.ProductType}}</td>
                  <td>{{item.ProductName}}</td>
                  <td>{{item.MinValue}}</td>
                  <td>{{item.MaxValue}}</td>
                  <td>
                    <a class="success p-0" data-original-title="" title=""
                      (click)="choose(item.MsNewCatalogId,item.ProductName,item)">
                      <i class="ft-edit-2 font-medium-3 mr-2"></i>
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
