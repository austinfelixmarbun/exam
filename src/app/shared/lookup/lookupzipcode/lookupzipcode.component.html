<div class="input-group">
  <input type="text" (input)="onChange($event.target.value)" class="form-control search-form-control"
    attr.data-json='{{jsonSelect}}' attr.data-inputId='{{idSelect}}' name="zipcode" attr.data-datatype="Text"
    value="{{nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary lookup-form-control btn-lookup" type="button" (click)="open(content)"><i
          class="ft-search"></i></button>
    </span>
  </div>
</div>
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <app-search #lookupSearch id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' (result)="getResult(ucgridFooter, $event)"></app-search>
    <table class="table table-responsive-md text-center table-hover">
      <thead>
        <tr>
          <th (click)="searchSort(lookupSearch,'city')"><span class="thead-header">City</span></th>
          <th (click)="searchSort(lookupSearch,'areaCode2')"><span class="thead-header">Kelurahan</span></th>
          <th>Kecamatan</th>
          <th>Zipcode</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of resultData?.data">
          <td>{{item.city}}</td>
          <td>{{item.areaCode2}}</td>
          <td>{{item.areaCode1}}</td>
          <td>{{item.zipcode}}</td>
          <td>
            <a class="success p-0" data-original-title="" title=""
              (click)="choose(item.zipcode,item.zipcode,item)">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
    <app-ucgrid-footer #ucgridFooter (select)="onSelect(lookupsearch, $event)"></app-ucgrid-footer>
  </div>
</ng-template>
