<div class="input-group">
  <input type="text" (input)="onChange($event.target.value)" class="form-control"
    attr.data-json='{{jsonSelect}}' attr.data-inputId='{{idSelect}}' name="zipcode" attr.data-datatype="Text"
    value="{{nameSelect}}" disabled>
  <div class="input-group-append">
    <span class="input-group-btn">
      <button class="btn btn-raised btn-primary" type="button" (click)="open(content)"><i
          class="ft-search"></i></button>
    </span>
  </div>
</div>
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <lib-UCSearch #lookupSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult(ucgridFooter, $event)"></lib-UCSearch>
    <div [hidden]="resultData?.data == null">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'rz.city')">City</span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'rz.area_Code_2')">Kelurahan</span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'rz.area_Code_1')">Kecamatan</span></th>
            <th><span translate class="thead-header" (click)="searchSort(lookupSearch,'rz.zipcode')">Zipcode</span></th>
            <th translate>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of resultData?.data">
            <td>{{item.city}}</td>
            <td>{{item.areaCode2}}</td>
            <td>{{item.areaCode1}}</td>
            <td>{{item.zipcode}}</td>
            <td>
              <a class="success p-0" data-original-title="" title="" (click)="choose(item.zipcode,item.zipcode,item)">
                <i class="ft-edit-2 font-medium-3 mr-2"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
      <lib-ucgridfooter #ucgridFooter (select)="onSelect(lookupSearch, $event)"></lib-ucgridfooter>
    </div>
  </div>
</ng-template>
