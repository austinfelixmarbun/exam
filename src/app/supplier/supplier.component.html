<div class="row text-left">
  <app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
    <div class="col-md-12">
        <form>
            <div class="form-actions right">
                    <button type="button" class="btn btn-raised btn-warning mr-1">
                        <i class="ft-x"></i> Cancel
                    </button>
                    <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                        <i class="fa fa-search"></i> Search
                    </button>
                </div>      
        </form>
    </div>
  <table class="table table-responsive-md text-center table-hover">
    <thead>
        <tr>
            <th>#</th>
            <th></th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>
                <div class="custom-control custom-checkbox m-0">
                    <input type="checkbox" class="custom-control-input" id="item1">
                    <label class="custom-control-label" for="item1"></label>
                </div>
            </td>
            <td>John</td>
            <td>Carter</td>
            <td>Male</td>
            <td>johncarter@mail.com</td>
            <td>
                <a class="info p-0" data-original-title="" title="" (click)="typeSuccess()">
                    <i class="ft-user font-medium-3 mr-2"></i>
                </a>
                <a class="success p-0" data-original-title="" title="" (click)="typeError()">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="" (click)="errMsg()">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td>
                <div class="custom-control custom-checkbox m-0">
                    <input type="checkbox" class="custom-control-input" id="item2">
                    <label class="custom-control-label" for="item2"></label>
                </div>
            </td>
            <td>Peter</td>
            <td>Parker</td>
            <td>Male</td>
            <td>peterparker@mail.com</td>
            <td>
                <a class="info p-0" data-original-title="" title="">
                    <i class="ft-user font-medium-3 mr-2"></i>
                </a>
                <a class="success p-0" data-original-title="" title="">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
        <tr>
            <td>3</td>
            <td>
                <div class="custom-control custom-checkbox m-0">
                    <input type="checkbox" class="custom-control-input" id="item3">
                    <label class="custom-control-label" for="item3"></label>
                </div>
            </td>
            <td>John</td>
            <td>Rambo</td>
            <td>Male</td>
            <td>johnrambo@mail.com</td>
            <td>
                <a class="info p-0" data-original-title="" title="">
                    <i class="ft-user font-medium-3 mr-2"></i>
                </a>
                <a class="success p-0" data-original-title="" title="">
                    <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
                <a class="danger p-0" data-original-title="" title="">
                    <i class="ft-x font-medium-3 mr-2"></i>
                </a>
            </td>
        </tr>
    </tbody>
    </table>
