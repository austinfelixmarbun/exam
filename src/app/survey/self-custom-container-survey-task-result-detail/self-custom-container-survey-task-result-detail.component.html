<div class="bg-light-blue-card">
    <form class="form form-horizontal" [formGroup]="SrvyTaskForm" #formDirective="ngForm" (ngSubmit)="SrvyTaskForm.valid && Save()"
    #enjiForm="ngForm">
    <div formArrayName="QuestionObjs" *ngIf="isStatScs">
        <div class="form-body" [formGroupName]="i"
          *ngFor="let QuestionGrpList of SrvyTaskForm.controls.QuestionObjs.controls; let i = index">
          <lib-ucSubsection [id]="'grpName'+i+'id'" [title]="QuestionGrpList.value.VerfQuestionGrpName"
            [panel]="'grpName'+i">
          </lib-ucSubsection>
          <div id="grpName{{i}}" class="px-3">
            <span formArrayName="VerfQuestionAnswerList">
              <div class= "row">
                <label class="col-md-3 label-field-2" tanslate><h4 class="modal-title">Question</h4></label>
                <label class="col-md-4 label-field-2" translate><h4 class="modal-title">Answer</h4></label>
                <label class="col-md-5 label-field-2" translate><h4 class="modal-title">Notes</h4></label>
              </div>
              <div class="form-group row" [formGroupName]="j"
                *ngFor="let QRList of QuestionGrpList.controls.VerfQuestionAnswerList.controls; let j = index">
                <label class="col-md-3 label-field-2 adins-required-label" *ngIf="isStatScs"
                  translate>{{QRList.value.QuestionGrp.VerfQuestionText}} </label>
                <label class="col-md-3 adInsLabel label-field-2" *ngIf="!isStatScs"
                  translate>{{QRList.value.QuestionGrp.VerfQuestionText}}</label>
                <div class="col-md-4" formGroupName="ResultGrp">
                  <span *ngIf="QRList.value.QuestionGrp.VerfAnswerTypeCode == 'DDL' || QRList.value.QuestionGrp.VerfAnswerTypeCode == 'RBL'">
                    <select class="form-control input-field-2" formControlName="Answer"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && QRList.controls.ResultGrp.controls.Answer.invalid }">
                      <option *ngFor="let item of ListVerfAnswer[i][j]" value="{{item}}">
                        {{item}}
                      </option>
                    </select>
                    <div class="message-box">
                      <lib-uc-show-errors [control]="QRList.controls.ResultGrp.controls.Answer"
                      [submit]="enjiForm.submitted">
                      </lib-uc-show-errors>
                    </div>

                  </span>
                  <span *ngIf="QRList.value.QuestionGrp.VerfAnswerTypeCode == 'TXT'">
                    <input type="text" class="form-control input-field-2" formControlName="Answer"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && QRList.controls.ResultGrp.controls.Answer.invalid }">
                    <div class="message-box">
                      <lib-uc-show-errors [control]="QRList.controls.ResultGrp.controls.Answer"
                      [submit]="enjiForm.submitted">
                      </lib-uc-show-errors>
                    </div>
                  </span>
                  <span *ngIf="QRList.value.QuestionGrp.VerfAnswerTypeCode == 'DT_PICKER'">
                    <input type="date" class="form-control input-field-2" formControlName="Answer"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && QRList.controls.ResultGrp.controls.Answer.invalid }">
                    <div class="message-box">
                      <lib-uc-show-errors [control]="QRList.controls.ResultGrp.controls.Answer"
                      [submit]="enjiForm.submitted">
                      </lib-uc-show-errors>
                    </div>
                  </span>
                  <span *ngIf="QRList.value.QuestionGrp.VerfAnswerTypeCode == 'UC_INPUT_NUMBER'">
                    <input type="" currencyMask id="AnswerId" class="form-control input-field-2" formControlName="Answer"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && QRList.controls.ResultGrp.controls.Answer.invalid }">
                    <div class="message-box">
                      <lib-uc-show-errors [control]="QRList.controls.ResultGrp.controls.Answer"
                      [submit]="enjiForm.submitted">
                      </lib-uc-show-errors>
                    </div>
                  </span>
                </div>
                <div class="col-md-5" formGroupName="ResultGrp">
                  <textarea class="form-control textarea-field-2" formControlName="Notes"></textarea>
                </div>
              </div>
            </span>
          </div>
        </div>
    </div>
    <div class="form-actions right">
      <div class="px-3">
        <button type="button" class="btn btn-raised btn-outline-2 mr-1 margin-r-5" (click)="Cancel()">
          <i class="ft-x"></i>&nbsp;<span translate>Cancel</span>
        </button>

        <button type="submit" class="btn btn-raised btn-primary-2">
          <i class="far fa-check-square"></i>&nbsp;<span translate>Save</span>
        </button>
      </div>
      </div>
    </form>
</div>>
