<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <h4 class="form-section card-title" translate><i class="ft-file-text"></i>ROLE</h4>
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="RefRoleForm" (ngSubmit)="RefRoleForm.valid && SaveForm()"
                #enjiForm="ngForm">
            <lib-ucSubsection [id]="'RoleInfoId'" [title]="title" [panel]="'RoleInfo'"></lib-ucSubsection>
            <div class="form-body" id="RoleInfo">
              
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Role Code </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RoleCode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefRoleForm.controls.RoleCode.invalid }">
                  <show-errors [control]="RefRoleForm.controls.RoleCode" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel " translate>Role Name </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="RoleName"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefRoleForm.controls.RoleName.invalid }">
                  <show-errors [control]="RefRoleForm.controls.RoleName" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Active </label>
                <div class="col-md-9">
                  <input class="border-primary" type="checkbox" data-md-icheck
                         formControlName="IsActive" />
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/systemSetting/role']"
                translate>
                <i class=""></i> Cancel
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="fa fa-check-square-o"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
