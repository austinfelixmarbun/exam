<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="RoleFrmForm" #RoleFrmForm="ngForm" (ngSubmit)="Save()">
              <div class="form-body">
                <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Assign Form to Role</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel">Role Code</label>
                  <div class="col-md-9">
                    <label>{{authFormObj.roleCode}}</label></div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control adInsLabel">Role Name</label>
                  <div class="col-md-9">
                    <label>{{authFormObj.roleName}}</label></div>
                </div>

                <div [hidden]="resultData == null">
                  <table class="table table-responsive-md text-center table-hover">
                    <thead>
                      <tr class="table-header">
                     <th><span translate name='formCode'>Form Code
                          </span></th>
                        <th><span translate class="text-left pointer" name='title'>Title
                          </span></th>
                        <th><span translate class="text-left pointer" name='path'>Path</span>
                        </th>
                        <th translate>Form Feature</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of resultData;  let i = index">
                        <td>{{item.formCode}}</td>
                        <td class="text-left">{{item.title}}</td>
                        <td class="text-left">{{item.path}}</td>
                        <td>
                          <div *ngIf="item.path !== ''">
                            <a class="success p-0" data-original-title="" title=""
                              [routerLink]="['/systemSetting/formFeature/detail']" [queryParams]="{
                              refRoleId:authFormObj.refRoleId,
                              refFormId:item.refFormId,
                              roleName:authFormObj.roleName,
                              formName:item.title
                            }">
                              <i class="ft-edit-2 font-medium-3 mr-2"></i>
                            </a></div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="fa fa-arrow-circle-left"></i> Back
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
