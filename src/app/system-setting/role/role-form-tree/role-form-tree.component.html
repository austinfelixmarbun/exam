<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="RoleFrmForm" #RoleFrmForm="ngForm" (ngSubmit)="Save()">
              <div class="form-body">
                <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Assign Form to Role</h4>

                <div class="form-group row">
                  <label class="col-md-3  adInsLabel">Role Code</label>
                  <div class="col-md-9">
                    <label>{{refRoleObj.roleCode}}</label></div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel">Role Name</label>
                  <div class="col-md-9">
                    <label>{{refRoleObj.roleName}}</label></div>
                </div>
                <!-- <div class="example-config">
                  Checked keys: {{listSelectedId.join(",")}}
                </div> -->
                <div class="form-group row">
                  <kendo-treeview [nodes]="listMenu" textField="title"
                    idField="refFormId" parentIdField="parentId"
                    [checkBy]="key"
                    [(checkedKeys)]="listSelectedId"
                    kendoTreeViewCheckable
                    kendoTreeViewExpandable
                    kendoTreeViewSelectable
                    kendoTreeViewFlatDataBinding>
                  </kendo-treeview>
                </div>
              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="fa fa-arrow-circle-left"></i> Back
                </button>

                <button type="submit" class="btn btn-raised btn-primary">
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
