<div class="card">
  <div class="card-body">
    <lib-ucviewgeneric [viewGenericObj]="viewGenericObj"> </lib-ucviewgeneric>
    <lib-ucaddtotemp *ngIf="tempPagingObj.isReady" [tempPagingObj]="tempPagingObj" (callback)="getListTemp($event)">
    </lib-ucaddtotemp>
    <div class="card-header">
      <div class="text-right">
        <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/SystemSetting/RoleForm']" [queryParams]="{RefRoleId: this.RefRoleId}" translate>
          <i class="fa fa-arrow-left"></i> Back
        </button>
        <button type="submit" (click)="SaveListAuthForm()" class="btn btn-raised btn-primary" translate>
          <i class="far fa-check-square"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>
