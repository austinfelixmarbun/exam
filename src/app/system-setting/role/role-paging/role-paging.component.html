<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th><span translate class="thead-header" (click)="searchSort($event)" name='roleCode'>Role Code</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='roleName'>Role
            Name</span></th>
        <th><span translate class="thead-header" (click)="searchSort($event)" name='isActive'>Active</span></th>
        <th translate>Users</th>
        <th translate>Forms</th>
        <!-- <th>Form Features</th> -->
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td>{{item.roleCode}}</td>
        <td align="left">{{item.roleName}}</td>
        <td>
          <div *ngIf="item.isActive === '1'">Yes</div>
          <div *ngIf="item.isActive === '0'">No</div>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/roleUser']"
            [queryParams]="{refRoleId:item.refRoleId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/roleForm']"
            [queryParams]="{refRoleId:item.refRoleId}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
        </td>
        <!-- <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/role/detail']"
          [queryParams]="{refOrgId:item.refOrgId,mode:'edit'}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td> -->
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/role/detail']"
            [queryParams]="{refRoleId:item.refRoleId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="del(item.refRoleId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
</div>
<!--<i class="fa fa-plus-circle" [routerLink]="['/systemSetting/role/detail']"
  style="position: absolute; right: 30px; bottom: 0; cursor: pointer; font-size: 36px"></i>-->
