<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="RoleUserFoem" #RoleUserForm="ngForm"
              (ngSubmit)="Save(RoleUserForm)">
              <div class="form-body">
                <h4 class="form-section card-title" translate><i class="ft-file-text"></i>Assign User to Role</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Role Code</label>
                  <div class="col-md-9">
                    <label>{{refRoleObj.roleCode}}</label></div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control">Role Name</label>
                  <div class="col-md-9">
                    <label>{{refRoleObj.roleName}}</label></div>
                </div>

                <app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
                  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

                <div [hidden]="resultData?.data == null|| resultData?.data.length == 0">
                  <table class="table table-responsive-md text-center table-hover">
                    <thead>
                      <tr class="table-header">
                        <th>Action</th>
                        <th><span translate class="thead-header" (click)="searchSort($event)" name='officeCode'>OfficeCode
                          </span></th>
                        <th><span translate class="thead-header" (click)="searchSort($event)"
                            name='officeName'>Office Name
                          </span></th>
                        <th><span translate class="thead-header" (click)="searchSort($event)"
                            name='bizUnitName'>Business Unit
                            Name</span></th>
                        <th><span translate class="thead-header" (click)="searchSort($event)"
                            name='jobTitleName'>Job Title Name</span>
                        </th>
                        <th><span translate class="thead-header" (click)="searchSort($event)" name='employeeNo'>Employee No</span>
                        </th>
                        <th><span translate class="thead-header" (click)="searchSort($event)"
                            name='employeeName'>Employee Name</span>
                        </th>
                        <th><span translate class="thead-header" (click)="searchSort($event)" name='username'>User Name</span>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of resultData?.data;  let i = index">
                        <td>
                          <div *ngIf="refRoleObj.refRoleId === item.refRoleId && item.isActive === '1'">
                            <input type="checkbox" id="checkSame" name="itemSame"
                              (change)="Checked(item.empPositionId,  $event.target.checked)" [checked]=true>
                          </div>
                          <div *ngIf="refRoleObj.refRoleId === item.refRoleId && item.isActive === '0'">
                            <input type="checkbox" id="checkActive" name="itemActive"
                              (change)="Checked(item.empPositionId,  $event.target.checked)" [checked]=false>
                          </div>
                          <div *ngIf="refRoleObj.refRoleId !== item.refRoleId">
                          </div>
                          <div *ngIf="item.refRoleId === 0">
                            <input type="checkbox" id="checkDiff" name="itemDiff"
                              (change)="Checked(item.empPositionId,  $event.target.checked)" [checked]=false>
                          </div>
                        </td>
                        <td>{{item.officeCode}}</td>
                        <td align="left">{{item.officeName}}</td>
                        <td align="left">{{item.bizUnitName}}</td>
                        <td align="left">{{item.jobTitleName}}</td>
                        <td>{{item.employeeNo}}</td>
                        <td align="left">{{item.employeeName}}</td>
                        <td>{{item.username}}</td>

                      </tr>
                    </tbody>
                  </table>
                  <app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
                </div>
              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="fa fa-arrow-circle-left"></i> Back
                </button>

                <button type="submit" class="btn btn-raised btn-primary">
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
