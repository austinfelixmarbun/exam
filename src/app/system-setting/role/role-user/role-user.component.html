<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="RoleUserFoem" #RoleUserForm="ngForm"
              (ngSubmit)="Save(RoleUserForm)">
              <div class="form-body">
                <h4 class="form-section"><i class="ft-user"></i>Assign User to Role</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Username</label>
                  <div class="col-md-9">
                    <label>{{refUserObj.username}}</label></div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control">Employee No</label>
                  <div class="col-md-9">
                    <label>{{refEmpObj.empNo}}</label></div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Employee Name</label>
                  <div class="col-md-9">
                    <label>{{refEmpObj.empName}}</label></div>
                </div>

                <app-search id="ucSearch" style="width:100%;" [_url]='urlJson'></app-search>
                <div class="col-md-12">
                  <form>
                    <div class="form-actions right">
                      <button *ngIf="exportData" type="button" (click)="exportAsXLSX()"
                        class="btn btn-raised btn-success mr-1">
                        <i class="fa fa-plus-circle"></i> Export Excel
                      </button>
                      <button type="button" class="btn btn-raised btn-warning mr-1">
                        <i class="ft-x"></i> Cancel
                      </button>
                      <button type="button" (click)="search()" class="btn btn-raised btn-primary">
                        <i class="fa fa-search"></i> Search
                      </button>
                    </div>
                  </form>
                </div>

                <table class="table table-responsive-md text-center table-hover">
                  <thead>
                    <tr class="table-header">
                      <th>Action</th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='officeCode'>OfficeCode
                        </span></th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='officeName'>Office Name
                        </span></th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='busUnitName'>Business Unit
                          Name</span></th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='jobTitleName'>Job Title Name</span>
                      </th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='empNo'>Employee No</span>
                      </th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='empName'>Employee Name</span>
                      </th>
                      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)"
                          name='userName'>User Name</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of resultData?.returnObject">
                      <td></td>
                      <td>{{item.officeCode}}</td>
                      <td align="left">{{item.officeName}}</td>
                      <td align="left">{{item.bizUnitName}}</td>
                      <td align="left">{{item.jobTitleName}}</td>
                      <td align="left">{{item.empNo}}</td>
                      <td align="left">{{item.empName}}</td>
                      <td align="left">{{item.username}}</td>

                    </tr>
                  </tbody>
                </table>
                <div class="d-flex justify-content-center">
                  <ngb-pagination (pageChange)="pageChange($event)" [pageSize]="pageSize" [collectionSize]="totalData"
                    [(page)]="pageNow" [maxSize]="5" [rotate]="true" [ellipses]="true" [boundaryLinks]="true">
                  </ngb-pagination>
                  <fieldset class="form-group">
                    <select id="showData" (change)="changeShowData(showData.value)" #showData class="form-control">
                      <option *ngFor="let item of show" [value]="item">{{item}}</option>
                    </select>
                  </fieldset>
                </div>
              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="ft-x"></i> Cancel
                </button>

                <button type="submit" class="btn btn-raised btn-primary">
                  <i class="fa fa-check-square-o"></i> Save
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
