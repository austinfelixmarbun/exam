<h4 class="form-section">User Maintenance</h4>
<br />
<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging' (result)="getResult($event)"></app-search>

<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th><span class="thead-header" (click)="searchSort($event)" name='username'>Username
      </span></th>
      <th><span class="thead-header" (click)="searchSort($event)" name='empNo'>Employee No
      </span></th>
      <th class="text-left pointer"><span class="thead-header" (click)="searchSort($event)" name='empName'>Employee
          Name</span></th>
      <th>Roles</th>
      <th>Change Password</th>
      <th>Reset Password</th>
      <th>Edit</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.returnObject.data">
      <td>{{item.username}}</td>
      <td>{{item.empNo}}</td>
      <td align="left">{{item.empName}}</td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/userRole']"
        [queryParams]="{refUserId:item.refUserId}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/refUser/detail']"
        [queryParams]="{refUserId:item.refUserId,mode:'changePassword'}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td>
       <td>
          <a class="success p-0" data-original-title="" title="" (click)="resetPassword(item.refUserId)">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
      </td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/systemSetting/refUser/detail']"
          [queryParams]="{refUserId:item.refUserId,mode:'edit'}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
