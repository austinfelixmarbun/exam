<section id="horizontal-form-layouts">
  <div class="row text-left">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form class="form form-horizontal" name="UserRoleForm" #UserRoleForm="ngForm">
              <div class="form-body">
                <h4 class="form-section"><i class="ft-user"></i>Assign User to Role</h4>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Username</label>
                  <div class="col-md-9">
                    <label>{{refUserObj.username}}</label></div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3 label-control">Employee No</label>
                  <div class="col-md-9">
                    <label>{{refEmpObj.empNo}}</label></div>
                </div>

                <div class="form-group row">
                  <label class="col-md-3 label-control">Employee Name</label>
                  <div class="col-md-9">
                    <label>{{refEmpObj.empName}}</label></div>
                </div>

                <table class="table table-responsive-md text-center table-hover">
                  <thead>
                    <tr class="table-header">
                      <th class="text-left pointer"><span class="thead-header" name='officeCode'>OfficeCode
                        </span></th>
                      <th class="text-left pointer"><span class="thead-header" name='officeName'>Office Name
                        </span></th>
                      <th class="text-left pointer"><span class="thead-header" name='busUnitName'>Business Unit
                          Name</span></th>
                      <th class="text-left pointer"><span class="thead-header" name='jobTitleName'>Job Title Name</span>
                      </th>
                      <th>Roles</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of resultData?.data">
                      <td>{{item.officeCode}}</td>
                      <td align="left">{{item.officeName}}</td>
                      <td align="left">{{item.bizUnitName}}</td>
                      <td align="left">{{item.jobTitleName}}</td>
                      <td>
                        <a class="success p-0" data-original-title="" title=""
                          [routerLink]="['/systemSetting/userRole/detail']"
                          [queryParams]="{officeCode:item.officeCode, officeName:item.officeName, bizUnitName:item.bizUnitName, jobTitleName:item.jobTitleName, userName:refUserObj.username, empPositionId: item.empPositionId}">
                          <i class="ft-edit-2 font-medium-3 mr-2"></i>
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>

              </div>
              <div class="form-actions">
                <button type="button" (click)="Back()" class="btn btn-raised btn-warning mr-1">
                  <i class="ft-x"></i> Back
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
