<label>
  Name:
  <input type="text" [formControl]="name">
</label>

<p>
  <button (click)="updateName()">Update Name</button>
</p>

<p>
  Value: {{ name.value }}
</p>

<form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
  <label>
    First Name:
    <input type="text" class="form-control adInsInput" formControlName="firstName">
    <show-errors [control]="profileForm.controls.firstName"></show-errors>
  </label>

  <label>
    Last Name:
    <input type="text" class="form-control adInsInput" formControlName="lastName">
  </label>

  <div formGroupName="address">
    <h3>Address</h3>

    <label>
      Street:
      <input type="text" class="form-control adInsInput" formControlName="street">
    </label>

    <label>
      City:
      <input type="text" class="form-control adInsInput" formControlName="city">
    </label>

    <label>
      State:
      <input type="text" class="form-control adInsInput" formControlName="state" pattern="^[0-9]+$">
      <show-errors [control]="profileForm.controls.state"></show-errors>
    </label>

    <label>
      Zip Code:
      <input type="number" class="form-control adInsInput" formControlName="zip">
      <show-errors [control]="profileForm.controls.zip"></show-errors>
    </label>
  </div>
  <div formArrayName="aliases">
    <h3>Aliases</h3> <button (click)="addAlias()">Add Alias</button>

    <div *ngFor="let address of aliases.controls; let i=index">
      <!-- The repeated alias template -->
      <label>
        Alias:
        <input type="text" [formControlName]="i">
      </label>
    </div>
  </div>
  <button type="submit" [disabled]="!profileForm.valid">Submit</button>
  <p>
    <button (click)="updateProfile()">Update Profile</button>
  </p>
</form>
<p>
  Form Status: {{ profileForm.status }}
</p>
