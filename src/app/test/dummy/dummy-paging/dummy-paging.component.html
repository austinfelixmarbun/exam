<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>
<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th *ngFor="let head of headerList" [ngClass]="{ 'text-left': head.position == 'left',
                     'text-right': head.position == 'right' }">
          <span *ngIf="head.type == 'sort'" translate class="thead-header" (click)="searchSort($event)"
            attr.name="{{head.name}}">{{head.label}}</span>
          <span *ngIf="head.type == 'label'">{{head.label}}</span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td *ngFor="let body of bodyList" [ngClass]="{ 'text-left': body.position == 'left',
                     'text-right': body.position == 'right' }">
          <span *ngIf="body.type == 'text'">{{ item[body.property] }}</span>
          <span *ngIf="body.type == 'boolean'">
            <span *ngIf="item[body.property] == '1'">Yes</span>
            <span *ngIf="item[body.property] == '0'">No</span>
            <span *ngIf="item[body.property] == '' || item[body.property] == null">-</span>
          </span>
          <span *ngIf="body.type == 'action'">
            <span *ngFor="let act of body?.action">
              <span *ngIf="act.icon == 'edit'">
                <a class="success p-0" [routerLink]="[act.path]"
                [queryParams]="genAction(item,act.param)">
                  <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
              </span>
              <span *ngIf="act.icon == 'delete'">
                <a class="danger p-0" (click)="delete(genBody(item,act.property))">
                  <i class="ft-trash-2 font-medium-3 mr-2"></i>
                </a>
              </span>
            </span>
            <!-- <a class="success p-0" data-original-title="" title="" [routerLink]="['/bank/edit']"
              [queryParams]="{refBankId:item.refBankId,mode:'edit'}">
              <i class="ft-edit-2 font-medium-3 mr-2"></i>
            </a>
            <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refBankId)">
              <i class="ft-trash-2 font-medium-3 mr-2"></i>
            </a> -->
          </span>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
