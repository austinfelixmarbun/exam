<div class="card" *ngIf="isReady">
  <div class="card-header" *ngIf="viewList?.title != ''">
    <h4 class="card-title" id="horz-layout-colored-controls" translate> {{ viewList.title }} </h4>
  </div>
  <div class="card-body" *ngFor="let ss of viewList?.subsection;let i = index;">
    <div class="px-3">
      <lib-ucSubsection *ngIf="ss.subsection != ''" [id]="ss.subSectionId + 'id'" [title]="ss.subSectionTitle"
        [panel]="ss.subSectionId">
      </lib-ucSubsection>
      <div class="form-body" [id]='ss.subSectionId'>
        <div class="form-group row">
          <div class="col-md-6" *ngFor="let mi of ss?.mainInfo">
            <div class="row">
              <div class="col-md-6">
                <label class="label-control" translate> {{ mi.label }} </label>
              </div>
              <div *ngIf="viewInfoObjList[i] != undefined" class="col-md-6" [ngClass]="{ 'text-left': mi.position == 'left',
                    'text-right': mi.position == 'right', 'text-center': mi.position == 'center' }">
                <span *ngIf="mi.type == 'text'">
                  <label *ngIf="viewInfoObjList[i][mi.property] != '' && viewInfoObjList[i][mi.property] != null"
                    class="label-control" translate> {{ viewInfoObjList[i][mi.property] }}
                  </label>
                  <label *ngIf="viewInfoObjList[i][mi.property] == '' || viewInfoObjList[i][mi.property] == null"
                    class="label-control" translate>-
                  </label>
                </span>
                <label *ngIf="mi.type == 'currency'" class="label-control" translate>
                  {{ viewInfoObjList[i][mi.property] | number}} </label>
                <label *ngIf="mi.type == 'date'" class="label-control" translate>
                  {{ viewInfoObjList[i][mi.property] | date: 'dd-MMM-yyyy'}} </label>
                <label *ngIf="mi.type == 'link'" class="label-control" translate>
                  <a *ngIf="!mi?.isFullpath" [routerLink]="[mi.path]" [target]="mi.target"
                    [queryParams]="genAction(viewInfoObjList[i], mi.param)">
                    {{ viewInfoObjList[i][mi.property] }}
                  </a>
                  <a *ngIf="mi?.isFullpath" href="javascript:void(0);"
                    (click)="redirectFullPath(mi.fullpath, genAction(viewInfoObjList[i], mi.param), mi.target)">
                    {{ viewInfoObjList[i][mi.property] }}
                  </a>
                </label>
                <label *ngIf="mi.type == 'callback'" class="label-control" translate>
                  <a href="javascript:void(0);" (click)="callbackFunction(viewInfoObjList[i], mi.key)">
                    {{ viewInfoObjList[i][mi.property] }}
                  </a>
                </label>
                <textarea *ngIf="mi.type == 'textarea'" class="form-control" readonly
                  translate> {{ viewInfoObjList[i][mi.property] }} </textarea>
                <span *ngIf="mi.type == 'boolean'">
                  <label *ngIf="viewInfoObjList[i][mi.property] == true">Yes</label>
                  <label *ngIf="viewInfoObjList[i][mi.property] == false">No</label>
                  <!-- <label
                    *ngIf="viewInfoObjList[i][mi.property] == '' || viewInfoObjList[i][mi.property] == null">-</label> -->
                </span>
                <span *ngIf="mi.type == 'concat'">
                  <label class="label-control" translate> {{ mi.concat }}
                  </label>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
