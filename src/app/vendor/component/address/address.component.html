<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="card-header header-title">
          <div class="row">
          </div>
        </div>
        <div class="px-3">
          <form class="form form-horizontal" [formGroup]="AddressForm" (ngSubmit)="AddressForm.valid && SaveForm()"
            #enjiForm="ngForm">
            <lib-ucSubsection [id]="'AddressInfoId'" [title]="'Address Info'" [panel]="'AddressInformation'">
            </lib-ucSubsection>
            <div class="form-body" id="AddressInformation">
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Address</label>
                <div class="col-md-9">
                  <textarea class="form-control adInsInput width-50-per" formControlName="Addr"> </textarea>
                  <show-errors [control]="AddressForm.controls.Addr" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3 adInsLabel">Zip Code</label>
                <div class="col-md-3">
                  <lib-uclookupgeneric [lookupInput]="inputLookupZipcodeObj" [parentForm]="AddressForm"
                    [enjiForm]="enjiForm" [identifier]="'lookupZipcode'" (lookup)="getLookupZipcode($event)">
                  </lib-uclookupgeneric>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kelurahan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="AreaCode2">
                  <show-errors [control]="AddressForm.controls.AreaCode2" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kecamatan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="AreaCode1">
                  <show-errors [control]="AddressForm.controls.AreaCode1" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>City</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="City">
                  <show-errors [control]="AddressForm.controls.City" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Province</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="Province">
                  <show-errors [control]="AddressForm.controls.Province" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
            </div>
            <lib-ucSubsection [id]="'LatLongInfoId'" [title]="'Lat Long Info'" [panel]="'LatLongInformation'">
            </lib-ucSubsection>
            <div class="form-body" id="LatLongInformation">
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Latitude</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="Latitude">
                  <show-errors [control]="AddressForm.controls.Latitude" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Longitude</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="Longitude">
                  <show-errors [control]="AddressForm.controls.Longitude" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="submit" class="btn btn-raised btn-primary">
                <i class="far"></i> Continue
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
