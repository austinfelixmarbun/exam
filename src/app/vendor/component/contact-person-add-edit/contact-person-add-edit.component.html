<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="px-3">
          <form class="form form-horizontal" [formGroup]="ContactPersonForm" #ContactPersonReqForm="ngForm"
            (ngSubmit)="ContactPersonForm.valid && SaveForm()">
            <lib-ucSubsection [id]="'ContactPersonFormId'" [title]="'Contact Person Main Info'"
              [panel]="'ContactPersonForm'">
            </lib-ucSubsection>
            <div class="form-body" id="ContactPersonForm">
              <div class="form-group row">
                <label class="col-md-3 adins-required-label" for="Name" translate>Name</label>
                <div class="col-md-9">
                  <input type="Name" id="Name" class="form-control adInsInput width-25-per"
                    formControlName="Name">
                  <show-errors [control]="ContactPersonForm.controls.Name" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row ">
                <label class="col-md-3 adins-required-label" for="JobPosition" translate>JobPosition</label>
                <div class="col-md-9">
                  <select class="form-control adInsInput" style="width: auto" formControlName="JobPosition"
                    [ngClass]="{ 'is-invalid': ContactPersonForm.submitted && ContactPersonForm.controls.JobPosition.invalid }">
                    <option *ngFor="let it of itemJobPosition" value="{{it.Key}}">
                      {{it.Value}}</option>
                  </select>
                  <show-errors [control]="ContactPersonForm.controls.JobPosition"
                    [submit]="ContactPersonForm.submitted">
                  </show-errors>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-md-3 adins-required-label" for="Phn1" translate>Phone 1</label>
                <div class="col-md-9">
                  <input type="text" id="Phn1" class="form-control adInsInput width-25-per" formControlName="Phn1">
                  <show-errors [control]="ContactPersonForm.controls.Phn1" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="Phn2" translate>Phone 2</label>
                <div class="col-md-9">
                  <input type="text" id="Phn2" class="form-control adInsInput width-25-per" formControlName="Phn2">
                  <show-errors [control]="ContactPersonForm.controls.Phn2" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adins-required-label" for="Email" translate>E-mail</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-25-per"
                    pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$" id="Email" formControlName="Email">
                  <show-errors [control]="ContactPersonForm.controls.Email" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adins-required-label" for="JoinDt" translate>Join Date</label>
                <div class="col-md-9">
                  <input type="date" id="JoinDt" class="form-control adInsInput width-25-per"
                    formControlName="JoinDt">
                  <show-errors [control]="ContactPersonForm.controls.JoinDt"
                    [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" for="IsOwner" translate>Owner</label>
                <div class="col-md-9">
                  <input type="checkbox" id="IsOwner" class=""
                    formControlName="IsOwner">
                  <show-errors [control]="ContactPersonForm.controls.IsOwner" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
            </div>
            <lib-ucSubsection [id]="'ContactPersonAddressInfoId'" [title]="'Contact Person Address Info'"
              [panel]="'ContactPersonAddressInfo'">
            </lib-ucSubsection>
            <div class="form-body" id="ContactPersonAddressInfo">
              <div class="form-group row">
                <label class="col-md-3 adInsLabel" for="Addr" translate>Address</label>
                <div class="col-md-9">
                  <textarea id="Addr" class="form-control adInsInput width-25-per" formControlName="Addr"></textarea>
                  <show-errors [control]="ContactPersonForm.controls.Addr" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3 adins-required-label" for="Zipcode" translate>Zip Code</label>
                <div class="col-md-3">
                  <lib-uclookupgeneric [lookupInput]="inputZipcodeLookupObj" [identifier]="'RefZipcodeId'"
                    [enjiForm]="ContactPersonReqForm" [parentForm]="ContactPersonForm"
                    (lookup)="getZipcodeData($event)">
                  </lib-uclookupgeneric>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" for="AreaCode2" translate>Kelurahan</label>
                <div class="col-md-9">
                  <input type="text" id="AreaCode2" class="form-control adInsInput width-25-per"
                    formControlName="AreaCode2">
                  <show-errors [control]="ContactPersonForm.controls.AreaCode2"
                    [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" translate>Kecamatan</label>
                <div class="col-md-9">
                  <input type="text" id="AreaCode1" class="form-control adInsInput width-25-per"
                    formControlName="AreaCode1">
                  <show-errors [control]="ContactPersonForm.controls.AreaCode1"
                    [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" translate>City</label>
                <div class="col-md-9">
                  <input type="text" id="City" class="form-control adInsInput width-25-per" formControlName="City">
                  <show-errors [control]="ContactPersonForm.controls.City" [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3" translate>Province</label>
                <div class="col-md-9">
                  <input type="text" id="ProvDistrictName" class="form-control adInsInput width-25-per"
                    formControlName="ProvDistrictName">
                  <show-errors [control]="ContactPersonForm.controls.ProvDistrictName"
                    [submit]="ContactPersonReqForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="ucSearch-Button-Right">
                <button type="button" class="btn btn-raised btn-warning mr-1" (click)="HiddenCheck()">
                  <i class=""></i> Back
                </button>
        
                <button type="submit" class="btn btn-raised btn-primary mr-1">
                  <i class="fa fa-check-square-o"></i> Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
