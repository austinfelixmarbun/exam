<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='Name'
          translate>Name
          Code</span>
      </th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='Position'
          translate>Position
          Name</span>
      </th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='Phone 1'
          translate>Phone 1
          Name</span>
      </th>
      <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='Owner'
        translate>Owner
        Name</span>
    </th>
    <th class="text-left"><span class="thead-header" (click)="searchSort($event)" name='Action'
      translate>Action
      Name</span>
  </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData">
      <td class="text-left">{{item.FullAssetCode}}</td>
      <td class="text-left">{{item.FullAssetName}}</td>
      <td class="text-left">{{item.AssetCategoryName}}</td>
      <td class="text-left">{{item.FullAssetName}}</td>
      <td class="text-left">{{item.AssetCategoryName}}</td>
    </tr>
  </tbody>
</table>
