<div class="card-header header-title">
        <h4 class="card-title">Add Contact Person</h4>
    </div>
<form class="form form-horizontal"  [formGroup]="childForm" 
(ngSubmit)="SaveForm() && childForm.valid" #enjiForm="ngForm">

  <div class="form-group row">
    <div class="col-md-6">
        <div class="row mb-2 mt-3">
          <label class="col-md-3 col-form-label adins-required-label">Name</label>
          <div class="col-md-8">
              <input type="text" id="WorkingHourSchmCode" class="form-control" formControlName="name"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && childForm['controls']['CPName'].invalid }">
              <lib-uc-show-errors [control]="childForm['controls']['CPName']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
          </div>
        </div>
        <div class="row mb-2 mt-3" style="display: flex;">
          <label class="col-md-3 col-form-label adins-required-label">Email</label>
          <div class="col-md-8">
              <input type="email" id="InputDaysPerYear" class="form-control"formControlName="email"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && childForm['controls']['CPEmail'].invalid }">
              <lib-uc-show-errors [control]="childForm['controls']['CPEmail']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
          </div>
        </div>
        <div class="row mb-2 mt-3" style="display: flex;">
          <label class="col-md-3 col-form-label adins-required-label">Phone</label>
          <div class="col-md-8">
            <input type="text" id="InputDaysPerYear" class="form-control" formControlName="phone1"
            [ngClass]="{ 'is-invalid': enjiForm.submitted && childForm['controls']['CPNumber'].invalid }">
            <lib-uc-show-errors [control]="childForm['controls']['CPNumber']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
        
          </div>
        </div>
        <div class="form-actions right">
          <button type="submit"
                  class="btn btn-raised btn-primary" translate>
            <i class="fa fa-check-square"></i> Save & Continue
          </button>
        </div>
    </div>
  </div>
</form>
