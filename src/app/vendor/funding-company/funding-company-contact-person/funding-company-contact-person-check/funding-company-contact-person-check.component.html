<form>
  <div class="form-actions right">
    <span class="mr-1">
      <button type="button" class="addButton" (click)="addCP()">
        <i class="ft-plus-circle"></i>&nbsp;<span translate>Add</span>
      </button>
    </span>
  </div>
</form>
<div class="addEdit" style="overflow-x: auto;">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th style="text-align: left;"><span class="thead-header" name='assetTypeName' translate>CONTACT PERSON NAME</span>
        </th>
        <th style="text-align: left;"><span class="thead-header" name='fullAddress' translate>CONTACT PERSON NUMBER</span>
        </th>
        <th style="text-align: left;"><span class="thead-header" name='buildingOwnership' translate>CONTACT PERSON EMAIL</span>
        </th>
        <th style="text-align: center;"><span class="thead-header" translate>EDIT</span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of CPFormValues">
        <td style="text-align: left;" hidden>{{item.VendorContactPersonId}}</td>
        <td style="text-align: left;">{{item.name}}</td>
        <td style="text-align: left;">{{item.phone1}}</td>
        <td style="text-align: left;">{{item.email}}</td>
        <td style="text-align: center;">
          <a [hidden]="CheckListToBeEdit(item.VendorContactPersonId)" (click)="editItem(item)" style="cursor: pointer">
            <i class="fa fa-edit"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
