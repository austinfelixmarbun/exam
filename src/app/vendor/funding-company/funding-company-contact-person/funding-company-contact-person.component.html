<div *ngIf="modeCP == 'check'" (outputValue)="getValue($event)">

        <div class="form-actions right">

          </span>
        </div>
      </form>
      <div class="addEdit" style="overflow-x: auto;">
        <table class="table table-responsive-md text-center table-hover">
          <thead>
            <tr class="table-header">
              <th style="text-align: left;"><span class="thead-header" name='assetTypeName' translate>CONTACT PERSON NAME</span>
              </th>
              <th style="text-align: left;"><span class="thead-header" name='fullAddress' translate>CONTACT PERSON NUMBER</span>
              </th>
              <th style="text-align: left;"><span class="thead-header" name='buildingOwnership' translate>CONTACT PERSON EMAIL</span>
              </th>
              <th style="text-align: center;"><span class="thead-header" translate>EDIT</span>
                <th style="text-align: center;"><span class="thead-header" translate>DELETE</span>
              </th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of listVendorCP">
              <td style="text-align: left;" hidden>{{item.VendorContactPersonId}}</td>
              <td style="text-align: left;">{{item.Name}}</td>
              <td style="text-align: left;">{{item.Phone1}}</td>
              <td style="text-align: left;">{{item.Email}}</td>
              <td style="text-align: center;">
                <a class="success p-0" data-original-title="" title="" (click)="editItem(item)">
                  <i class="ft-edit-2 font-medium-3 mr-2"></i>
                </a>
              </td>
              <td style="text-align: center;">
                <a class="danger p-0" data-original-title="" title="" (click)="deleteVendorCP(item)">

      <br>

</div>
<!-- <app-funding-company-contact-person-check *ngIf="mode == 'check'" (outputValue)="terimaValue($event)"> </app-funding-company-contact-person-check> -->
<div *ngIf="modeCP == 'add' || modeCP == 'edit'" (outputValue)="getValue($event)">
    <div *ngIf="modeCP == 'add'" class="card-header header-title">
        <h4 class="card-title">Add Contact Person</h4>
    </div>
    <div *ngIf="modeCP == 'edit'" class="card-header header-title">
        <h4 class="card-title">Edit Contact Person</h4>
    </div>
<form class="form form-horizontal"  [formGroup]="vendorContactPersonForm" 
(ngSubmit)="SaveForm() && vendorContactPersonForm.valid" #enjiForm="ngForm">

  <div class="form-group row">
    <div class="col-md-6">
        <div class="row mb-2 mt-3">
          <label class="col-md-3 col-form-label adins-required-label">Name</label>
          <div class="col-md-8">
              <input type="text" id="WorkingHourSchmCode" class="form-control" formControlName="Name"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && vendorContactPersonForm['controls']['Name'].invalid }">
              <lib-uc-show-errors [control]="vendorContactPersonForm['controls']['Name']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
          </div>
        </div>
        <div class="row mb-2 mt-3" style="display: flex;">
          <label class="col-md-3 col-form-label adins-required-label">Email</label>
          <div class="col-md-8">
              <input type="email" id="InputDaysPerYear" class="form-control" formControlName="Email"
              [ngClass]="{ 'is-invalid': enjiForm.submitted && vendorContactPersonForm['controls']['Email'].invalid }">
              <lib-uc-show-errors [control]="vendorContactPersonForm['controls']['Email']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
          </div>
        </div>
        <div class="row mb-2 mt-3" style="display: flex;">
          <label class="col-md-3 col-form-label adins-required-label">Phone</label>
          <div class="col-md-8">
            <input type="text" id="InputDaysPerYear" class="form-control" formControlName="Phone1"
            [ngClass]="{ 'is-invalid': enjiForm.submitted && vendorContactPersonForm['controls']['Phone1'].invalid }">
            <lib-uc-show-errors [control]="vendorContactPersonForm['controls']['Phone1']" [submit]="enjiForm.submitted"></lib-uc-show-errors>
        
          </div>
        </div>
        <div class="form-actions left">
            <span class="mr-1">
            <button type="submit"
                  class="btn btn-raised btn-primary mt-3 mr-2" translate>
            <i class="fa fa-check-square"></i> Save & Continue
          </button>
          <button (click)="back()"
          class="btn btn-raised btn-danger mt-3 mr-2" translate>
    <i class="ft ft-log-out"></i> Back
  </button>
          </span>
        </div>
    </div>
  </div>
</form>
</div>
</div>
