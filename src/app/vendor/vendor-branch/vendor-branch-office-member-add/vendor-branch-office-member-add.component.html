<div class="card">
  <div class="card-header">
    <h4 class="card-title" translate>Branch Office Member</h4>
  </div>
  <div class="card-body">
    <lib-ucaddtotemp *ngIf="tempPagingObj.isReady" [tempPagingObj]="tempPagingObj" (callback)="getListTemp($event)">
    </lib-ucaddtotemp>

    <div class="card-header">
      <div class="text-right">
        <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Vendor/Branch/Member/Paging']"
          [queryParams]="{VendorId:VendorId}" translate>
          <i class="fa fa-arrow-circle-left"></i> Back
        </button>
        <button type="submit" (click)="SaveVendorOfficeMember()" class="btn btn-raised btn-primary" translate>
          <i class="far fa-check-square"></i> Submit
        </button>
      </div>
    </div>
  </div>
</div>
