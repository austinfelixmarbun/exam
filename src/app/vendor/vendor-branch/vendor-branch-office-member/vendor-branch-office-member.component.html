<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="card-header header-title">
          <div class="row">
            <div class="col-md-8">
              <h4 class="card-title" id="horz-layout-colored-controls" translate> BRANCH REGISTRATION </h4>
            </div>
          </div>
        </div>
        <br>
        <app-main-info-view></app-main-info-view>
        <form>
          <div class="form-actions right">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Vendor/Branch/Paging']"
              translate>
              Back
            </button>
            <button type="button" class="btn btn-raised btn-primary mr-1" [routerLink]="['/Vendor/Branch/Member/Add']"
            [queryParams]="{VendorId: VendorId}">
              <i class="ft-plus-circle"></i> Add
            </button>
          </div>
        </form>
        <lib-ucpaging [searchObj]="inputPagingObj"></lib-ucpaging>
      </div>
    </div>
  </div>
</div>
