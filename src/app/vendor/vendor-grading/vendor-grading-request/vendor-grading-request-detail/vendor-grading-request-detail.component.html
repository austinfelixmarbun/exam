<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="card-header header-title">
          <div class="row">
            <div class="col-md-8">
              <h4
                class="card-title"
                id="horz-layout-colored-controls"
                translate
              >
                {{ title }}
              </h4>
            </div>
          </div>
        </div>

        <div class="px-3">
          <form
            class="form form-horizontal"
            [formGroup]="VendorForm"
            (ngSubmit)="VendorForm.valid && SaveForm()"
            #enjiForm="ngForm"
          >
            <lib-ucSubsection
              [id]="'VendorInfoId'"
              [title]="'Main Info'"
              [panel]="'VendorInformation'"
            >
            </lib-ucSubsection>
            <div class="form-body" id="VendorInformation">
              <div [hidden]="mode === 'add'" class="form-group row">
                <label class="col-md-3 adInsLabel"
                  >Supplier Branch Code</label
                >
                <div class="col-md-9">
                  <label class="adInsLabel" translate>{{vendorCode}}</label>
                </div>
              </div>
              
              <div class="form-group row">
                <label class="col-md-3 adInsLabel"
                  >Supplier Branch Name</label
                >
                <div [hidden]="mode === 'edit'" class="col-md-3" *ngIf="inputLookupParentObj.isReady">
                  <lib-uclookupgeneric
                    [lookupInput]="inputLookupParentObj"
                    [parentForm]="VendorForm"
                    [enjiForm]="enjiForm"
                    [identifier]="'lookupVendor'"
                    (lookup)="getLookupParent($event)"
                  >
                  </lib-uclookupgeneric>
                </div>
                <div [hidden]="mode === 'add'" class="col-md-9">
                  <label class="adInsLabel" translate>{{vendorName}}</label>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-md-3 adInsLabel" translate>Rating</label>
                <div class="col-md-9">
                  <input
                    type="number"
                    class="form-control adInsInput width-50-per"
                    formControlName="VendorRating"
                    (input)="onVendorRatingChange($event.target.value)"
                  />
                  <!-- <lib-uc-show-errors
                    [control]="VendorForm.controls.VendorRating"
                    [submit]="enjiForm.submitted"
                  > -->
                  <!-- </lib-uc-show-errors> -->
                </div>
                <!-- <div [hidden]="mode === 'add'" class="col-md-9">
                  <label class="adInsLabel" translate>{{VendorRating}}</label>
                </div> -->
              </div>

              <div class="form-group row">
                <label class="col-md-3 adInsLabel" translate>Grade</label>
                <!-- <div class="col-md-9" [hidden]="mode === 'edit'" >
                  <input
                    type="text"
                    readonly
                    class="form-control adInsInput width-50-per"
                    formControlName="VendorGrade"
                  />
                  <lib-uc-show-errors
                    [control]="VendorForm.controls.VendorGrade"
                    [submit]="enjiForm.submitted"
                  >
                  </lib-uc-show-errors>
                </div> -->
                <div [hidden]="mode === 'add'" class="col-md-9">
                  <label class="adInsLabel" translate>{{gradeCode}}</label>
                </div>
              </div>
            </div>

            <lib-ucSubsection
              [id]="'ApvReqId'"
              [title]="'Approval Request'"
              [panel]="'ApvReq'"
              
            >
            </lib-ucSubsection>
            <div class="form-body" id="ApvReq">
              <div class="form-group row">
                <!-- <label class="col-md-2 adInsLabel">Approval Amount</label>
                <label class="col-md-2 adInsLabel">{{
                  PlafondAmt | number
                }}</label>
                <label class="col-md-2"></label> -->
                <label class="col-md-2 adInsLabel adins-required-label"
                  >To Be Approved By</label
                >
                <div class="col-md-2">
                  <select
                    type="text"
                    class="form-control adInsInput"
                    formControlName="ListApprover"
                    [ngClass]="{
                      'is-invalid':
                        enjiForm.submitted &&
                        VendorForm.controls.ListApprover.invalid
                    }"
                  >
                    <option
                      *ngFor="let item of listApprover"
                      [value]="item.Key"
                    >
                      {{ item.Value }}
                    </option>
                  </select>
                  <lib-uc-show-errors
                    [control]="VendorForm.controls.ListApprover"
                    [submit]="enjiForm.submitted"
                  >
                  </lib-uc-show-errors>
                </div>
              </div>

              <div class="form-group row">
                <!-- <label class="col-md-2 adInsLabel">Scoring</label>
                <label class="col-md-2 adInsLabel">{{ ScoreResult }}</label>
                {{MrScoreTypeCode}}
                <label class="col-md-2"></label> -->
                <label class="col-md-2 adInsLabel adins-required-label"
                  >Reason Description</label
                >
                <div class="col-md-2">
                  <select
                    type="text"
                    class="form-control adInsInput"
                    formControlName="Reason"
                    [ngClass]="{
                      'is-invalid':
                        enjiForm.submitted &&
                        VendorForm.controls.Reason.invalid
                    }"
                    [(ngModel)]="selected"
                  >
                    <option
                      *ngFor="let item of listReason"
                      [value]="item.Value"
                      (change)="selectOption($event.target.value)"
                    >
                      {{ item.Value }}
                    </option>
                  </select>
                  <lib-uc-show-errors
                    [control]="VendorForm.controls.Reason"
                    [submit]="enjiForm.submitted"
                  >
                  </lib-uc-show-errors>
                </div>
              </div>

              <div class="form-group row">
                <label
                  class="col-md-2 adInsLabel adins-required-label"
                  for="notes"
                  translate
                  >Notes</label
                >
                <div class="col-md-4">
                  <textarea
                    rows="5"
                    id="notes"
                    class="form-control"
                    formControlName="Notes"
                    [ngClass]="{
                      'is-invalid':
                        enjiForm.submitted &&
                        VendorForm.controls.Notes.invalid
                    }"
                  ></textarea>
                  <lib-uc-show-errors
                    [control]="VendorForm.controls.Notes"
                    [submit]="enjiForm.submitted"
                  >
                  </lib-uc-show-errors>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button
                type="button"
                class="btn btn-raised btn-warning mr-1"
                [routerLink]="['/Vendor/VendorGrading/Request/Paging']"
                translate
              >
                <i class="ft-x"></i> Cancel
              </button>
              <button
                
                type="submit"
                class="btn btn-raised btn-primary"
                translate
              >
                <i class="fa fa-check"></i> Submit
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
