<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="card-header header-title">
          <div class="row">
            <div class="col-md-8">
              <h4 class="card-title" id="horz-layout-colored-controls" translate> HO Registration </h4>
            </div>
          </div>
        </div>
        <div class="px-3">
          <form class="form form-horizontal" [formGroup]="VendorForm" (ngSubmit)="VendorForm.valid && SaveForm()"
            #enjiForm="ngForm">
            <lib-ucSubsection [id]="'VendorInfoId'" [title]="'Main Info'" [panel]="'VendorInformation'">
            </lib-ucSubsection>
            <div class="form-body" id="VendorInformation">
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Vendor Category</label>
                <div class="col-md-9">
                  <select class="form-control adInsInput" style="width: auto" formControlName="MrVendorCategoryCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrVendorCategoryCode.invalid }">
                    <option *ngFor="let it of itemCategoryType" value="{{it.Key}}">
                      {{it.Value}}</option>
                  </select>
                  <show-errors [control]="VendorForm.controls.MrVendorCategoryCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>HO Code</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="VendorCode">
                  <show-errors [control]="VendorForm.controls.VendorCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>HO Name</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="VendorName">
                  <show-errors [control]="VendorForm.controls.VendorName" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-body">
                <div class="form-group row">
                  <label class="col-md-3  adins-required-label" translate>HO Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrVendorTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrVendorTypeCode.invalid }"
                      (change)="checkType()">
                      <option *ngFor="let it of itemType" value="{{it.Key}}">
                        {{it.Value}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.MrVendorTypeCode" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="VendorForm.controls.MrVendorTypeCode.value != 'C'">
                <div class="form-group row">
                  <label class="col-md-3  adins-required-label" translate>Registration Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per" formControlName="RegistrationNo">
                    <show-errors [control]="VendorForm.controls.RegistrationNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adins-required-label" translate>License Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per" formControlName="LicenseNo">
                    <show-errors [control]="VendorForm.controls.LicenseNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="VendorForm.controls.MrVendorTypeCode.value != 'P'">
                <div class="form-group row">
                  <label class="col-md-3  adins-required-label" translate>ID Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrIdTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrIdTypeCode.invalid }">
                      <option *ngFor="let it of itemIdType" value="{{it.Key}}">
                        {{it.Value}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.MrIdTypeCode" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adins-required-label" translate>ID Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-50-per" formControlName="IdNo">
                    <show-errors [control]="VendorForm.controls.IdNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Mobile Phone 1</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="MobilePhnNo1">
                  <show-errors [control]="VendorForm.controls.MobilePhnNo1" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Mobile Phone 2</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="MobilePhnNo2">
                  <show-errors [control]="VendorForm.controls.MobilePhnNo2" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Email</label>
                <div class="col-md-9">
                  <input type="text" pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$"
                    class="form-control adInsInput width-50-per" formControlName="Email">
                  <show-errors [control]="VendorForm.controls.Email" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Rating</label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput width-50-per" formControlName="VendorRating">
                  <show-errors [control]="VendorForm.controls.VendorRating" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Establishment Date</label>
                <div class="col-md-9">
                  <input type="date" class="form-control adInsInput width-50-per" formControlName="EstablishmentDt">
                  <show-errors [control]="VendorForm.controls.EstablishmentDt" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Partnership Date</label>
                <div class="col-md-9">
                  <input type="date" class="form-control adInsInput width-50-per" formControlName="PartnershipDt">
                  <show-errors [control]="VendorForm.controls.PartnershipDt" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3">Active Status</label>
                <div class="col-md-9">
                  <select class="form-control" formControlName="IsActive">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
            </div>
            <div *ngIf="MrVendorCategoryCode=='SUPPLIER_HO'">
              <div id="HOInformation">
                <lib-ucSubsection [id]="'HOIdOne'" [title]="'HO Info'" [panel]="'HOInformation'">
                </lib-ucSubsection>
                <div class="form-body">
                  <div class="form-group row">
                    <label class="col-md-3 adins-required-label">Supplier Holding</label>
                    <div class="col-md-3" *ngIf="inputLookupParentObj.isReady">
                      <lib-uclookupgeneric [lookupInput]="inputLookupParentObj" [parentForm]="VendorForm"
                        [enjiForm]="enjiForm" [identifier]="'lookupParent'" (lookup)="getLookupParent($event)">
                      </lib-uclookupgeneric>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <lib-ucSubsection [id]="'TaxInfo'" [title]="'Tax Info'" [panel]="'TaxInformation'">
            </lib-ucSubsection>
            <div id="TaxInformation">
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Tax Calculation Method</label>
                <div class="col-md-9">
                  <select class="form-control adInsInput" style="width: auto" formControlName="MrTaxCalcMethodCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrTaxCalcMethodCode.invalid }">
                    <option *ngFor="let it of itemCalcMethodType" value="{{it.Key}}">
                      {{it.Value}}</option>
                  </select>
                  <show-errors [control]="VendorForm.controls.MrTaxCalcMethodCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label">VAT</label>
                <div class="col-md-9">
                  <select class="form-control" formControlName="IsVat">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Tax Payer Number</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="TaxIdNo">
                  <show-errors [control]="VendorForm.controls.TaxIdNo" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adins-required-label" translate>Tax Payer Name</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="TaxpayerName">
                  <show-errors [control]="VendorForm.controls.TaxpayerName" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Tax Address</label>
                <div class="col-md-9">
                  <textarea class="form-control adInsInput width-50-per" formControlName="Addr"> </textarea>
                  <show-errors [control]="VendorForm.controls.Addr" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
                <div class="form-group row" *ngIf="inputLookupZipcodeObj.isReady">
                  <label class="col-md-3 adins-required-label">Zip Code</label>
                  <div class="col-md-3">
                    <lib-uclookupgeneric [lookupInput]="inputLookupZipcodeObj" [parentForm]="VendorForm"
                      [enjiForm]="enjiForm" [identifier]="'lookupZipcode'" (lookup)="getLookupZipcode($event)">
                    </lib-uclookupgeneric>
                  </div>
                </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kelurahan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="AreaCode2">
                  <show-errors [control]="VendorForm.controls.AreaCode2" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kecamatan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="AreaCode1">
                  <show-errors [control]="VendorForm.controls.AreaCode1" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>City</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="City">
                  <show-errors [control]="VendorForm.controls.City" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Province</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-50-per" formControlName="Province">
                  <show-errors [control]="VendorForm.controls.Province" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" (click)="Back()" translate>
                <i class="fa fa-arrow-circle-left"></i> Back
              </button>
              <button type="submit" class="btn btn-raised btn-primary">
                <i class="far"></i> {{this.ButtonLbl}}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
