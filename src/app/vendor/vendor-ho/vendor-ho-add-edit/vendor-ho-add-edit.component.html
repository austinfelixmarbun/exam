<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="card-header header-title">
          <div class="row">
            <div class="col-md-8">
              <h4 class="card-title" id="horz-layout-colored-controls" translate> VENDOR SCHEME </h4>
            </div>
          </div>
        </div>
        <div class="px-3">
          <form class="form form-horizontal" [formGroup]="VendorForm" (ngSubmit)="VendorForm.valid && SaveForm()"
            #enjiForm="ngForm">
            <lib-ucSubsection [id]="'VendorId'" [title]="'Main Info'" [panel]="'VendorInformation'">
            </lib-ucSubsection>
            <div class="form-body" id="VendorInformation">
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Vendor Category</label>
                <div class="col-md-9">
                  <select class="form-control adInsInput" style="width: auto" formControlName="MrVendorCategoryCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrVendorCategoryCode.invalid }">
                    <option *ngFor="let it of itemCategoryType" value="{{it.MasterCode}}">
                      {{it.Descr}}</option>
                  </select>
                  <show-errors [control]="VendorForm.controls.MrVendorCategoryCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>HO Code</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="VendorCode">
                  <show-errors [control]="VendorForm.controls.VendorCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>HO Name</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="VendorName">
                  <show-errors [control]="VendorForm.controls.VendorName" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-body">
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>HO Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrVendorTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrVendorTypeCode.invalid }">
                      <option *ngFor="let it of itemType" value="{{it.MasterCode}}" (click)="CheckHOType()">
                        {{it.Descr}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.MrVendorTypeCode" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="VendorForm.controls.MrVendorTypeCode.value != 'C'">
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>Registration Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-75-per" formControlName="RegistrationNo">
                    <show-errors [control]="VendorForm.controls.RegistrationNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>License Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-75-per" formControlName="LicenseNo">
                    <show-errors [control]="VendorForm.controls.LicenseNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="VendorForm.controls.MrVendorTypeCode.value != 'P'">
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>ID Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="MrIdTypeCode"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrIdTypeCode.invalid }">
                      <option *ngFor="let it of itemIdType" value="{{it.MasterCode}}">
                        {{it.Descr}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.MrIdTypeCode" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>ID Number</label>
                  <div class="col-md-9">
                    <input type="text" class="form-control adInsInput width-75-per" formControlName="IdNo">
                    <show-errors [control]="VendorForm.controls.IdNo" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Mobile Phone 1</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="MobilePhnNo1">
                  <show-errors [control]="VendorForm.controls.MobilePhnNo1" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Mobile Phone 2</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="MobilePhnNo2">
                  <show-errors [control]="VendorForm.controls.MobilePhnNo2" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Email</label>
                <div class="col-md-9">
                  <input type="text" pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$"
                    class="form-control adInsInput width-75-per" formControlName="Email">
                  <show-errors [control]="VendorForm.controls.Email" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Rating</label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput width-75-per" formControlName="VendorRating">
                  <show-errors [control]="VendorForm.controls.VendorRating" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Establishment Date</label>
                <div class="col-md-9">
                  <input type="date" class="form-control adInsInput width-75-per" formControlName="EstablishmentDt">
                  <show-errors [control]="VendorForm.controls.EstablishmentDt" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Partnership Date</label>
                <div class="col-md-9">
                  <input type="date" class="form-control adInsInput width-75-per" formControlName="PartnershipDt">
                  <show-errors [control]="VendorForm.controls.PartnershipDt" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel">Active Status</label>
                <div class="col-md-9">
                  <select class="form-control" formControlName="IsActive">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
            </div>
            <lib-ucSubsection [id]="'HOIdOne'" [title]="'HO Info'" [panel]="'HOInformation'">
            </lib-ucSubsection>
            <div id="HOInformation">
              <div [hidden]="MrVendorCategoryCode!='SUPPLIER_HO'">
                <div class="form-body">
                  <div class="form-group row adins-required">
                    <label class="col-md-3 adInsLabel">Supplier Holding</label>
                    <div class="col-md-9">
                      <lib-uclookupgeneric [lookupInput]="inputLookupParentObj" [parentForm]="VendorForm"
                        [enjiForm]="enjiForm" [identifier]="'lookupParent'">
                      </lib-uclookupgeneric>
                    </div>
                  </div>
                </div>
              </div>
              <div [hidden]="MrVendorCategoryCode!='SURVEYOR_HO'">
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>Assignment Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="ReservedField1"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.ReservedField1.invalid }">
                      <option *ngFor="let it of itemAssignmentType" value="{{it.MasterCode}}">
                        {{it.Descr}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.ReservedField1" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel" translate>Maximum Task Load</label>
                  <div class="col-md-9">
                    <input type="number" class="form-control adInsInput width-75-per" formControlName="ReservedField2">
                    <show-errors [control]="VendorForm.controls.ReservedField2" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="MrVendorCategoryCode!='ASSET_INSCO_HO'">
                <div class="form-group row adins-required">
                  <label class="col-md-3  adInsLabel" translate>Assignment Type</label>
                  <div class="col-md-9">
                    <select class="form-control adInsInput" style="width: auto" formControlName="ReservedField1"
                      [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.ReservedField1.invalid }">
                      <option *ngFor="let it of itemAssignmentType" value="{{it.MasterCode}}">
                        {{it.Descr}}</option>
                    </select>
                    <show-errors [control]="VendorForm.controls.ReservedField1" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-md-3  adInsLabel" translate>Maximum Task Load</label>
                  <div class="col-md-9">
                    <input type="number" class="form-control adInsInput width-75-per" formControlName="ReservedField2">
                    <show-errors [control]="VendorForm.controls.ReservedField2" [submit]="enjiForm.submitted">
                    </show-errors>
                  </div>
                </div>
              </div>
              <div [hidden]="MrVendorCategoryCode!='LIFE_INSCO_HO'">
                <p>ini buat Life Insurance HO</p>
              </div>
            </div>
            <lib-ucSubsection [id]="'HOIdOne'" [title]="'Tax Info'" [panel]="'TaxInformation'">
            </lib-ucSubsection>
            <div id="TaxInformation">
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Tax Calculation Method</label>
                <div class="col-md-9">
                  <select class="form-control adInsInput" style="width: auto" formControlName="MrTaxCalcMethodCode"
                    [ngClass]="{ 'is-invalid': enjiForm.submitted && VendorForm.controls.MrTaxCalcMethodCode.invalid }">
                    <option *ngFor="let it of itemCalcMethodType" value="{{it.MasterCode}}">
                      {{it.Descr}}</option>
                  </select>
                  <show-errors [control]="VendorForm.controls.MrTaxCalcMethodCode" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel">VAT</label>
                <div class="col-md-9">
                  <select class="form-control" formControlName="IsActive">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Tax Payer Number</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="TaxpayerNo">
                  <show-errors [control]="VendorForm.controls.TaxpayerNo" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row adins-required">
                <label class="col-md-3  adInsLabel" translate>Tax Payer Name</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="TaxpayerName">
                  <show-errors [control]="VendorForm.controls.TaxpayerName" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Tax Address</label>
                <div class="col-md-9">
                  <textarea class="form-control adInsInput width-75-per" formControlName="Addr"> </textarea>
                  <show-errors [control]="VendorForm.controls.Addr" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-body adins-required">
                <div class="form-group row adins-required">
                  <label class="col-md-3 adInsLabel">Zip Code</label>
                  <div class="col-md-9">
                    <lib-uclookupgeneric [lookupInput]="inputLookupZipcodeObj" [parentForm]="VendorForm"
                      [enjiForm]="enjiForm" [identifier]="'lookupZipcode'" (lookup)="getLookup($event)">
                    </lib-uclookupgeneric>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kelurahan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="AreaCode2">
                  <show-errors [control]="VendorForm.controls.AreaCode2" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kecamatan</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="AreaCode1">
                  <show-errors [control]="VendorForm.controls.AreaCode1" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>City</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="City">
                  <show-errors [control]="VendorForm.controls.City" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Province</label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput width-75-per" formControlName="Province">
                  <show-errors [control]="VendorForm.controls.Province" [submit]="enjiForm.submitted">
                  </show-errors>
                </div>
              </div>
            </div>

            <div class="form-actions center">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Vendor/HO/Paging']"
                translate>
                <i class="fa fa-arrow-circle-left"></i> Back
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="far"></i> Continue
              </button>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
