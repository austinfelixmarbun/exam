<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <lib-ucviewgeneric [viewInput]="viewObj"> </lib-ucviewgeneric>
        <div class="ucSearch-Button-Right">
          <span class="mr-1">
            <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Vendor/Holding/Paging']"
              translate>
              Back
            </button>
            <button type="button" class="btn btn-raised btn-primary mr-1" [routerLink]="['/Vendor/Holding/Detail']"
              [queryParams]="{VendorId: this.VendorId, mode:'edit'}">
              <i class="ft-plus-circle"></i> Edit Main Info
            </button>
          </span>
        </div>
        <aw-wizard #wizard navBarLayout="large-empty-symbols" [awNavigationMode] navigateBackward="allow"
          navigateForward="allow">
          <aw-wizard-step [stepTitle]="'Address'"
            [navigationSymbol]="{ symbol: '&#xf007;', fontFamily: 'FontAwesome' }">
            <app-address [objInput]="objPassing"> </app-address>
          </aw-wizard-step>
          <aw-wizard-step [stepTitle]="'Contact Person'"
            [navigationSymbol]="{ symbol: '&#xf007;', fontFamily: 'FontAwesome' }">
            <div *ngIf="HiddenState==true">
              <app-contact-person-list (objOutput)="outputValue($event)" [objInput] = "objPassing" [show]="show"> </app-contact-person-list>
            </div>
            <div *ngIf="HiddenState==false">
              <app-contact-person-add-edit (objOutput)="outputValue($event)" [objInput] = "objPassingCP"> </app-contact-person-add-edit>
            </div>
          </aw-wizard-step>
        </aw-wizard>
      </div>
    </div>
  </div>
</div>
