<div class="col-md-12">
  <div class="card">
    <div class="card-header row">
      <h4 class="card-title col-md-6">Vendor Scheme Member</h4>
    </div>
    <lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)">
    </lib-UCSearch>
    <div [hidden]="resultData?.Data == null">
      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr class="table-header">
            <th><input type="checkbox" [checked]="checkboxAll" (change)="SelectAll($event.target.checked)" id="checkAll"
                name="CheckAll"></th>
            <th><span translate class="thead-header" (click)="searchSort($event)"
                name='BranchCode'>Branch Code</span></th>
            <th><span translate class="thead-header" (click)="searchSort($event)"
                name='BranchName'>Branch Name</span></th>
            <th><span translate class="thead-header" (click)="searchSort($event)"
                name='IsActive'>Active Status</span></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of resultData?.Data">
            <td>
              <div *ngIf="listSelectedId.indexOf(item.VendorId) >- 1">
                <input type="checkbox" id="checkSame" name="itemSame"
                  (change)="Checked(item.VendorSchmId,  $event.target.checked)" [checked]="true">
              </div>
              <div *ngIf="listSelectedId.indexOf(item.VendorId) < 0">
                <input type="checkbox" id="checkDiff" name="itemDiff"
                  (change)="Checked(item.VendorId,  $event.target.checked)" [checked]=false>
              </div>
            </td>
            <td>{{item.VendorCode}}</td>
            <td>{{item.VendorName}}</td>
            <td *ngIf="item.IsActive === true">Yes</td>
            <td *ngIf="item.IsActive === false">No</td>
          </tr>
        </tbody>
      </table>
      <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>

      <div class="card-header">
        <div class="text-right">
          <button type="button" (click)="addToTemp()" class="btn btn-raised btn-warning mr-1">
            <i class="fa ft-plus"></i> Add To Temp
          </button>
        </div>
      </div>

      <table class="table table-responsive-md text-center table-hover">
        <thead>
          <tr class="table-header">
            <th><span translate class="thead-header" (click)="searchSort($event)" name='BranchCode'>Branch Code</span>
            </th>
            <th><span translate class="thead-header" (click)="searchSort($event)" name='BranchName'>Branch Name</span>
            </th>
            <th><span translate class="thead-header" (click)="searchSort($event)" name='IsActive'>Active Status</span></th>
            <th translate>Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of tempData">
            <td>{{item.VendorCode}}</td>
            <td>{{item.VendorName}}</td>
            <td *ngIf="item.IsActive === true">Yes</td>
            <td *ngIf="item.IsActive === false">No</td>
            <td>
              <div>
                <a class="danger p-0" data-original-title="" title="" (click)="deleteFromTemp(item.VendorId)">
                  <i class="ft-trash-2 font-medium-3 mr-2"></i>
                </a></div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="card-header">
        <div class="text-right">
          <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/Vendor/VendorScheme/Member']"
            [queryParams]="{VendorSchmId:VendorSchmId,MrVendorCategoryCode:MrVendorCategoryCode}" translate>
            <i class="fa fa-arrow-circle-left"></i> Back
          </button>
          <button type="submit" (click)="SaveVendorSchemeMember()" class="btn btn-raised btn-primary" translate>
            <i class="far"></i> Submit
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
