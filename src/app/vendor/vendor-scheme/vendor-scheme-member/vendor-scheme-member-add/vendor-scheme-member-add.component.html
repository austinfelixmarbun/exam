<div class="card">
  <div class="card-header">
    <h4 class="card-title" translate> Vendor Scheme Member </h4>
  </div>
  <div class="card-body">
    <lib-ucaddtotemp *ngIf="tempPagingObj.isReady" [tempPagingObj]="tempPagingObj" (callback)="getListTemp($event)">
    </lib-ucaddtotemp>

    <div class="card-header">
      <div class="text-right">
        <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="[CancelLink]" skipLocationChange
          [queryParams]="{VendorSchmId:VendorSchmId,MrVendorCategoryCode:MrVendorCategoryCode}" translate>
          <i class="far fa-window-close"></i> Cancel
        </button>
        <button type="submit" (click)="SaveVendorSchemeMember()" class="btn btn-raised btn-primary" translate>
          <i class="far fa-check-square"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>
