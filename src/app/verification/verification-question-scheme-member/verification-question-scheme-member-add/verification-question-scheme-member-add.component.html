<div class="row text-left">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <div class="px-3">
          <form class="form form-horizontal" [formGroup]="QuestionSchemeForm" (ngSubmit)="QuestionSchemeForm.valid"
            #enjiForm="ngForm">
            <lib-ucSubsection [id]="'QuestionSchemeId'" [title]="'Main Info'" [panel]="'QuestionScheme'">
            </lib-ucSubsection>
            <div class="form-body" id="QuestionScheme">
              <div class="form-group">
                <label class="col-md-3 adInsLabel" translate>Question Scheme Code: </label>
                <label class="col-md-3 adInsLabel" translate>{{VerfSchemeCode}} </label>
                <label class="col-md-3 adInsLabel" translate>Question Scheme Name: </label>
                <label class="col-md-3 adInsLabel" translate>{{VerfSchemeName}} </label>
              </div>
            </div>
          </form>
        </div>
        <lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)">
        </lib-UCSearch>
        <div [hidden]="resultData?.Data == null">
          <table class="table table-responsive-md text-center table-hover">
            <thead>
              <tr class="table-header">
                <th><input type="checkbox" [checked]="checkboxAll" (change)="SelectAll($event.target.checked)"
                    id="checkAll" name="CheckAll"></th>
                <th><span translate class="thead-header" (click)="searchSort($event)"
                    name='VerfQuestionGrpCode'>Question Group Code</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)"
                    name='VerfQuestionGrpName'>Question Group Name</span></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of resultData?.Data">
                <td>
                  <div *ngIf="listSelectedId.indexOf(item.VerfQuestionGrpHId) >- 1">
                    <input type="checkbox" id="checkSame" name="itemSame"
                      (change)="Checked(item.VerfQuestionGrpHId,  $event.target.checked)" [checked]="true">
                  </div>
                  <div *ngIf="listSelectedId.indexOf(item.VerfQuestionGrpHId) < 0">
                    <input type="checkbox" id="checkDiff" name="itemDiff"
                      (change)="Checked(item.VerfQuestionGrpHId,  $event.target.checked)" [checked]=false>
                  </div>
                </td>
                <td>{{item.VerfQuestionGrpCode}}</td>
                <td>{{item.VerfQuestionGrpName}}</td>
              </tr>
            </tbody>
          </table>
          <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>

          <div class="card-header">
            <div class="text-right">
              <button type="button" (click)="addToTemp()" class="btn btn-raised btn-warning mr-1">
                <i class="fa ft-plus"></i> Add To Temp
              </button>
            </div>
          </div>

          <table class="table table-responsive-md text-center table-hover">
            <thead>
              <tr class="table-header">
                <th><span translate class="thead-header" (click)="searchSort($event)"
                    name='VerfQuestionGrpCode'>Question Group Code</span></th>
                <th><span translate class="thead-header" (click)="searchSort($event)"
                    name='VerfQuestionGrpName'>Question Group Name</span></th>
                <th translate>Delete</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of tempData">
                <td>{{item.VerfQuestionGrpCode}}</td>
                <td>{{item.VerfQuestionGrpName}}</td>
                <td>
                  <div>
                    <a class="danger p-0" data-original-title="" title=""
                      (click)="deleteFromTemp(item.VerfQuestionGrpHId)">
                      <i class="ft-trash-2 font-medium-3 mr-2"></i>
                    </a></div>
                </td>
              </tr>
            </tbody>
          </table>
          <div class="card-header">
            <div class="text-right">
              <button type="button" class="btn btn-raised btn-warning mr-1"
                [routerLink]="['/Verification/QuestionSchemeMemberPaging']"
                [queryParams]="{VerfSchemeHId:VerfSchemeHId}" translate>
                <i class="fa fa-arrow-left"></i> Back
              </button>
              <button type="submit" (click)="SaveQuestionSchemeMember()" class="btn btn-raised btn-primary" translate>
                <i class="fa fa-check"></i> Submit
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
