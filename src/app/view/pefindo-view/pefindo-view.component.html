<div class="col-md-12 mt-3">
	<div class="card">
		<div class="card-body">
			<div class="px-3">
				<div class="form-body">
					<h4 class="form-section card-title"  translate>PEFINDO</h4>
					<div>
						<mat-tab-group (selectedIndexChange)="redirectTab($event)">
							<mat-tab [label]="MrCustTypeCode == 'PERSONAL' ? 'Subject Info Personal' : 'Subject Info Company' ">
							</mat-tab>
							<mat-tab label="MO Summary">
							</mat-tab>
							<mat-tab label="PEFINDO Score">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Contracts">
							</mat-tab>
							<!--mat-tab *ngIf="IsLos" label="PEFINDO Alert Quest">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Securities">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Other Liabilities">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Involvements">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Relations">
							</mat-tab-->
							<mat-tab *ngIf="IsLos" label="Inquiries">
							</mat-tab>
							<!--mat-tab *ngIf="IsLos" label="Disputes">
							</mat-tab-->
							<mat-tab *ngIf="MrCustTypeCode == 'COMPANY' && IsLos" label="Financial Statements">
							</mat-tab>
							<mat-tab *ngIf="IsLos" label="Others">
							</mat-tab>
						</mat-tab-group>
					</div>
					<router-outlet></router-outlet>
				</div>
			</div>
		</div>
	</div>
</div>
