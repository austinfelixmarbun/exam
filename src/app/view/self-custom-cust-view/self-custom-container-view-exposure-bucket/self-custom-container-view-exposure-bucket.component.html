<lib-ucSubsection [id]="'BucketInfo' + exposureType + 'Id'" [title]="'Bucket'" [panel]="'BucketInfo' + exposureType">
</lib-ucSubsection>
<div [id]="'BucketInfo' + exposureType" style="overflow-x: auto;">
  <table class="table table-responsive-md text-center table-hover">
    <tr class="table-header">
      <th style="text-align: left;">
        <span name='Bucket'>
          <label class="label-control" translate>Bucket</label>
        </span>
      </th>
      <td style="text-align: right;" *ngFor="let item of ListCustExpsrBucketObj; let i = index;">
        <span class="thead-header" translate>
          <label class="label-control"> {{item.BucketRange}} </label>
        </span>
      </td>
    </tr>
    <tr>
      <th style="text-align: left;" translate>Total Past Due</th>
      <td style="text-align: right;" *ngFor="let item of ListCustExpsrBucketObj; let i = index;"> {{item.Value | number:'.2':'en-US'}} </td>
    </tr>
  </table>
</div>

<div *ngIf="exposureType == 'CUST_OBLGR_EXPSR'">
  <lib-ucSubsection [id]="'SummaryInfo' + exposureType + 'Id'" [title]="'Summary'" [panel]="'SummaryInfo' + exposureType">
  </lib-ucSubsection>
  <div [id]="'SummaryInfo' + exposureType">
    <div class="row">
      <div class="col-md-6 ">
        <div class="row">
          <div class="col-md-6">
            <label class="label-control"> Customer Exposure Amount </label>
          </div>
          <div class="col-md-6" style="text-align: right;">
            <label class="label-control"> {{SummaryData.CustomerExposureAmt | number:'.2':'en-US'}} </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label class="label-control"> Family Exposure Amount </label>
          </div>
          <div class="col-md-6" style="text-align: right;">
            <label class="label-control"> {{SummaryData.FamilyExposureAmt | number:'.2':'en-US'}} </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label class="label-control"> Guarantor Exposure Amount </label>
          </div>
          <div class="col-md-6" style="text-align: right;">
            <label class="label-control"> {{SummaryData.GuarantorExposureAmt | number:'.2':'en-US'}} </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label class="label-control"> Shareholder Exposure Amount </label>
          </div>
          <div class="col-md-6" style="text-align: right;">
            <label class="label-control"> {{SummaryData.ShareholderExposureAmt | number:'.2':'en-US'}} </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label class="label-control"> Obligor Exposure Amount </label>
          </div>
          <div class="col-md-6" style="text-align: right;">
            <label class="label-control"> {{SummaryData.ObligorExposureAmt | number:'.2':'en-US'}} </label>
          </div>
        </div>
      </div>
  
      <div class="col-md-6 ">
      </div>
    </div>
  </div>
</div>
