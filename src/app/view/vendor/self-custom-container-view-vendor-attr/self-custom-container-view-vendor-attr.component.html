<div class="card" *ngIf="IsReady">
    <div class="card-body">
      <div class="px-3">
        <div class="row mt-md-n1">
          <div *ngFor="let attr of VendorAttrList; let i = index" class="col-md-6">
            <div class="row">
              <div class="col-md-6">
                <label class="adins-label">{{attr.AttrName}}</label>
              </div>
              <div class="col-md-6">
                <label class="adins-label">{{ ListVendorAttrContent[i].AttrContent == '' ? '-' : ListVendorAttrContent[i].AttrContent }}</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
