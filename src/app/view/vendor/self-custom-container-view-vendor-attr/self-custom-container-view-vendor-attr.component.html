<div class="card bg-light-blue-card" *ngIf="IsReady">
    <div class="card-body">
      <div class="row">
        <div class="form-body p-3">
          <div class="form-group row">
            <div *ngFor="let attr of VendorAttrList; let i = index" class="col-xxl-2 col-xl-3 col-lg-4 col-md-6 col-xs-12 py-2">
              <span>
                <div class="col-md-12">
                  <label class="label-control label-field" translate>{{attr.AttrName}}</label>
                </div>
                <div class="col-md-12">
                  <span>
                    <label class="label-control label-value breakword" translate>{{ ListVendorAttrContent[i].AttrContent == '' ? '-' : ListVendorAttrContent[i].AttrContent }}</label>
                  </span>
                </div>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
