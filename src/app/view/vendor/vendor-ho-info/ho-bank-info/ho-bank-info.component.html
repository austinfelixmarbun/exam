<div class="card-header header-title">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="px-3">
            <form>
              <lib-ucSubsection [id]="'BankAccId'" [title]="'Bank Account List'" [panel]="'BankAcc'">
              </lib-ucSubsection>
              <div id="BankAcc">
                <table class="table table-responsive-md text-center table-hover">
                  <thead>
                    <tr class="table-header">
                      <th><span translate class="thead-header">Bank</span></th>
                      <th><span translate class="thead-header" name='AccountNo'>Account
                          No</span>
                      </th>
                      <th><span translate class="thead-header" name='AccountName'>Account
                          Name</span>
                      </th>
                      <th><span translate class="thead-header" name='IsDefault'>Default</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody *ngIf="ListData?.length == 0">
                    <tr>
                      <td colspan="100%">No Data Available</td>
                    </tr>
                  </tbody>
                  <tbody>
                    <tr *ngFor="let item of ListData; let i = index">
                      <td>{{item.BankName}}</td>
                      <td>{{item.BankAccountNo}}</td>
                      <td>{{item.BankAccountName}}</td>
                      <td>{{item.IsDefault}}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
