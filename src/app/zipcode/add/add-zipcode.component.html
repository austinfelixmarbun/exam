<div class="col-md-12">
  <div class="card">
    <div class="card-body">
      <div class="px-3">
        <div class="addEdit">
          <form class="form form-horizontal" [formGroup]="RefZipCodeForm" (ngSubmit)="RefZipCodeForm.valid && SaveForm()"
                #enjiForm="ngForm">
            <div class="form-body">
              <h4 class="form-section card-title" translate><i class="ft-file-text"></i> ZipCode Information</h4>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kelurahan </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AreaCode2"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.AreaCode2.invalid }"
                         [attr.disabled]="pageType == 'edit' ? true : null">
                  <show-errors [control]="RefZipCodeForm.controls.AreaCode2" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Kecamatan </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="AreaCode1"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.AreaCode1.invalid }">
                  <show-errors [control]="RefZipCodeForm.controls.AreaCode1" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>City </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="City"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.City.invalid }">
                  <show-errors [control]="RefZipCodeForm.controls.City" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Zipcode </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="Zipcode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.Zipcode.invalid }">
                  <show-errors [control]="RefZipCodeForm.controls.Zipcode" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Sub Zipcode </label>
                <div class="col-md-9">
                  <input type="text" class="form-control adInsInput" formControlName="SubZipcode"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.SubZipcode.invalid }">
                  <show-errors [control]="RefZipCodeForm.controls.SubZipcode" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>District </label>
                <div class="col-md-9">
                  <lib-uclookupgeneric width-75-per [lookupInput]="inputDistrictLookupObj" [identifier]="'RefProvDistrictId'" [enjiForm]='enjiForm' [parentForm]='RefZipCodeForm'>
                  </lib-uclookupgeneric>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Phone Area Number </label>
                <div class="col-md-9">
                  <input type="number" class="form-control adInsInput" formControlName="PhnArea"
                         [ngClass]="{ 'is-invalid': enjiForm.submitted && RefZipCodeForm.controls.PhnArea.invalid }">
                  <show-errors [control]="RefZipCodeForm.controls.PhnArea" [submit]="enjiForm.submitted"></show-errors>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-md-3  adInsLabel" translate>Active Status </label>
                <div class="col-md-9">
                  <input class="border-primary" type="checkbox" data-md-icheck
                         formControlName="IsActive" />
                </div>
              </div>
            </div>
            <div class="form-actions right">
              <button type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/zipcode/paging']"
                      translate>
                <i class="ft-x"></i> Back
              </button>
              <button type="submit" class="btn btn-raised btn-primary" translate>
                <i class="fa fa-check-square-o"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
