<div class="col-md-12">
    <div class="card">
        <div class="card-body">
            <div class="px-3">
                <form class="form form-horizontal" name="BankAddReqForm" #BankAddReqForm="ngForm"
                    (ngSubmit)="BankAddReqForm.form.valid && Save(BankAddReqForm, uclDistrict)">
                    <div class="form-body">
                        <h4 class="form-section card-title" translate><i class="ft-file-text"></i> Zipcode Information
                        </h4>
                        <div class="form-group row">
                            <label class="col-md-3  adInsLabel" translate>Kelurahan </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control adInsInput" name="areaCode2" required [ngModel]="result?.areaCode2" 
                                #AreaCode2="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || AreaCode2.touched || AreaCode2.dirty) && AreaCode2.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || AreaCode2.touched || AreaCode2.dirty) && AreaCode2.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="AreaCode2.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Kecamatan </label>
                            <div class="col-md-9">
                                <input type="text" class="form-control adInsInput" name="areaCode1" required [ngModel]="result?.areaCode1" 
                                #AreaCode1="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || AreaCode1.touched || AreaCode1.dirty) && AreaCode1.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || AreaCode1.touched || AreaCode1.dirty) && AreaCode1.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="AreaCode1.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>City </label>
                            <div class="col-md-9">
                                <input class="form-control adInsInput" name="city" required [ngModel]="result?.city" 
                                #City="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || City.touched || City.dirty) && City.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || City.touched || City.dirty) && City.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="City.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Zipcode </label>
                            <div class="col-md-9">
                                <input class="form-control adInsInput" name="zipcode" required [ngModel]="result?.zipcode" 
                                #Zipcode="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || Zipcode.touched || Zipcode.dirty) && Zipcode.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || Zipcode.touched || Zipcode.dirty) && Zipcode.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="Zipcode.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Sub Zipcode </label>
                            <div class="col-md-9">
                                <input class="form-control adInsInput" name="subZipcode" required [ngModel]="result?.subZipcode" 
                                #SubZipcode="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || SubZipcode.touched || SubZipcode.dirty) && SubZipcode.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || SubZipcode.touched || SubZipcode.dirty) && SubZipcode.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="SubZipcode.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Zipcode Number </label>
                            <div class="col-md-9">
                                <input class="form-control adInsInput" name="zipcodeNumber" required [ngModel]="result?.zipcodeNumber" 
                                #ZipcodeNumber="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || ZipcodeNumber.touched || ZipcodeNumber.dirty) && ZipcodeNumber.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || ZipcodeNumber.touched || ZipcodeNumber.dirty) && ZipcodeNumber.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="ZipcodeNumber.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>District </label>
                            <div class="col-md-9">
                                <lib-lookupdistrict #uclDistrict [lookupInput]="inputLookupObj" [parentForm]='BankAddReqForm'></lib-lookupdistrict>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Phone Area Number </label>
                            <div class="col-md-9">
                                <input class="form-control adInsInput" name="phnArea" required [ngModel]="result?.phnArea" 
                                #PhnArea="ngModel"
                                [ngClass]="{ 'is-invalid': (BankAddReqForm.submitted || PhnArea.touched || PhnArea.dirty) && PhnArea.invalid }">
                                <div *ngIf="(BankAddReqForm.submitted || PhnArea.touched || PhnArea.dirty) && PhnArea.invalid"
                                  class="invalid-feedback">
                                  <div *ngIf="PhnArea.errors.required" class="adInsReqMsg" translate>This field is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-3 adInsLabel" translate>Is Active </label>
                            <div class="col-md-9">
                                <input class="border-primary" type="checkbox" [ngModel]="isActive" data-md-icheck
                                    (change)="toggleVisibility($event)" name="isActive">
                            </div>
                        </div>
                    </div>
                    <div class="form-actions right">
                        <button *ngIf="mode=='edit'" type="button" class="btn btn-raised btn-warning mr-1" [routerLink]="['/zipcode/paging']"
                            translate>
                            <i class="fa fa-arrow-circle-left"></i> Back
                        </button>
                        <button type="submit" class="btn btn-raised btn-primary" translate>
                            <i class="fa fa-check-square-o"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
