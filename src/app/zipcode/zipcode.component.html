<app-search id="ucSearch" style="width:100%;" [_url]='urlJson' [apiQryPaging]='urlQryPaging'
  [enviromentUrl]='urlEnviPaging' (result)="getResult($event)"></app-search>

<table class="table table-responsive-md text-center table-hover">
  <thead>
    <tr class="table-header">
      <th translate (click)="searchSort($event)" name='areaCode2'>Kelurahan</th>
      <th translate (click)="searchSort($event)" name='areaCode1'>Kecamatan</th>
      <th translate (click)="searchSort($event)" name='city'>City</th>
      <th translate (click)="searchSort($event)" name='zipcode'>Zipcode</th>
      <th translate (click)="searchSort($event)" name='subZipcode'>Sub Zipcode</th>
      <th translate (click)="searchSort($event)" name='rpd.name'>District Name</th>
      <th translate>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of resultData?.data">
      <td>{{item.areaCode2}}</td>
      <td>{{item.areaCode1}}</td>
      <td>{{item.city}}</td>
      <td>{{item.zipcode}}</td>
      <td>{{item.subZipcode}}</td>
      <td>{{item.name}}</td>
      <td>
        <a class="success p-0" data-original-title="" title="" [routerLink]="['/zipcode/add']"
          [queryParams]="{refZipcodeId:item.refZipcodeId,mode:'edit'}">
          <i class="ft-edit-2 font-medium-3 mr-2"></i>
        </a>
        <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refZipcodeId)">
          <i class="ft-trash-2 font-medium-3 mr-2"></i>
        </a>
      </td>
    </tr>
  </tbody>
</table>
<app-ucgrid-footer (select)="onSelect($event)"></app-ucgrid-footer>
