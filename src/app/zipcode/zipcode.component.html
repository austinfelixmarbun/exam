<div class="ucSearch-Button-Right">
    <span class="mr-1">
        <button type="button" class="addButton" [routerLink]="['/zipcode/add']" translate>
            <i class="ft-plus-circle"></i> Add
        </button>
    </span>
</div>
<lib-UCSearch id="ucSearch" style="width:100%;" [searchInput]='inputObj' (result)="getResult($event)"></lib-UCSearch>

<div [hidden]="resultData?.data == null">
  <table class="table table-responsive-md text-center table-hover">
    <thead>
      <tr class="table-header">
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='areaCode2'>Kelurahan</span></th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='areaCode1'>Kecamatan</span></th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='city'>City</span></th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='zipcode'>Zipcode</span></th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='subZipcode'>Sub Zipcode</span></th>
        <th class="text-left"><span translate class="thead-header" (click)="searchSort($event)" name='rpd.name'>District Name</span></th>
        <th translate>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resultData?.data">
        <td class="text-left">{{item.areaCode2}}</td>
        <td class="text-left">{{item.areaCode1}}</td>
        <td class="text-left">{{item.city}}</td>
        <td class="text-left">{{item.zipcode}}</td>
        <td class="text-left">{{item.subZipcode}}</td>
        <td class="text-left">{{item.name}}</td>
        <td>
          <a class="success p-0" data-original-title="" title="" [routerLink]="['/zipcode/edit']"
            [queryParams]="{refZipcodeId:item.refZipcodeId,mode:'edit'}">
            <i class="ft-edit-2 font-medium-3 mr-2"></i>
          </a>
          <a class="danger p-0" data-original-title="" title="" (click)="delete(item.refZipcodeId)">
            <i class="ft-trash-2 font-medium-3 mr-2"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <lib-ucgridfooter (select)="onSelect($event)"></lib-ucgridfooter>
</div>
